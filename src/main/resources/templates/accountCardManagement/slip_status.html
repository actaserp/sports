<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>전표입력 현황</h2>
        <a class="bookmark toggle" title="북마크">
          내 메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>입금관리</li>
        <li>전표입력 현황</li>
      </ul>
    </div>
    <form autocomplete="off" id="searchForm">
      <section class="section" style="padding-top: 10px; padding-bottom: 0px;">
        <div class="section-top">
          <div class="search-wrap">
            <dl>
              <dt>
                <label>
                  승인 기간<span class="eq"></span>
                </label>
              </dt>
              <dd>
                <div class="srch-box">
                  <input id="searchfrdate" name="searchfrdate" type="date"/>
                  <span class="slow_sign">~</span>
                  <input id="searchtodate" name="searchtodate" type="date"/>
                </div>
              </dd>
            </dl>

            <dl>
              <dt>
                <label>
                  재원구분
                </label>
              </dt>
              <dd>
                <select class="form-control2" id="mssec" name="mssec" >
                </select>
              </dd>
            </dl>

            <dl>
              <dt>
                <label>
                  제목
                </label>
              </dt>
              <dd>
                <input id="search_sbuject" name="search_sbuject" placeholder="제목을 입력하세요" type="text"/>
              </dd>
            </dl>

            <dl>
              <dt>&nbsp;</dt>
              <dd>
                <li>
                  <button class="btn btn-delete" id="btnSearch" title="검색" type="button">
                    <!--                                        class 쓰이는 곳 찾고 없으면 클래스명 수정하기-->
                    <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                    검색
                  </button>
                </li>
              </dd>
            </dl>
          </div>
        </div>
      </section>
    </form>

    <section class="section">
      <div class="grid_box" id="divList">
        <!--<div class="title_box">
          <ul>
            <li class="right_align rpt" style="margin-right: 5px">
              <a class="btn btn-edit" id="btnSlipPrint" title="전표출력">
                <img alt="추가 아이콘" th:src="@{/images/icon/ico-edit.svg}">
                전표 출력
              </a>
            </li>
          </ul>
        </div>-->
        <div id="theGrid_slip_list" style="height: 540px;"></div>
      </div>
    </section>
  </div>

  <!-- 전표 출력 미리보기 팝업 템플릿 -->
  <script type="text/x-tmpl" id="printSelectTemplate">
    <div class="content_wrap popup" style="display:flex;flex-direction:column;height:100%;">
      <section class="section" style="display:flex;flex-direction:column;height:100%;padding:0;">

        <!-- 상단 컨트롤 바 -->
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
                    border-bottom:1px solid #e5e7eb;flex-shrink:0;">
          <label style="font-size:13px;font-weight:600;white-space:nowrap;">출력 양식</label>
          <select id="ppPrintType"
            style="padding:-41px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
            <option value="1">전표(산출내역)</option>
            <option value="2">결의양식1</option>
            <option value="3">결의양식2(하단)</option>
            <option value="4">결의양식2(상단)</option>
            <option value="5">결의양식3(세입세출)</option>
            <option value="6">결의양식3(대체)</option>
            <option value="7">전표(산출내역):하단결재</option>
            <option value="8">결의양식(한자)</option>
          </select>
          <button type="button" id="ppPrintBtn"
            style="padding:6px 18px;background:#1a56db;color:#fff;
                   border:none;border-radius:4px;font-size:13px;font-weight:700;cursor:pointer;">
            🖨️ 인쇄
          </button>
          <!-- PopupDraggable이 자동으로 닫기 이벤트 연결해줌 -->
          <button type="button" id="modal-close-button"
            style="padding:6px 14px;background:#6c757d;color:#fff;
                   border:none;border-radius:4px;font-size:13px;cursor:pointer;">
            닫기
          </button>
        </div>

        <!-- iframe 미리보기 영역 -->
        <div style="flex:1;overflow:hidden;">
          <iframe id="ppIframe" style="width:100%;height:100%;border:none;"></iframe>
        </div>

      </section>
    </div>
  </script>

</th:block>
<th:block layout:fragment="scripts">
  <script type="text/javascript">
   class SlipStatusPage {
    constructor() {
     this.url = '/api/account_management/slip_status';
     this.grid = null;
     this.viewData = new wijmo.collections.CollectionView();
     this.init();
    }

    init(){
     let _this = this;
     _this.grid = new wijmo.grid.FlexGrid('#theGrid_slip_list', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Cell,
      isReadOnly: false,
      imeEnabled: true,
      frozenColumns:2,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
       if (e.panel.cellType === wijmo.grid.CellType.Cell) {
        const col = s.columns[e.col];
        if (col.binding === 'tiosec') {
         const val = e.cell.textContent.trim();
         if (val === '세입') {
          e.cell.style.color = 'red';
         } else if (val === '세출') {
          e.cell.style.color = 'black';
         } else if (val === '대체') {
          e.cell.style.color = 'green';
         } else {
          e.cell.style.color = '';  // 초기화
         }
        } else {
         e.cell.style.color = '';  // 다른 컬럼 초기화
        }
       }
      },
      columns: [
       {
        binding: 'selected',
        header: '인쇄',
        width: 50,
        align: 'center',
        dataType: wijmo.DataType.Boolean,
        isReadOnly: false   // 체크박스만 편집 가능
       },
       {binding: 'setnum', header: '관리번호', width: 100, align: 'center', visible: false, isReadOnly: true},
       {binding: 'spdate', header: '전표일자', width: 100, align: 'center', isReadOnly: true},
       {binding: 'spnum', header: '전표번호', width: 80, align: 'center', isReadOnly: true},
       {binding: 'tiosec', header: '구분', width: 100, align: 'center', isReadOnly: true},
       {binding: 'amt', header: '금액', width: 150, align: 'right', format: 'n0', isReadOnly: true},
       {binding: 'it2nm', header: '목', width: 120, align: 'center', isReadOnly: true},
       {binding: 'subject', header: '제목', width: 300, align: 'left', isReadOnly: true},
       {binding: 'businm', header: '사업명', width: 250, align: 'left', isReadOnly: true},
       {binding: 'buiscd_cnt', header: '회차', width: 100, align: 'center', isReadOnly: true},
       {binding: 'fixflag', header: '확정', width: 80, align: 'center', isReadOnly: true},
       {binding: 'mssec', header: '재원', width: 100, align: 'center', isReadOnly: true},
       {binding: 'appgubun', header: '결재상태', width: 100, align: 'center', isReadOnly: true},
       {binding: 'apppernm', header: '작성자', width: 100, align: 'center', isReadOnly: true},
       {binding: 'spoccu', header: '증빙구분', width: 100, align: 'center', isReadOnly: true},
       {binding: 'banknm', header: '은행', width: 200, align: 'center', isReadOnly: true},
       {binding: 'cltnm', header: '거래처', width: 150, align: 'center', isReadOnly: true},
       {binding: 'cardnm', header: '카드', width: 150, align: 'center', isReadOnly: true},
      ],
      itemsSource: this.viewData,
     });
     new FlexGridContextMenu(this.grid);
     _this.grid.downloadFileName = '전표내역';

     // footer 합계행 추가
     _this.grid.columnFooters.rows.push(new wijmo.grid.GroupRow());

     // '일자' 컬럼 위치에 합계 표시
     const apvDtColIndex = _this.grid.columns.findIndex(c => c.binding === 'spdate');
     if (apvDtColIndex > -1) {
      _this.grid.columnFooters.setCellData(0, apvDtColIndex, '합계');
     }

     // 금액 컬럼 aggregate 지정
     const buySumCol = _this.grid.columns.getColumn('amt');
     if (buySumCol) {
      buySumCol.aggregate = wijmo.Aggregate.Sum;
     }


    }//init

    searchMainData() {
     let _this = this;
     let url = this.url + '/read';
     let start = $('#searchfrdate').val();
     let end = $('#searchtodate').val();

     let data = {
      'start': start,
      'end': end,
      mssec: $('#mssec').val(),
      sbuject : $('#search_sbuject').val(),
     };
     let fnsuccess = function (result) {
      if (result != null && result.success) {
       _this.viewData.sourceCollection = result.data;
      } else {
       console.log('전표입력현황 read 오류');
      }
     }

     AjaxUtil.getAsyncData(url, data, fnsuccess);
    }

    // 전표 출력 팝업 열기
    showPrintSelectPopup() {
     let _this = this;
     // html2pdf.js 동적 로드
     if (!document.getElementById('html2pdf-script')) {
      const script = document.createElement('script');
      script.id = 'html2pdf-script';
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      document.head.appendChild(script);
     }

     const existing = document.getElementById('slip-print-overlay');
     if (existing) existing.remove();

     const selectedItems = _this.viewData.sourceCollection.filter(r => r.selected);
     const keys = selectedItems.map(r => r.spdate.replace(/-/g, '') + r.spnum).join(',');
     console.log('keys:', keys);

     fetch(withCtx(`/api/account_management/slip_status/print?printType=1&keys=${encodeURIComponent(keys)}`))
     .then(r => r.json())
     .then(d => {
      console.log('전체:', d);
      console.log('전표 수:', d.data?.length);
      if(d.data?.length > 0) {
       console.log('첫번째 전표:', d.data[0]);
       console.log('차변:', d.data[0].debit);
       console.log('대변:', d.data[0].credit);
       console.log('amt:', d.data[0].amt);
      }
     });

     // ── 스타일 ──
     const css = `
        #slip-print-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.5);
            z-index:10000; display:flex; align-items:center; justify-content:center;
        }
        #slip-print-popup {
            width:88vw; max-width:1100px; height:88vh;
            background:#fff; border-radius:12px;
            box-shadow:0 24px 48px rgba(0,0,0,.2);
            display:flex; flex-direction:column; overflow:hidden;
        }
        #slip-print-popup .sp-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 20px; border-bottom:1px solid #e5e7eb; flex-shrink:0;
        }
        #slip-print-popup .sp-body { flex:1; overflow:hidden; }
        #slip-print-popup .sp-body iframe { width:100%; height:100%; border:none; }
    `;
     let styleEl = document.getElementById('slip-print-style');
     if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'slip-print-style';
      document.head.appendChild(styleEl);
     }
     styleEl.textContent = css;

     // ── 팝업 HTML ──
     // 인쇄/다운로드 버튼 없음 → 브라우저 PDF toolbar가 자동으로 제공
     const overlay = document.createElement('div');
     overlay.id = 'slip-print-overlay';

     const popup = document.createElement('div');
     popup.id = 'slip-print-popup';
     popup.innerHTML = `
        <div class="sp-head">
            <span style="font-size:18px;font-weight:700;color:#111;">전표 출력 미리보기</span>
            <div style="display:flex;gap:8px;align-items:center;">
                <select id="spPrintType"
                    style="padding:-1px 10px;border:1px solid #ddd;border-radius:4px;">
                    <option value="1">전표(산출내역)</option>
                    <option value="2">결의양식1</option>
                    <option value="3">결의양식2(하단)</option>
                    <option value="4">결의양식2(상단)</option>
                    <option value="5">결의양식3(세입세출)</option>
                    <option value="6">결의양식3(대체)</option>
                    <option value="7">전표(산출내역):하단결재</option>
                    <option value="8">결의양식(한자)</option>
                </select>
                <button id="spPrintBtn"
                style="padding:6px 18px;background:#1a56db;color:#fff;
                       border:none;border-radius:4px;font-size:13px;
                       font-weight:700;cursor:pointer;">
                인쇄
            </button>
            <button id="spDownloadBtn"
                style="padding:6px 18px;background:#059669;color:#fff;
                       border:none;border-radius:4px;font-size:13px;
                       font-weight:700;cursor:pointer;">
                PDF 저장
            </button>

            <button id="spCloseBtn"
                style="background:none;border:none;font-size:20px;
                       color:#9ca3af;cursor:pointer;line-height:1;padding:4px;">✕
            </button>
            </div>
        </div>
        <!-- ↓ PDF iframe → 브라우저가 toolbar(인쇄/다운로드) 자동 제공 -->
        <div class="sp-body">
            <iframe id="spIframe" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    `;

     overlay.appendChild(popup);
     document.body.appendChild(overlay);

     // ── iframe에 PDF URL 세팅 ──
     function renderPreview(printType) {
      // printType=1, keys=20260420-0761,... 형태로 요청
      const url = `${_this.url}/print?printType=${printType}&keys=${encodeURIComponent(keys)}`;
      document.getElementById('spIframe').src = withCtx(url);
     }

     renderPreview(document.getElementById('spPrintType').value);

     document.getElementById('spPrintType').addEventListener('change', function () {
      renderPreview(this.value);
     });

     document.getElementById('spCloseBtn').addEventListener('click', function () {
      overlay.remove();
     });

     document.getElementById('spDownloadBtn').addEventListener('click', function () {
      const printType = document.getElementById('spPrintType').value;
      const url = withCtx(`${_this.url}/print/pdf?printType=${printType}&keys=${encodeURIComponent(keys)}`);

      // 링크 클릭으로 다운로드
      const a = document.createElement('a');
      a.href = url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
     });

     // 기존 이벤트들 아래에 추가
     document.getElementById('spPrintBtn').addEventListener('click', function () {
      const iframe = document.getElementById('spIframe');
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
     });

     overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
     });
    }

   }
   let page = null;

   $(document).ready(function (e) {
    page = new SlipStatusPage();

    let fr = new Date();
    fr.setDate(1);
    fr.setMonth(fr.getMonth());

    $('#searchfrdate').val(CommonUtil.formatYYYYMMDD(fr));
    $('#searchtodate').val(getNowDate());

    AjaxUtil.fillSelectOptions($('#mssec'), 'mssec', 'all', false);

    page.searchMainData();

    $('#search_sbuject').on('keydown', function(e) {
     if (e.key === 'Enter') {
      e.preventDefault();
      page.searchMainData();
     }
    });

    $('#btnSearch').on('click', function () {
     page.searchMainData();
    });

    // 전표 출력 버튼
    $('#btnSlipPrint').on('click', function () {
     const selectedItems = page.viewData.sourceCollection?.filter(r => r.selected);
     if (!selectedItems || selectedItems.length === 0) {
      Alert.alert('', '출력할 전표를 선택(체크)해주세요.');
      return;
     }
     page.showPrintSelectPopup();
    });

   });

  </script>
</th:block>
