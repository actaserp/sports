<!--
  사업계획서(월별) — PowerBuilder w_tb_x0002_sh2 / d_tb_x0002_sh2 이식. 2026-11-11
  * 사업년도 입력(비우면 당해 연도) → 조회 / 인쇄 / EXCEL. Wijmo 그리드 없이 일반 표로 그린다.
  * 열: 월 · 사업구분 · 사업명 · 사업기간(FROM) · 사업기간(TO) · 장소 · 참가인원
  * 월 = 사업기간(FROM)의 월. 정렬: 사업기간(FROM) → 부문 순서(seqno) → 부문 → 사업코드 (원본 ORDER BY a.frdate, b.seqno)
  * 월은 바뀌는 첫 행에만 표시
  * 인쇄: A4 가로, 한 쪽 25줄, 쪽마다 머리글 · '페이지 : n (전체)'. 인쇄 여백 0 이라 브라우저 머리글이 찍히지 않는다
  * API  GET /api/budget/report/planByMonth?yyyy=
-->
<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <style>
      .layout-contents { height: 100vh !important; min-height: 0 !important; box-sizing: border-box; padding-bottom: 8px !important; overflow: hidden !important; }
      .layout-contents section { flex: 1 1 auto !important; min-height: 0 !important; overflow: auto !important; }

      .pm-bar { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
      .pm-bar dl dt { font-size: 14px; font-weight: 700; color: #4d4d4d; margin-bottom: 4px; }
      .pm-bar .right { margin-left: auto; display: flex; gap: 6px; }

      /* 화면 목록 */
      .pm-list-wrap { max-height: 620px; overflow: auto; border: 1px solid #dee2e6; }
      table.pm-list { width: 100%; border-collapse: collapse; table-layout: fixed; border-top: none; font-size: 14px; }
      table.pm-list th {
          position: sticky; top: 0; z-index: 1; background: #edeff5; height: 40px; width: auto;
          border-bottom: 1px solid #c6c6c6; padding: 0 8px; text-align: center; font-weight: 700;
      }
      table.pm-list td {
          height: 34px; padding: 0 8px; border-bottom: 1px solid #ebebeb;
          white-space: normal; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3;
      }
      table.pm-list td.l { text-align: left; }
      table.pm-list td.c { text-align: center; }
      table.pm-list tr.new-month td { border-top: 1px solid #c6c6c6; }
      table.pm-list tbody tr:hover td { background: #f5f9ff; }
      .pm-empty { text-align: center; color: #888; padding: 40px 0 !important; }

      /* 인쇄용 (화면에서는 숨김) */
      #pmPrint { display: none; }
      .pm-paper {
          width: 297mm; height: 210mm; box-sizing: border-box; background: #fff;
          padding: 10mm 12mm 8mm; font-family: 'Malgun Gothic', sans-serif; color: #000;
          display: flex; flex-direction: column; overflow: hidden;
      }
      .pm-paper .pm-body { flex: 1; min-height: 0; overflow: hidden; }
      /* 줄바꿈되는 칸이 있어도 숫자는 한 줄 */
      table.pm td.c { white-space: nowrap; }
      .pm-title { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 2px; margin: 0 0 12px; }
      .pm-title-space { height: 34px; margin: 0 0 12px; }
      .pm-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
      .pm-page-no { text-align: center; font-size: 11px; padding-top: 4px; }
      table.pm { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5px; border-top: none; }
      table.pm th, table.pm td {
          border: 1px solid #000; height: 19px; padding: 1px 6px; background: #fff; width: auto;
          font-weight: 400; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3;
      }
      table.pm th { text-align: center; }
      table.pm td.l { text-align: left; }
      table.pm td.c { text-align: center; }

      @page { size: A4 landscape; margin: 0; }
      @media print {
          body * { visibility: hidden; }
          #pmPrint, #pmPrint * { visibility: visible; }
          #pmPrint { display: block; position: absolute; left: 0; top: 0; }
          .pm-paper { page-break-after: always; break-after: page; }
          .pm-paper:last-child { page-break-after: auto; break-after: auto; }
          * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>사업계획서(월별)</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>예산관리</li>
        <li>예산서출력</li>
        <li>사업계획서(월별)</li>
      </ul>
    </div>

    <section>
      <div class="pm-bar">
        <dl>
          <dt><label for="pmYyyy">사업년도</label></dt>
          <dd><input id="pmYyyy" maxlength="4" style="width:90px; text-align:center;" type="text"/></dd>
        </dl>
        <button class="btn btn-delete" id="btnPmSearch" title="조회" type="button">
          <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}"> 조회
        </button>
        <span id="pmCount" style="font-size:13px; color:#666; margin-bottom:8px;"></span>
        <div class="right">
          <a class="btn btn-edit" id="btnPmPrint" title="인쇄">
            <img alt="인쇄 아이콘" th:src="@{/images/icon/ico-edit.svg}"> 인쇄
          </a>
          <a class="btn btn-excell" id="btnPmExcel" title="EXCEL">EXCEL</a>
        </div>
      </div>

      <div class="pm-list-wrap">
        <table class="pm-list">
          <colgroup>
            <col style="width:6%"><col style="width:12%"><col style="width:30%"><col style="width:11%">
            <col style="width:11%"><col style="width:18%"><col style="width:12%">
          </colgroup>
          <thead><tr>
            <th>월</th><th>사업구분</th><th>사업명</th><th>사업기간(FROM)</th>
            <th>사업기간(TO)</th><th>장소</th><th>참가인원</th>
          </tr></thead>
          <tbody id="pmBody"><tr><td class="pm-empty" colspan="7">사업년도를 입력하고 조회하세요.</td></tr></tbody>
        </table>
      </div>
    </section>
  </div>

  <div id="pmPrint"></div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   (function () {
    const API = '/api/budget/report/planByMonth';
    const HEAD = ['월', '사업구분', '사업명', '사업기간(FROM)', '사업기간(TO)', '장소', '참가인원'];
    let last = null;   // 마지막 조회 결과

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
     c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    const ymd = v => {   // 'yyyymmdd' → 'yyyy.mm.dd'
     const d = String(v == null ? '' : v).replace(/[^0-9]/g, '');
     return d.length === 8 ? `${d.substring(0, 4)}.${d.substring(4, 6)}.${d.substring(6, 8)}` : '';
    };
    const now = () => {
     const d = new Date(), p = n => String(n).padStart(2, '0');
     return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    // 한 행의 표시 값 (월은 바로 위 행과 같으면 비운다)
    const cells = (r, prev) => [
     prev && prev.sdate === r.sdate ? '' : (r.sdate || ''),
     r.bsecnm || r.bseccd || '',
     r.businm || '',
     ymd(r.frdate), ymd(r.todate),
     r.place || '', r.entno || '',
    ];

    function render() {
     const rows = last.rows;
     $('#pmCount').text(`${last.yyyy}년 · ${rows.length}건`);
     if (!rows.length) {
      $('#pmBody').html(`<tr><td class="pm-empty" colspan="7">${esc(last.yyyy)}년 사업 자료가 없습니다.</td></tr>`);
      return;
     }
     $('#pmBody').html(rows.map((r, i) => {
      const prev = i > 0 ? rows[i - 1] : null;
      const c = cells(r, prev);
      const cls = prev && prev.sdate !== r.sdate ? ' class="new-month"' : '';
      return `<tr${cls}>`
       + `<td class="c">${esc(c[0])}</td><td class="l">${esc(c[1])}</td><td class="l" title="${esc(c[2])}">${esc(c[2])}</td>`
       + `<td class="c">${esc(c[3])}</td><td class="c">${esc(c[4])}</td>`
       + `<td class="l" title="${esc(c[5])}">${esc(c[5])}</td><td class="l">${esc(c[6])}</td></tr>`;
     }).join(''));
    }

    function retrieve() {
     let yyyy = String($('#pmYyyy').val() || '').trim();
     if (yyyy === '') { yyyy = String(new Date().getFullYear()); $('#pmYyyy').val(yyyy); }
     if (!/^\d{4}$/.test(yyyy)) {
      Alert.alert('', '사업년도를 4자리로 입력하세요.');
      $('#pmYyyy').focus();
      return;
     }
     AjaxUtil.getAsyncData(API, {yyyy: yyyy}, res => {
      if (!res || !res.success) {
       Alert.alert('', (res && res.message) || '조회 중 오류가 발생했습니다.');
       return;
      }
      const data = res.data || {};
      last = {yyyy: data.yyyy, spjangnm: data.spjangnm, rows: data.rows || []};
      render();
     });
    }


    /**
     * 인쇄 쪽 나누기 — 줄 수가 아니라 실제 높이를 재서 넘치면 다음 쪽으로 넘긴다.
     * 긴 글자가 줄바꿈되어 행 높이가 달라져도 한 쪽을 넘치지 않는다.
     *  pageHtml(i): i번째 쪽 틀(빈 tbody, .pg-body, .pg-no 포함) / blocks: 함께 다닐 행 묶음 [[tr html, ...], ...]
     */
    function paginate(wrap, pageHtml, blocks) {
     const st = wrap.style;
     const hidden = getComputedStyle(wrap).display === 'none';
     if (hidden) { st.display = 'block'; st.position = 'absolute'; st.left = '-10000px'; st.top = '0'; }
     wrap.innerHTML = '';
     const pages = [];
     const add = () => {
      const t = document.createElement('div');
      t.innerHTML = pageHtml(pages.length).trim();
      const el = t.firstElementChild;
      wrap.appendChild(el);
      const pg = {el: el, body: el.querySelector('.pg-body'), tbody: el.querySelector('tbody')};
      pages.push(pg);
      return pg;
     };
     let cur = add();
     blocks.forEach(block => {
      const t = document.createElement('tbody');
      t.innerHTML = block.join('');
      const trs = [...t.children];
      trs.forEach(tr => cur.tbody.appendChild(tr));
      // 인쇄 시 글꼴·배율 차이로 화면보다 조금 길어지므로 여유(SAFE)를 둔다
      const SAFE = 24;
      if (cur.tbody.closest('table').getBoundingClientRect().bottom - cur.body.getBoundingClientRect().top > cur.body.clientHeight - SAFE && cur.tbody.children.length > trs.length) {
       trs.forEach(tr => tr.remove());
       cur = add();
       trs.forEach(tr => cur.tbody.appendChild(tr));
       // 새 쪽 첫 행의 반복값을 먼저 복원해서 높이에 반영
       const td = cur.tbody.querySelector('tr:first-child td[data-full]');
       if (td) td.textContent = td.dataset.full;
      }
     });
     pages.forEach((p, i) => {
      const n = p.el.querySelector('.pg-no');
      if (n) n.textContent = `페이지 : ${i + 1} (${pages.length})`;
      // 쪽 첫 행에서 숨겼던 반복값(월 · 사업구분 등)은 다시 보여준다
      const td = p.tbody.querySelector('tr:first-child td[data-full]');
      if (td) td.textContent = td.dataset.full;
     });
     if (hidden) { st.display = ''; st.position = ''; st.left = ''; st.top = ''; }
     return pages;
    }

    function buildPrint() {
     const rows = last.rows;
     const printed = now();
     const pageHtml = pi => `
      <div class="pm-paper">
       <div class="pm-body pg-body">
        ${pi === 0 ? `<div class="pm-title">${esc(last.yyyy)}년 사업계획서(월별)</div>` : `<div class="pm-title-space"></div>`}
        <div class="pm-meta"><span>${esc(last.spjangnm || '')}</span><span>출력일시 : ${printed}</span></div>
        <table class="pm">
          <colgroup>
            <col style="width:6%"><col style="width:12%"><col style="width:30%"><col style="width:11%">
            <col style="width:11%"><col style="width:18%"><col style="width:12%">
          </colgroup>
          <thead><tr>${HEAD.map(h => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody></tbody>
        </table>
       </div>
       <div class="pm-page-no pg-no"></div>
      </div>`;
     const blocks = rows.map((r, i) => {
      const c = cells(r, i > 0 ? rows[i - 1] : null);
      return [`<tr><td class="c" data-full="${esc(r.sdate || '')}">${esc(c[0])}</td><td class="l">${esc(c[1])}</td><td class="l">${esc(c[2])}</td>`
      + `<td class="c">${esc(c[3])}</td><td class="c">${esc(c[4])}</td><td class="l">${esc(c[5])}</td><td class="l">${esc(c[6])}</td></tr>`];
     });
     paginate(document.getElementById('pmPrint'), pageHtml, blocks);   // 쪽 첫 행의 월은 다시 보여준다
    }

    // 엑셀: 화면과 같은 열 · 값으로 xlsx 저장 (월은 모든 행에 채운다)
    function exportExcel() {
     const wb = new wijmo.xlsx.Workbook();
     const sheet = new wijmo.xlsx.WorkSheet();
     sheet.name = '사업계획서(월별)';
     const widths = [8, 14, 40, 16, 16, 30, 16];
     widths.forEach(w => { const col = new wijmo.xlsx.WorkbookColumn(); col.width = w * 7; sheet.columns.push(col); });
     const mkRow = (vals, bold) => {
      const row = new wijmo.xlsx.WorkbookRow();
      vals.forEach(v => {
       const cell = new wijmo.xlsx.WorkbookCell();
       cell.value = v;
       if (bold) { cell.style = new wijmo.xlsx.WorkbookStyle(); cell.style.font = new wijmo.xlsx.WorkbookFont(); cell.style.font.bold = true; }
       row.cells.push(cell);
      });
      return row;
     };
     sheet.rows.push(mkRow(HEAD, true));
     last.rows.forEach(r => sheet.rows.push(mkRow(cells(r, null))));
     wb.sheets.push(sheet);
     wb.saveAsync(`사업계획서(월별)_${last.yyyy}.xlsx`);
    }

    $(document).ready(function () {
     $('#pmYyyy').val(String(new Date().getFullYear()));
     $('#btnPmSearch').on('click', retrieve);
     $('#pmYyyy').on('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); retrieve(); } });
     $(document).on('keydown', e => { if (e.key === 'F4') { e.preventDefault(); retrieve(); } });
     $('#btnPmPrint').on('click', () => {
      if (!last || !last.rows.length) { Alert.alert('', '먼저 조회하세요.'); return; }
      buildPrint();
      window.print();
     });
     $('#btnPmExcel').on('click', () => {
      if (!last || !last.rows.length) { Alert.alert('', '먼저 조회하세요.'); return; }
      exportExcel();
     });
     retrieve();
    });
   })();
  </script>
</th:block>
</html>
