<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <style>
      .grid-guide-box {
          background: #eef3ff;
          border-left: 4px solid #2f5cff;
          padding: 6px 10px;
          font-size: 13px;
          margin-bottom: 6px;
          color: #333;
      }
      .split-wrap { display: flex; gap: 8px; }
      .split-left  { width: 640px; flex: 0 0 640px; }
      .split-right { flex: 1 1 auto; min-width: 0; }
  </style>
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>관별거래처원장</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>장부출력</li>
        <li>관별거래처원장</li>
      </ul>
    </div>
    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tab1" title="집계 내역">집계 내역</a></li>
        <li><a href="#tab2" id="tab2Link" title="상세내역">상세내역</a></li>
        <li><a href="#tab3" title="상세 내역">상세 내역</a></li>
      </ul>
      <div class="tab-contents">

        <!-- ── 집계 내역 (tab1) : 좌(관+금액) + 우(거래처+금액) 2분할 ── -->
        <section class="tab-item" id="tab1">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate1" name="searchfrdate1" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate1" name="searchtodate1" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목(관)</label></dt>
                <dd>
                  <input class="form-control2" id="accnm1" name="accnm1" placeholder="관 (엔터로 검색)" />
                  <input type="hidden" id="acccd1" name="acccd1" />
                </dd>
              </dl>
              <dl>
                <dt><label>거래처</label></dt>
                <dd>
                  <input class="form-control2" id="cltnm1" name="cltnm1" placeholder="거래처 (엔터로 검색)" />
                  <input type="hidden" id="cltcd1" name="cltcd1" />
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <li>
                    <button class="btn btn-delete" id="btnSearch1" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 왼쪽 계정과목을 선택하면 오른쪽에 거래처별 내역이 표시됩니다. (단축키 조회:F4)</div>
          <div class="split-wrap">
            <div class="split-left">
              <div id="theGrid_acc" style="height: 540px;"></div>
            </div>
            <div class="split-right">
              <div id="theGrid_clt" style="height: 540px;"></div>
            </div>
          </div>
        </section>

        <!-- ── 상세내역 (tab2) : 마스터 ── -->
        <section class="tab-item" id="tab2">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate2" name="searchfrdate2" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate2" name="searchtodate2" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목(관)</label></dt>
                <dd>
                  <input class="form-control2" id="accnm2" name="accnm2" placeholder="관 (엔터로 검색)" />
                  <input type="hidden" id="acccd2" name="acccd2" />
                </dd>
              </dl>
              <dl>
                <dt><label>거래처</label></dt>
                <dd>
                  <input class="form-control2" id="cltnm2" name="cltnm2" placeholder="거래처 (엔터로 검색)" />
                  <input type="hidden" id="cltcd2" name="cltcd2" />
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <li>
                    <button class="btn btn-delete" id="btnSearch2" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 행을 선택하면 상세내역 탭이 조회됩니다.</div>
          <div class="grid_box" id="divDetailMaster">
            <div id="theGrid_detail_master" style="height: 540px;"></div>
          </div>
        </section>

        <!-- ── 상세내역 (tab3) : 디테일 ── -->
        <section class="tab-item" id="tab3">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail">
            <div id="theGrid_detail" style="height: 540px;"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <!-- 관명 팝업 -->
  <script id="accnmTemplate" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="AccGrid" style="height:350px; display:block;"></div></section></div>
  </script>
  <!-- 거래처 팝업 -->
  <script id="cltTemplate" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="CltGrid" style="height:350px; display:block;"></div></section></div>
  </script>

</th:block>
<th:block layout:fragment="scripts">
  <th:block th:replace="common/popup_account :: popup_account" />
  <script type="text/javascript">
   class CategoryClientLedgerPage {
    constructor() {
     this.url = '/api/ledger/CategoryClientLedger';
     this.entry_url = '/api/account_management/slip_entry';
     this.accGrid1 = null;         // tab1 좌 - 관
     this.cltGrid1 = null;         // tab1 우 - 거래처
     this.detailMasterGrid = null; // tab2 - 마스터
     this.detailGrid = null;       // tab3 - 디테일
     this.tab2Name = '상세내역';
     this.init();
    }

    init() {
     let _this = this;

     // ══════════════════════════════════════
     // tab1 좌 : 관(계정과목) + 금액
     // ══════════════════════════════════════
     _this.accGrid1 = new wijmo.grid.FlexGrid('#theGrid_acc', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'accnm',  header: '계정과목', width: 160, align: 'left'},
       {binding: 'bfamt',  header: '전잔액',   width: 120, align: 'right', format: 'n0'},
       {binding: 'dramt',  header: '차변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 120, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.accGrid1);
     _this.accGrid1.downloadFileName = '계정과목';
     _this.accGrid1.columnFooters.rows.push(new wijmo.grid.GroupRow());
     let acIdx = _this.accGrid1.columns.findIndex(c => c.binding === 'accnm');
     if (acIdx > -1) _this.accGrid1.columnFooters.setCellData(0, acIdx, '합계');
     ['bfamt','dramt','cramt','balamt'].forEach(b => {
      const col = _this.accGrid1.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     _this.accGrid1.selectionChanged.addHandler(function () {
      const master = _this.accGrid1.selectedItems[0];
      if (master) _this.loadClientsByAcc(master);
     });

     // ══════════════════════════════════════
     // tab1 우 : 거래처별 내역
     // ══════════════════════════════════════
     _this.cltGrid1 = new wijmo.grid.FlexGrid('#theGrid_clt', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'it1nm',  header: '거래처',   width: 200, align: 'left'},
       {binding: 'bfamt',  header: '전잔액',   width: 120, align: 'right', format: 'n0'},
       {binding: 'dramt',  header: '차변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 120, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.cltGrid1);
     _this.cltGrid1.downloadFileName = '거래처별내역';
     _this.cltGrid1.columnFooters.rows.push(new wijmo.grid.GroupRow());
     let ctIdx = _this.cltGrid1.columns.findIndex(c => c.binding === 'it1nm');
     if (ctIdx > -1) _this.cltGrid1.columnFooters.setCellData(0, ctIdx, '합계');
     ['bfamt','dramt','cramt','balamt'].forEach(b => {
      const col = _this.cltGrid1.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     // tab1 우측 거래처 더블클릭 → tab2 이름 변경 + 이동 + 조회
     _this.cltGrid1.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.cltGrid1.hitTest(e);
      if (ht.cellType === wijmo.grid.CellType.Cell) {
       const item = _this.cltGrid1.selectedItems[0];
       if (item) _this.goToDetailFromSummary(item);
      }
     });

     // ══════════════════════════════════════
     // tab2 : 상세내역 (관→거래처 그룹 + 소계, 마스터)
     // ══════════════════════════════════════
     _this.detailMasterGrid = new wijmo.grid.FlexGrid('#theGrid_detail_master', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: false,
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      showGroups: true,
      groupHeaderFormat: '{value}',
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'it1nm',  header: '거래처',   width: 200, align: 'left'},
       {binding: 'yymmdd', header: '전표일자', width: 110, align: 'center'},
       {binding: 'dramt',  header: '차변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 140, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.detailMasterGrid);
     _this.detailMasterGrid.downloadFileName = '상세내역(마스터)';

     ['dramt','cramt'].forEach(b => {
      const col = _this.detailMasterGrid.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     // 그룹 푸터 : 거래처(레벨1)=거래처소계, 관(레벨0)=계정소계
     _this.detailMasterGrid.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType === wijmo.grid.CellType.Cell) {
       const row = s.rows[e.row];
       if (row instanceof wijmo.grid.GroupRow && row.dataItem == null) {
        const gr = row;
        const label = (gr.level === 1) ? '거래처소계' : '계정소계';
        const c0 = s.columns.findIndex(c => c.binding === 'it1nm');
        if (e.col === c0) {
         e.cell.style.color = '#d33'; e.cell.style.fontWeight = '600';
         e.cell.textContent = label;
        }
        const b = s.columns[e.col] && s.columns[e.col].binding;
        if (b === 'dramt' || b === 'cramt') {
         e.cell.style.color = '#d33'; e.cell.style.fontWeight = '600';
        }
       }
      }
     });

     _this.detailMasterGrid.selectionChanged.addHandler(function () {
      const item = _this.detailMasterGrid.selectedItems[0];
      if (item) _this.searchDetailByMaster(item);
     });

     // ══════════════════════════════════════
     // tab3 : 상세내역 (디테일)
     // ══════════════════════════════════════
     _this.detailGrid = new wijmo.grid.FlexGrid('#theGrid_detail', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'yymmdd', header: '전표일자', width: 110, align: 'center'},
       {binding: 'summy',  header: '비고',     width: '*', align: 'left'},
       {binding: 'dramt',  header: '차변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 140, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.detailGrid);
     _this.detailGrid.downloadFileName = '상세내역';
     _this.applySubtotalStyle(_this.detailGrid, 'summy');
     _this.detailGrid.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.detailGrid.hitTest(e);
      if (ht.cellType === wijmo.grid.CellType.Cell) {
       const item = _this.detailGrid.selectedItems[0];
       if (item) _this.openSlipFromRow(item);
      }
     });

    }//init

    // ══════════════════════════════════════
    // tab1 좌 : 관 목록 조회
    // ══════════════════════════════════════
    searchSummary() {
     let _this = this;
     let data = {
      start: $('#searchfrdate1').val(),
      end: $('#searchtodate1').val(),
      acccd: $('#acccd1').val(),
      cltcd: $('#cltcd1').val()
     };
     AjaxUtil.getAsyncData(this.url + '/read', data, function (result) {
      if (result != null && result.success) {
       _this.accGrid1.itemsSource = result.data || [];
       setTimeout(function () { if (_this.accGrid1.rows.length > 0) _this.accGrid1.select(0, 0); }, 50);
      } else { console.log('집계(관) 조회 오류'); }
     });
    }

    // 좌 관 선택 → 우 거래처별 조회
    loadClientsByAcc(master) {
     let _this = this;
     let data = {
      start: $('#searchfrdate1').val(),
      end: $('#searchtodate1').val(),
      acccd: master.acccd || '',
      it1cd: ''
     };
     AjaxUtil.getAsyncData(this.url + '/readClient', data, function (result) {
      if (result != null && result.success) {
       _this.cltGrid1.itemsSource = result.data || [];
      } else { console.log('거래처별 내역 조회 오류'); }
     });
    }

    // tab1 우 거래처 더블클릭 → tab2 이름 변경 + 이동 + 조회
    goToDetailFromSummary(item) {
     let _this = this;
     let name = (item.accnm || '') + (item.it1nm ? ' - ' + item.it1nm : '');
     _this.tab2Name = name || '상세내역';
     $('#tab2Link').text(_this.tab2Name).attr('title', _this.tab2Name);

     $('#acccd2').val(item.acccd || '');  $('#accnm2').val(item.accnm || '');
     $('#cltcd2').val(item.it1cd || '');  $('#cltnm2').val(item.it1nm || '');
     $('#searchfrdate2').val($('#searchfrdate1').val());
     $('#searchtodate2').val($('#searchtodate1').val());

     _this.activateTab(2);
     _this.searchDetailMaster();
    }

    // tab2 : 상세내역(마스터) 조회
    searchDetailMaster() {
     let _this = this;
     let data = {
      start: $('#searchfrdate2').val(),
      end:   $('#searchtodate2').val(),
      acccd: $('#acccd2').val(),
      it1cd: $('#cltcd2').val()
     };
     AjaxUtil.getAsyncData(this.url + '/readDetailMaster', data, function (result) {
      if (result != null && result.success) {
       const rows = result.data || [];
       const cv = new wijmo.collections.CollectionView(rows);
       cv.groupDescriptions.push(new wijmo.collections.PropertyGroupDescription('accnm')); // 관
       cv.groupDescriptions.push(new wijmo.collections.PropertyGroupDescription('it1nm')); // 거래처
       _this.detailMasterGrid.itemsSource = cv;
      } else { console.log('상세(tab2) 조회 오류'); }
     });
    }

    // tab2 행 선택 → tab3 조회
    searchDetailByMaster(master) {
     let _this = this;
     let data = {
      start: (master.frdate || $('#searchfrdate2').val()),
      end:   (master.todate || $('#searchtodate2').val()),
      acccd: master.acccd || '',
      it1cd: master.it1cd || ''
     };
     AjaxUtil.getAsyncData(this.url + '/readDetail', data, function (result) {
      if (result != null && result.success) _this.bindDetailGrid(_this.detailGrid, result.data || []);
      else console.log('상세(tab3) 조회 오류');
     });
    }

    // 상세 그리드 공통 : PB 행정리 + 98제외 합계 푸터
    bindDetailGrid(grid, rows) {
     rows = rows || [];
     rows = rows.filter(r => {
      const yy = String(r.yymmdd || '');
      if (yy.endsWith('97') || yy.endsWith('98')) return true;
      const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0;
      return (dr !== 0 || cr !== 0);
     });
     grid.itemsSource = rows;

     const foot = this.calcFooterExcludeSub(rows);
     const cf = grid.columnFooters;
     if (cf.rows.length === 0) cf.rows.push(new wijmo.grid.GroupRow());
     const cSummy = grid.columns.findIndex(c => c.binding === 'summy');
     const cDr = grid.columns.findIndex(c => c.binding === 'dramt');
     const cCr = grid.columns.findIndex(c => c.binding === 'cramt');
     if (cSummy > -1) cf.setCellData(0, cSummy, '합계');
     if (cDr > -1) cf.setCellData(0, cDr, foot.dramt);
     if (cCr > -1) cf.setCellData(0, cCr, foot.cramt);
    }

    calcFooterExcludeSub(rows) {
     let dr = 0, cr = 0;
     rows.forEach(r => {
      const yy = String(r.yymmdd || '');
      if (yy.endsWith('97') || yy.endsWith('98')) return;
      dr += Number(r.dramt) || 0;
      cr += Number(r.cramt) || 0;
     });
     return { dramt: dr, cramt: cr };
    }

    applySubtotalStyle(grid, labelBinding) {
     grid.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType === wijmo.grid.CellType.Cell) {
       const item = s.rows[e.row].dataItem;
       if (!item) return;
       const yy = String(item.yymmdd || '');
       if (yy.endsWith('97') || yy.endsWith('98')) {
        e.cell.style.color = '#d33';
        e.cell.style.fontWeight = '600';
        if (s.columns[e.col] && s.columns[e.col].binding === labelBinding) {
         e.cell.textContent = yy.endsWith('97') ? '월소계' : '계정소계';
        }
        if (s.columns[e.col] && s.columns[e.col].binding === 'yymmdd') {
         e.cell.textContent = '';
        }
       }
      }
     });
    }

    openSlipFromRow(item) {
     const yy = String(item.yymmdd || '');
     if (yy.endsWith('97') || yy.endsWith('98')) return;
     if (!item.spnum || item.spnum === '9999' || item.spnum === '0000') return;
     // PB: OpenwithParm(w_tb_a009_popup, yymmdd|spnum|acccd)
     const p = { yymmdd: item.yymmdd, spnum: item.spnum, acccd: item.acccd };
     console.log('전표 팝업 열기', p);
     // 전표 팝업 연결부(getHeader/getLines 방식)는 필요시 이식
    }

    activateTab(no) {
     let $link = $('.tab-links a[href="#tab' + no + '"]');
     if ($link.length) { $link.trigger('click'); return; }
     $('.tab-item').removeClass('active');
     $('#tab' + no).addClass('active');
    }

    searchMainData(tabNo) {
     tabNo = tabNo || 1;
     if (tabNo === 1) this.searchSummary();
     else if (tabNo === 2) this.searchDetailMaster();
    }

   }//CategoryClientLedgerPage

   function getActiveTabNo() {
    let $active = $('.tab-item.active');
    if (!$active.length) $active = $('.tab-item:visible').first();
    let id = ($active.attr('id') || 'tab1').replace('tab', '');
    let no = parseInt(id, 10);
    return isNaN(no) ? 1 : no;
   }

   let page = null;

    page = new CategoryClientLedgerPage();

    let fr = new Date();

    let frStr = CommonUtil.formatYYYYMMDD(fr);
    let toStr = getNowDate();

    for (let i = 1; i <= 3; i++) {
     $('#searchfrdate' + i).val(frStr);
     $('#searchtodate' + i).val(toStr);
     $('#btnSearch' + i).on('click', (function (tabNo) {
      return function () { page.searchMainData(tabNo); };
     })(i));
    }

    page.searchMainData(1);

    $(document).on('keydown', function (ev) {
     if (ev.key === 'F4') { ev.preventDefault(); page.searchMainData(getActiveTabNo()); }
