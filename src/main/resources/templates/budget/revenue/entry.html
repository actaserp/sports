<!--
  세입내역서등록 (예산) — PowerBuilder w_tb_x00071 이식. 2026-11-10
  * 테이블 TB_X0007 (tiosec = '1'). 키: custcd + yyyy + spdate + spnum + tiosec
  * 신규 행: 서버가 spdate = 오늘, spnum = 오늘 날짜 MAX+1 로 채번 (원본 wf_save 와 동일)
  * 저장 검증: 사업년도 4자리 · 관명 · 금액(0 불가). 관명 빈 행은 저장하지 않는다 (원본 wf_datachk)
  * 삭제: 선택한 행만 (원본은 입력 탭에서 그해 전체 삭제였으나 A안으로 변경)
  * 이월: 사업년도 → 다음 해. 이미 이월분이 있으면 이월 취소(삭제)를 묻는다
  * 엑셀가져오기는 제외
  * API  /api/budget/revenue/entry/{read|save|delete|carryover|carryover/count}
  * 팝업은 전표입력 API(/api/account_management/slip_entry/...) 재사용
  * 세출내역서등록은 이 파일을 복사해 KIND='expenditure', 문구 '세입' → '세출' 만 바꾸면 된다
-->
<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <style>
      .bg-guide {
          background: #eef3ff;
          border-left: 4px solid #2f5cff;
          padding: 6px 10px;
          font-size: 13px;
          color: #333;
      }
      .bg-grid { height: 560px; }
      .bg-grid .wj-cell.bg-code { color: #6b7280; }
      .bg-grid .wj-cell.bg-pick { color: #1552b0; }
      .bg-grid .wj-cell.bg-iwol { color: #b45309; }
      /* 목록: 원본 DataWindow 처럼 항 소계 · 관 소계 · 합계 행을 내용 아래에 붙인다 */
      #listGrid .wj-cell.bg-sub { background: #dce9fb; }
      #listGrid .wj-cell.bg-sub.bg-lbl { text-align: right; }
      #listGrid .wj-cell.bg-tot { background: #c9dcf7; font-weight: 700; }
      #listGrid .wj-cell.bg-tot.bg-lbl { text-align: right; }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>세입내역서등록</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>예산관리</li>
        <li>세입내역서등록</li>
      </ul>
    </div>

    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tab1" title="목록">목록</a></li>
        <li><a href="#tab2" title="입력">입력</a></li>
      </ul>
      <div class="tab-contents">
        <!-- 공통 검색 · 버튼 영역은 각 탭 위에 같이 둔다 -->

        <!-- 목록 -->
        <section class="tab-item" id="tab1">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label for="srchYyyy1">사업년도</label></dt>
                <dd><input class="srch-yyyy" id="srchYyyy1" maxlength="4" style="width:90px; text-align:center;" type="text"/></dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <button class="btn btn-delete btn-search" title="조회" type="button">
                    <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}"> 조회
                  </button>
                </dd>
              </dl>
            </div>
            <div class="button-wrap">
              <ul>
                <li><a class="btn btn-excell btn-new" title="신규">
                  <img alt="등록 아이콘" th:src="@{/images/icon/ico-plus.svg}"> 신규</a></li>
                <li><a class="btn btn-delete btn-del" title="삭제">
                  <img alt="삭제 아이콘" th:src="@{/images/icon/ico-delete.svg}"> 삭제</a></li>
                <li><a class="btn btn-edit btn-iwol" title="이월">
                  <img alt="이월 아이콘" th:src="@{/images/icon/ico-edit.svg}"> 이월</a></li>
              </ul>
            </div>
          </div>
          <div class="bg-guide" style="margin-bottom:6px;">
            ※ 관 · 사업 · 항 단위 소계, 관 소계, 합계를 보여줍니다. 행을 더블클릭하면 [입력] 탭에서 수정합니다. 단축키 조회: F4
          </div>
          <div class="bg-grid" id="listGrid"></div>
        </section>

        <!-- 입력 -->
        <section class="tab-item" id="tab2">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label for="srchYyyy2">사업년도</label></dt>
                <dd><input class="srch-yyyy" id="srchYyyy2" maxlength="4" style="width:90px; text-align:center;" type="text"/></dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <button class="btn btn-delete btn-search" title="조회" type="button">
                    <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}"> 조회
                  </button>
                </dd>
              </dl>
            </div>
            <div class="button-wrap">
              <ul>
                <li><a class="btn btn-excell btn-new" title="행 추가">
                  <img alt="등록 아이콘" th:src="@{/images/icon/ico-plus.svg}"> 행 추가</a></li>
                <li><a class="btn btn-edit" id="btnSave" title="저장">
                  <img alt="저장 아이콘" th:src="@{/images/icon/ico-save.svg}"> 저장</a></li>
                <li><a class="btn btn-delete btn-del" title="선택 행 삭제">
                  <img alt="삭제 아이콘" th:src="@{/images/icon/ico-delete.svg}"> 삭제</a></li>
                <li><a class="btn btn-edit btn-iwol" title="이월">
                  <img alt="이월 아이콘" th:src="@{/images/icon/ico-edit.svg}"> 이월</a></li>
              </ul>
            </div>
          </div>
          <div class="bg-guide" style="margin-bottom:6px;">
            ※ 관명 · 항명 · 목명 · 사업명은 입력 후 Enter 또는 F2 로 조회합니다. 마지막 행의 사업명에서 Enter 를 누르면 행이 추가됩니다.
            &nbsp;단축키 조회: F4 / 저장: F6 / 삭제: F7
          </div>
          <div class="bg-grid" id="entryGrid"></div>
        </section>
      </div>
    </div>
  </div>

  <!-- 코드 조회 팝업 (관 · 항 · 목 · 사업 공용) -->
  <script id="pickTemplate" type="text/x-tmpl">
    <div class="content_wrap popup">
      <section class="section">
        <div id="PickGrid" style="height:350px; display:block;"></div>
      </section>
    </div>
  </script>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   const KIND = 'revenue';          // 세출 화면은 'expenditure'
   const TIOSEC = KIND === 'revenue' ? '1' : '2';
   const API = '/api/budget/' + KIND + '/entry';
   const SLIP_API = '/api/account_management/slip_entry';

   // 팝업으로 값을 고르는 칸: 이름 칸 → 함께 채울 코드 칸
   const PICK_COLS = {
    accnm:  {title: '관 조회', url: '/findAccnm', param: q => ({accnm: q, type: 'account'}),
     cols: [{binding: 'acccd', header: '관코드', width: 100, align: 'center'}, {binding: 'accnm', header: '관명', width: '*'}],
     apply: (r, it) => { r.acccd = it.acccd || ''; r.accnm = it.accnm || ''; },
     clear: r => { r.acccd = ''; r.accnm = ''; }},
    it1nm:  {title: '항 조회', url: '/findIt1nm', param: q => ({it1nm: q, tiosec: TIOSEC}),
     cols: [{binding: 'it1cd', header: '항코드', width: 100, align: 'center'}, {binding: 'it1nm', header: '항명', width: '*'}],
     apply: (r, it) => { r.it1cd = it.it1cd || ''; r.it1nm = it.it1nm || ''; },
     clear: r => { r.it1cd = ''; r.it1nm = ''; }},
    it2nm:  {title: '목 조회', url: '/findIt2nm', param: q => ({it2nm: q, tiosec: TIOSEC}),
     cols: [{binding: 'it2cd', header: '목코드', width: 100, align: 'center'}, {binding: 'it2nm', header: '목명', width: '*'}],
     apply: (r, it) => { r.it2cd = it.it2cd || ''; r.it2nm = it.it2nm || ''; },
     clear: r => { r.it2cd = ''; r.it2nm = ''; }},
    businm: {title: '사업 조회', url: '/findBusim', param: q => ({busim: q}),
     cols: [{binding: 'bsdate', header: '년도', width: 70, align: 'center'},
      {binding: 'buiscd', header: '사업코드', width: 90, align: 'center'},
      {binding: 'busim', header: '사업명', width: '*'}],
     apply: (r, it) => { r.bsdate = it.bsdate || ''; r.bseccd = it.bseccd || ''; r.busicd = it.buiscd || ''; r.businm = it.busim || ''; },
     clear: r => { r.bsdate = ''; r.bseccd = ''; r.busicd = ''; r.businm = ''; }},
   };

   class BudgetEntryPage {
    constructor() {
     this.yyyy = String(new Date().getFullYear());
     this.listView = new wijmo.collections.CollectionView([]);
     this.entryView = new wijmo.collections.CollectionView([], {trackChanges: true});
     this.mssecMap = new wijmo.grid.DataMap([], 'value', 'text');
     this.picking = false;
     this.init();
    }

    init() {
     const _this = this;
     $('.srch-yyyy').val(this.yyyy);

     // ── 목록: 관 → 항 그룹 + 소계 ──
     this.listGrid = new wijmo.grid.FlexGrid('#listGrid', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      isReadOnly: true,
      selectionMode: wijmo.grid.SelectionMode.Row,
      columns: [
       {binding: 'accnm', header: '관명(계정)', width: 180},
       {binding: 'businm', header: '사업명', width: 220},
       {binding: 'it1nm', header: '항', width: 180},
       {binding: 'it2nm', header: '목', width: 160},
       {binding: 'summy', header: '세입내역', width: '*', minWidth: 240},
       {binding: 'price', header: '금액', width: 140, align: 'right', format: 'n0'},
      ],
      itemsSource: this.listView,
     });
     this.listGrid.formatItem.addHandler((s, e) => {
      if (e.panel !== s.cells) return;
      const it = s.rows[e.row].dataItem;
      const kind = it ? it.kind : 'd';
      const b = s.columns[e.col].binding;
      wijmo.toggleClass(e.cell, 'bg-sub', kind === 's2' || kind === 's1');
      wijmo.toggleClass(e.cell, 'bg-tot', kind === 't');
      wijmo.toggleClass(e.cell, 'bg-lbl', kind !== 'd' && b === 'summy');
     });
     new FlexGridContextMenu(this.listGrid);
     this.listGrid.downloadFileName = '세입내역서';
     this.listGrid.hostElement.addEventListener('dblclick', () => {
      const it = this.listGrid.selectedItems[0];
      if (!it || it.kind !== 'd') return;
      $('a[href="#tab2"]').trigger('click');
      setTimeout(() => {
       const idx = this.entryView.sourceCollection.findIndex(r => r.spdate === it.spdate && r.spnum === it.spnum);
       if (idx >= 0) this.entryGrid.select(idx, this.entryGrid.columns.getColumn('summy').index);
       this.entryGrid.focus();
      }, 100);
     });

     // ── 입력 그리드 ──
     this.entryGrid = new wijmo.grid.FlexGrid('#entryGrid', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      selectionMode: wijmo.grid.SelectionMode.CellRange,
      keyActionEnter: wijmo.grid.KeyAction.CycleOut,
      keyActionTab: wijmo.grid.KeyAction.Cycle,
      imeEnabled: true,
      columns: [
       {binding: 'acccd', header: '코드', width: 70, align: 'center', isReadOnly: true, cssClass: 'bg-code'},
       {binding: 'accnm', header: '관명', width: 160, cssClass: 'bg-pick'},
       {binding: 'mssec', header: '재원구분', width: 100, dataMap: this.mssecMap},
       {binding: 'summy', header: '세입내역', width: '*', minWidth: 240, maxLength: 50},
       {binding: 'price', header: '금액', width: 130, align: 'right', format: 'n0', dataType: wijmo.DataType.Number, aggregate: 'Sum'},
       {binding: 'it1cd', header: '항코드', width: 70, align: 'center', isReadOnly: true, cssClass: 'bg-code'},
       {binding: 'it1nm', header: '항명(선택)', width: 160, cssClass: 'bg-pick'},
       {binding: 'it2cd', header: '목코드', width: 70, align: 'center', isReadOnly: true, cssClass: 'bg-code'},
       {binding: 'it2nm', header: '목명(선택)', width: 150, cssClass: 'bg-pick'},
       {binding: 'businm', header: '사업명', width: 220, cssClass: 'bg-pick'},
      ],
      itemsSource: this.entryView,
     });
     this.entryGrid.columnFooters.rows.push(new wijmo.grid.GroupRow());
     this.entryGrid.columnFooters.setCellData(0, 3, '합계');
     new FlexGridContextMenu(this.entryGrid);

     // 이월로 생긴 행은 표시 (사업 재등록 필요)
     this.entryGrid.formatItem.addHandler((s, e) => {
      if (e.panel !== s.cells) return;
      const it = s.rows[e.row].dataItem;
      wijmo.toggleClass(e.cell, 'bg-iwol', !!(it && it.iwolflag === '1' && s.columns[e.col].binding === 'businm'));
     });

     // 이름 칸을 고치면 → 그 글자로 조회 팝업, 지우면 코드도 지움
     this.entryGrid.cellEditEnding.addHandler((s, e) => {
      const b = s.columns[e.col].binding;
      if (!PICK_COLS[b]) return;
      const oldVal = s.getCellData(e.row, e.col, false) || '';
      const newVal = (s.activeEditor ? s.activeEditor.value : '').trim();
      if (newVal === oldVal) return;
      e.cancel = true;   // 직접 입력값은 쓰지 않고, 팝업에서 고른 값만 넣는다
      const row = e.row;
      if (newVal === '') {
       this.updateItem(row, r => PICK_COLS[b].clear(r));
      } else {
       setTimeout(() => this.openPick(b, row, newVal), 0);
      }
     });

     // F2: 현재 이름 칸 조회 / 마지막 행 사업명에서 Enter: 행 추가
     this.entryGrid.hostElement.addEventListener('keydown', e => {
      const g = this.entryGrid;
      const sel = g.selection;
      if (sel.row < 0 || g.activeEditor) return;
      const b = g.columns[sel.col] ? g.columns[sel.col].binding : '';
      if (e.key === 'F2' && PICK_COLS[b]) {
       e.preventDefault();
       e.stopPropagation();
       this.openPick(b, sel.row, g.getCellData(sel.row, sel.col, false) || '');
      } else if (e.key === 'Enter' && b === 'businm' && sel.row === g.rows.length - 1) {
       e.preventDefault();
       e.stopPropagation();
       this.addRow();
      }
     }, true);

     // ── 버튼 ──
     $('.btn-search').on('click', () => this.retrieve());
     $('.srch-yyyy').on('change', function () {
      $('.srch-yyyy').val($(this).val());
     }).on('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); this.retrieve(); }
     });
     $('.btn-new').on('click', () => this.newRow());
     $('#btnSave').on('click', () => this.save());
     $('.btn-del').on('click', () => this.remove());
     $('.btn-iwol').on('click', () => this.carryover());

     $(document).on('keydown', e => {
      if (e.key === 'F4') { e.preventDefault(); this.retrieve(); }
      if (e.key === 'F6') { e.preventDefault(); this.save(); }
      if (e.key === 'F7') { e.preventDefault(); this.remove(); }
     });

     // 저장하지 않고 화면을 떠나려 하면 경고 (원본 closequery)
     window.addEventListener('beforeunload', e => {
      if (this.isDirty()) { e.preventDefault(); e.returnValue = ''; }
     });

     AjaxUtil.getAsyncData(SLIP_API + '/mssec', {}, res => {
      this.mssecMap.collectionView.sourceCollection = (res && res.data) || [];
      this.entryGrid.invalidate();
     });
    }

    // ── 공통 ──
    currentTab() {
     return $('#tab2').is(':visible') ? 2 : 1;
    }

    getYyyy() {
     const v = String($('.srch-yyyy:visible').val() || $('.srch-yyyy').first().val() || '').trim();
     $('.srch-yyyy').val(v);
     if (!/^\d{4}$/.test(v)) {
      Alert.alert('', '사업년도를 4자리로 입력하십시오.');
      $('.srch-yyyy:visible').focus();
      return null;
     }
     return v;
    }

    isDirty() {
     const cv = this.entryView;
     const added = cv.itemsAdded.filter(r => (r.acccd || '').trim() !== '' || Number(r.price) !== 0);
     return added.length + cv.itemsEdited.length > 0;
    }

    // 변경이 있으면 묻고 진행 (원본: 저장/저장 안 함/취소)
    confirmDiscard(proceed) {
     if (!this.isDirty()) { proceed(); return; }
     Alert.confirm('', '변경된 자료가 있습니다.\n저장하지 않고 계속하시겠습니까?\n(저장하려면 취소 후 [저장]을 누르세요)', proceed);
    }

    updateItem(row, fn) {
     const cv = this.entryView;
     const item = this.entryGrid.rows[row].dataItem;
     cv.editItem(item);
     fn(item);
     cv.commitEdit();
    }

    // ── 조회 ──
    retrieve(focusKey) {
     const yyyy = this.getYyyy();
     if (!yyyy) return;
     this.confirmDiscard(() => {
      AjaxUtil.getAsyncData(API + '/read', {yyyy: yyyy}, res => {
       const rows = (res && res.data) || [];
       this.yyyy = yyyy;
       this.listView.sourceCollection = this.buildList(rows);
       this.entryView.sourceCollection = rows.map(r => Object.assign({}, r));
       this.entryView.clearChanges();
       if (rows.length === 0 && this.currentTab() === 2) this.addRow();
      });
     });
    }

    /**
     * 목록 행 만들기 — 원본 d_tb_x00071_1 과 같은 모양
     *  그룹1 = 관(acccd), 그룹2 = 관 + 사업명 + 항(acccd, businm, it1cd)
     *  각 그룹2 끝에 '항명 소계', 그룹1 끝에 '관명 소계', 맨 끝에 '합계'
     *  관명은 그룹1 첫 행에만, 사업명 · 항은 그룹2 첫 행에만, 목은 앞 행과 같으면 숨김
     *  서버가 acccd, it1cd, spdate, spnum 순으로 주므로 연속된 행끼리 묶는다
     */
    buildList(rows) {
     const out = [];
     const sum = arr => arr.reduce((s, r) => s + (Number(r.price) || 0), 0);
     let total = 0;
     let i = 0;
     while (i < rows.length) {
      const acccd = rows[i].acccd;
      const accnm = rows[i].accnm || '';
      let g1 = 0;
      let first1 = true;
      while (i < rows.length && rows[i].acccd === acccd) {
       const k2 = (rows[i].businm || '') + '\u0001' + (rows[i].it1cd || '');
       const grp = [];
       while (i < rows.length && rows[i].acccd === acccd
       && ((rows[i].businm || '') + '\u0001' + (rows[i].it1cd || '')) === k2) {
        grp.push(rows[i]);
        i++;
       }
       // 같은 그룹2 안에서는 사업명 · 항을 첫 행에만, 목은 앞 행과 같으면 비운다 (원본 반복값 숨김)
       grp.forEach((r, gi) => {
        const prev = gi > 0 ? grp[gi - 1] : null;
        out.push(Object.assign({}, r, {
         kind: 'd',
         _src: r,   // 화면용으로 숨긴 관명 · 사업명 · 항 · 목의 원래 값
         accnm: first1 ? accnm : '',
         businm: gi === 0 ? r.businm : '',
         it1nm: gi === 0 ? r.it1nm : '',
         it2nm: prev && (prev.it2cd || '') === (r.it2cd || '') ? '' : r.it2nm,
        }));
        first1 = false;
       });
       const s2 = sum(grp);
       out.push({kind: 's2', summy: (grp[0].it1nm || '') + ' 소계 :', price: s2});
       g1 += s2;
      }
      out.push({kind: 's1', summy: accnm + ' 소계 :', price: g1});
      total += g1;
     }
     if (out.length) out.push({kind: 't', summy: '합계 :', price: total});
     return out;
    }

    // ── 신규 / 행 추가 (원본 cb_5: 빈 행 추가, 사업년도는 조회 조건) ──
    newRow() {
     if (this.currentTab() === 1) $('a[href="#tab2"]').trigger('click');
     setTimeout(() => this.addRow(), 50);
    }

    addRow() {
     const yyyy = this.getYyyy();
     if (!yyyy) return;
     const cv = this.entryView;
     const item = cv.addNew();
     Object.assign(item, {
      yyyy: yyyy, spdate: '', spnum: '', acccd: '', accnm: '', mssec: '', summy: '', price: 0,
      it1cd: '', it1nm: '', it2cd: '', it2nm: '', bsdate: '', bseccd: '', busicd: '', businm: '', iwolflag: ''
     });
     cv.commitNew();
     const g = this.entryGrid;
     const r = g.rows.length - 1;
     g.select(r, g.columns.getColumn('accnm').index);
     g.scrollIntoView(r, 0);
     g.focus();
    }

    // ── 저장 ──
    save() {
     if (this.entryGrid.activeEditor) this.entryGrid.finishEditing();
     const yyyy = this.getYyyy();
     if (!yyyy) return;
     if (!this.isDirty()) { Alert.alert('', '변경된 자료가 없습니다.'); return; }

     const rows = this.entryView.sourceCollection;
     // 저장 전 검증 (원본 wf_datachk). 관명 빈 행은 저장하지 않는다.
     for (let i = 0; i < rows.length; i++) {
      const r = rows[i];
      if (!(r.acccd || '').trim()) continue;
      if (!Number(r.price)) {
       $('a[href="#tab2"]').trigger('click');
       this.entryGrid.select(i, this.entryGrid.columns.getColumn('price').index);
       Alert.alert('', (i + 1) + '번째 행의 금액을 입력하십시오.');
       return;
      }
     }
     const missingAcc = rows.findIndex(r => !(r.acccd || '').trim() && (Number(r.price) || (r.summy || '').trim()));
     if (missingAcc >= 0) {
      $('a[href="#tab2"]').trigger('click');
      this.entryGrid.select(missingAcc, this.entryGrid.columns.getColumn('accnm').index);
      Alert.alert('', (missingAcc + 1) + '번째 행의 관명(계정)을 입력하십시오.');
      return;
     }

     // 바뀐 행만 보낸다 (신규 + 수정)
     const cv = this.entryView;
     const changed = cv.itemsAdded.concat(cv.itemsEdited).filter(r => (r.acccd || '').trim());
     AjaxUtil.postJsonData(API + '/save', {yyyy: yyyy, rows: changed}, res => {
      if (res && res.success) {
       Alert.alert('', '저장되었습니다.');
       this.entryView.clearChanges();
       this.retrieve();
      } else {
       Alert.alert('', (res && res.message) || '저장 중 오류가 발생했습니다.');
      }
     });
    }

    // ── 삭제 (선택 행만) ──
    remove() {
     let items;
     if (this.currentTab() === 1) {
      items = this.listGrid.selectedItems.filter(it => it && it.kind === 'd');
     } else {
      const g = this.entryGrid;
      const rng = g.selection;
      if (rng.row < 0) return;
      items = [];
      for (let r = Math.min(rng.row, rng.row2); r <= Math.max(rng.row, rng.row2); r++) items.push(g.rows[r].dataItem);
     }
     if (!items.length) { Alert.alert('', '삭제할 행을 선택하세요.'); return; }

     // 아직 저장 안 된 행은 화면에서만 지운다
     const unsaved = items.filter(it => !it.spnum);
     const saved = items.filter(it => it.spnum);
     unsaved.forEach(it => this.entryView.remove(it));
     if (!saved.length) return;

     const sum = saved.reduce((s, it) => s + (Number(it.price) || 0), 0);
     const desc = saved.length === 1
      ? `관-항 : ${saved[0].accnm || ''}-${saved[0].it1nm || ''}\n목 : ${saved[0].it2nm || ''}\n금액 : ${sum.toLocaleString()}`
      : `${saved.length}건 (금액 합계 ${sum.toLocaleString()})`;

     this.confirmDiscard(() => {
      Alert.confirm('', '선택한 자료를 삭제하시겠습니까?\n' + desc, () => {
       const keys = saved.map(it => ({yyyy: it.yyyy, spdate: it.spdate, spnum: it.spnum}));
       AjaxUtil.postJsonData(API + '/delete', {keys: keys}, res => {
        if (res && res.success) {
         Alert.alert('', '삭제되었습니다.');
         this.entryView.clearChanges();
         this.retrieve();
        } else {
         Alert.alert('', (res && res.message) || '삭제 중 오류가 발생했습니다.');
        }
       });
      });
     });
    }

    // ── 이월 (원본 동일: 이월분이 있으면 취소 여부, 없으면 실행 여부를 묻는다) ──
    carryover() {
     const yyyy = this.getYyyy();
     if (!yyyy) return;
     const nyyyy = String(Number(yyyy) + 1);
     AjaxUtil.getAsyncData(API + '/carryover/count', {yyyy: yyyy}, res => {
      const cnt = Number(res && res.data) || 0;
      const post = (mode, done) => AjaxUtil.postJsonData(API + '/carryover', {yyyy: yyyy, mode: mode}, r => {
       if (r && r.success) Alert.alert('', done);
       else Alert.alert('', (r && r.message) || '이월 처리 중 오류가 발생했습니다.');
      });
      if (cnt > 0) {
       Alert.confirm('', `${yyyy} → ${nyyyy}년도로 이월된 자료가 있습니다(${cnt}건).\n전체 삭제할까요?`,
        () => post('cancel', '이월이 취소되었습니다.'));
      } else {
       Alert.confirm('', `${yyyy} → ${nyyyy}년도로 자료를 이월하시겠습니까?`,
        () => post('run', `이월이 완료되었습니다.\n사업은 ${nyyyy}년도 사업으로 다시 등록하셔야 합니다.`));
      }
     });
    }

    // ── 코드 조회 팝업 ──
    openPick(binding, row, keyword) {
     if (this.picking) return;
     const def = PICK_COLS[binding];
     this.picking = true;
     AjaxUtil.getAsyncData(SLIP_API + def.url, def.param(keyword || ''), res => {
      const list = (res && res.data) || [];
      if (!list.length) {
       this.picking = false;
       Alert.alert('', def.title.replace(' 조회', '') + ' 조회 결과가 없습니다.');
       return;
      }
      if (list.length === 1) {
       this.picking = false;
       this.applyPick(binding, row, list[0]);
       return;
      }
      const popup = new PopupDraggable(def.title);
      popup.open({width: 600, height: 420, $content: $(tmpl('pickTemplate', {}))});
      const grid = new wijmo.grid.FlexGrid('#PickGrid', {
       isReadOnly: true,
       selectionMode: wijmo.grid.SelectionMode.Row,
       headersVisibility: wijmo.grid.HeadersVisibility.Column,
       autoGenerateColumns: false,
       columns: def.cols,
       itemsSource: new wijmo.collections.CollectionView(list),
      });
      grid.keyActionEnter = wijmo.grid.KeyAction.None;
      const pick = () => {
       const sel = grid.selection;
       if (!sel || sel.row < 0) return;
       const item = grid.rows[sel.row].dataItem;
       popup.close();
       this.picking = false;
       this.applyPick(binding, row, item);
      };
      grid.hostElement.addEventListener('dblclick', pick);
      grid.hostElement.addEventListener('keydown', e => {
       if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); pick(); }
       if (e.key === 'Escape') { popup.close(); this.picking = false; this.entryGrid.focus(); }
      });
      setTimeout(() => { if (grid.rows.length) { grid.select(0, 0); grid.focus(); } }, 50);
      // 팝업 X 로 닫혀도 다시 열 수 있게
      setTimeout(() => { this.picking = false; }, 500);
     });
    }

    applyPick(binding, row, item) {
     this.updateItem(row, r => PICK_COLS[binding].apply(r, item));
     // 다음 칸으로
     const g = this.entryGrid;
     const col = g.columns.getColumn(binding).index;
     let next = col + 1;
     while (next < g.columns.length && g.columns[next].isReadOnly) next++;
     setTimeout(() => {
      if (next < g.columns.length) g.select(row, next);
      else if (row === g.rows.length - 1) this.addRow();
      else g.select(row + 1, g.columns.getColumn('accnm').index);
      g.focus();
     }, 50);
    }
   }

   let page = null;
   $(document).ready(function () {
    page = new BudgetEntryPage();
    page.retrieve();
   });
  </script>
</th:block>
