<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <style>
      .grid-guide-box {
          background: #eef3ff;
          border-left: 4px solid #2f5cff;
          padding: 6px 10px;
          font-size: 13px;
          margin-bottom: 6px;
          color: #333;
      }
      /* 집계내역 좌우 2분할 */
      .split-wrap { display: flex; gap: 8px; }
      .split-left  { width: 240px; flex: 0 0 240px; }   /* 원본 d_book10_0_list : 계정과목만 */
      .chk-inline { display: inline-flex; align-items: center; gap: 6px; height: 30px; font-size: 13px; cursor: pointer; white-space: nowrap; }
      .chk-inline input[type="checkbox"] {
          -webkit-appearance: auto !important; -moz-appearance: auto !important; appearance: auto !important;
          flex: 0 0 16px !important; width: 16px !important; height: 16px !important;
          min-width: 16px !important; max-width: 16px !important; min-height: 16px !important;
          margin: 0 !important; padding: 0 !important; border: 0 !important; border-radius: 0 !important;
          background: none !important; box-shadow: none !important; vertical-align: middle !important; accent-color: #2563eb;
      }
      .chk-inline input[type="checkbox"]::before,
      .chk-inline input[type="checkbox"]::after { content: none !important; display: none !important; }
      .split-right { flex: 1 1 auto; min-width: 0; }

      /* ── 전표 팝업 레이아웃 ── */
      .slip-popup .slip-head-table,
      .slip-popup .slip-foot-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-head-table td,
      .slip-popup .slip-foot-table th,
      .slip-popup .slip-foot-table td {
          border: 1px solid #d5d9e0;
          padding: 4px 6px;
          font-size: 13px;
          vertical-align: middle;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-foot-table th {
          background: #f5f6f8;
          color: #333;
          font-weight: 600;
          text-align: center;
          white-space: nowrap;
      }
      .slip-popup .slip-head-table td input,
      .slip-popup .slip-head-table td textarea,
      .slip-popup .slip-foot-table td input {
          width: 100%;
          border: none;
          background: transparent;
          font-size: 13px;
          box-sizing: border-box;
      }
      .slip-popup .slip-head-table td textarea { resize: none; }
      .slip-popup .chk-cell { text-align: center; white-space: nowrap; }
      .slip-popup .slip-grid-box { margin: 8px 0; }
      .slip-popup { width: 100%; box-sizing: border-box; padding: 4px; }
      .slip-popup .section { width: 100%; }
  </style>
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>관항목별원장</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>장부출력</li>
        <li>관항목별원장</li>
      </ul>
    </div>
    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tab1" title="집계내역">집계내역</a></li>
        <li><a href="#tab2" id="tab2Link" title="상세내역">상세내역</a></li>
        <li><a href="#tab3" title="상세내역(재원별)">상세내역(재원별)</a></li>
        <li><a href="#tab4" title="상세내역">상세내역</a></li>
      </ul>
      <div class="tab-contents">

        <!-- ── 집계내역 (tab1) : 좌(계정과목, d_book10_0_list) + 우(항·목, d_book12_0) ── -->
        <section class="tab-item" id="tab1">
          <!-- 공통 조회줄 (원본 d_book12_cdt) : 탭을 옮기면 그 탭 맨 위로 옮겨 간다 -->
          <div class="section-top" id="cdtBox">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate" name="searchfrdate" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate" name="searchtodate" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목</label></dt>
                <dd>
                  <input class="form-control2" id="accnm" name="accnm" placeholder="계정과목 (엔터로 검색)"/>
                  <input type="hidden" id="acccd" name="acccd"/>
                </dd>
              </dl>
              <dl>
                <dt><label>재원</label></dt>
                <dd><select class="form-control2" id="mssec" name="mssec"></select></dd>
              </dl>
              <dl>
                <dt><label>항</label></dt>
                <dd>
                  <input class="form-control2" id="it1nm" name="it1nm" placeholder="항 (엔터로 검색)"/>
                  <input type="hidden" id="it1cd" name="it1cd"/>
                </dd>
              </dl>
              <dl>
                <dt><label>목</label></dt>
                <dd>
                  <input class="form-control2" id="it2nm" name="it2nm" placeholder="목 (엔터로 검색)"/>
                  <input type="hidden" id="it2cd" name="it2cd"/>
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <label class="chk-inline" title="체크하면 전체 계정의 상세내역을 상세내역 탭에 조회합니다">
                    <input type="checkbox" id="chkTotal"/> 총계정상세
                  </label>
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd style="display:flex; align-items:center; gap:6px;">
                  <li>
                    <button class="btn btn-delete" id="btnSearch" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                  <li>
                    <button class="btn btn-delete" id="btnPrint" title="인쇄 (보고 있는 탭)" type="button">인쇄</button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 왼쪽 계정과목을 선택하면 오른쪽에 항·목별 내역이 나옵니다. 계정이나 항·목을 더블클릭하면 상세내역 탭이 조회됩니다. (단축키 조회:F4)</div>
          <div class="split-wrap">
            <div class="split-left">
              <div id="theGrid_acc" style="height: 495px;"></div>
            </div>
            <div class="split-right">
              <div id="theGrid_item" style="height: 495px;"></div>
            </div>
          </div>
        </section>

        <!-- ── 상세내역 (tab2, 원본 d_book12_1) ── -->
        <section class="tab-item" id="tab2">
          <div class="grid-guide-box">※ 행을 선택하면 그 목의 상세내역(재원별)·상세내역 탭이 조회됩니다.</div>
          <div class="grid_box" id="divItemDetail">
            <div id="theGrid_item_detail" style="height: 495px;"></div>
          </div>
        </section>

        <!-- ── 상세내역(재원별) (tab3, 원본 d_book12_2) ── -->
        <section class="tab-item" id="tab3">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail3">
            <div id="theGrid_detail3" style="height: 495px;"></div>
          </div>
        </section>

        <!-- ── 상세내역 (tab4, 원본 d_book12_3) ── -->
        <section class="tab-item" id="tab4">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail4">
            <div id="theGrid_detail4" style="height: 495px;"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <!-- 관명 팝업 -->
  <script id="accnmTemplate" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="AccGrid" style="height:350px; display:block;"></div></section></div>
  </script>
  <!-- 항명 팝업 -->
  <script id="it1Template" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="It1Grid" style="height:350px; display:block;"></div></section></div>
  </script>
  <!-- 목명 팝업 -->
  <script id="it2Template" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="It2Grid" style="height:350px; display:block;"></div></section></div>
  </script>

  <!-- 전표 팝업 -->
  <script id="slipPopupTemplate" type="text/x-tmpl">
    <div class="content_wrap popup slip-popup">
      <section class="section">
        <div class="slip-header">
          <table class="slip-head-table">
            <colgroup>
              <col style="width:90px"><col>

            <tbody>
              <tr>
                <th>전표일자</th><td><input type="date" id="sp_yymmdd" readonly></td>
                <th>전표번호</th><td><input type="text" id="sp_slipno" readonly></td>

        <div class="slip-grid-box"><div id="SlipDetailGrid" style="height:200px; display:block;"></div></div>

              <tr>
                <th>거래처</th><td><input type="text" id="sp_custnm" readonly></td>

                <th>수입자체</th><td><input type="text" id="sp_msseccd" readonly></td>
              </tr>
              <tr>
                <th>카드</th><td><input type="text" id="sp_cardnm" readonly></td>
                <th>재원</th><td><input type="text" id="sp_mssecnm" readonly></td>

</th:block>
<th:block layout:fragment="scripts">
  <th:block th:replace="common/popup_account :: popup_account" />
  <script type="text/javascript">
   class CategoryItemDetailLedgerPage { //관항목별원장 (원본 w_book12)
    constructor() {
     this.url = '/api/ledger/CategoryItemDetailLedger';
     this.entry_url = '/api/account_management/slip_entry';
     this.accGrid1 = null;         // tab1 좌 - 계정과목
     this.itemGrid1 = null;        // tab1 우 - 항·목
     this.itemDetailGrid = null;   // tab2
     this.detailGrid3 = null;      // tab3 - 재원별
     this.detailGrid4 = null;      // tab4
     this.tab2Name = '상세내역';
     this.tab2Key = {acccd: '', it1cd: '', it2cd: ''};
     this.tab3Key = null;          // tab2 에서 고른 행 (계정·항·목)
     this.rows3 = []; this.rows4 = [];
     this.init();
    }

    // 소계 · 머리행 색 (그리드가 셀을 재사용하므로 일반 행은 원래대로 되돌린다)
    _kindStyle(e, kind) {
     const st = e.cell.style;
     st.color = ''; st.fontWeight = ''; st.background = '';
     if (!kind || kind === 'd') return;
     if (kind === 'h') { st.background = '#d7ebfb'; st.color = '#222'; return; }
     if (kind === 'm') { st.color = '#1f4fd1'; st.background = '#eaf3ff'; st.fontWeight = '600'; return; }
     st.color = '#d33'; st.fontWeight = '600'; st.background = '#fff8ec';
    }

    _grid(sel, columns, extra) {
     const _this = this;
     const g = new wijmo.grid.FlexGrid(sel, Object.assign({
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false, allowSorting: false,
      selectionMode: wijmo.grid.SelectionMode.Row, isReadOnly: true,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) { e.cell.style.textAlign = 'center'; return; }
       if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
       const it = s.rows[e.row].dataItem;
       _this._kindStyle(e, it && it._kind);
      },
      columns: columns,
     }, extra || {}));
     new FlexGridContextMenu(g);
     return g;
    }

    init() {
     let _this = this;

     // tab1 좌 : 계정과목 (원본 d_book10_0_list 는 이름만 보인다)
     _this.accGrid1 = _this._grid('#theGrid_acc', [
      {binding: 'accnm', header: '계정과목', width: '*', align: 'left'},
     ]);
     _this.accGrid1.downloadFileName = '계정과목';
     _this.accGrid1.selectionChanged.addHandler(function () {
      const m = _this.accGrid1.selectedItems[0];
      if (m) _this.loadItemsByAcc(m);
     });
     _this.accGrid1.hostElement.addEventListener('dblclick', function (e) {
      if (_this.accGrid1.hitTest(e).cellType !== wijmo.grid.CellType.Cell) return;
      const m = _this.accGrid1.selectedItems[0];
      if (m) _this.goToDetail({acccd: m.acccd, it1cd: '', it2cd: ''}, m.accnm || '');
     });

     // tab1 우 : 항·목 (원본 d_book12_0) — 계정 머리행 · 항(첫 줄만) · 목 · 항소계
     _this.itemGrid1 = _this._grid('#theGrid_item', [
      {binding: 'it1nmShow', header: '항',       width: 200, align: 'left'},
      {binding: 'it2nmShow', header: '목',       width: 180, align: 'left'},
      {binding: 'bfamt',     header: '전잔액',   width: 130, align: 'right', format: 'n0'},
      {binding: 'dramt',     header: '차변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'cramt',     header: '대변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'balamt',    header: '잔액',     width: 130, align: 'right', format: 'n0'},
     ]);
     _this.itemGrid1.downloadFileName = '관항별목별집계내역';
     _this.itemGrid1.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.itemGrid1.hitTest(e);
      if (ht.cellType !== wijmo.grid.CellType.Cell) return;
      const it = _this.itemGrid1.rows[ht.row].dataItem;
      if (!it || it._kind !== 'd') return;
      _this.goToDetail({acccd: it.acccd, it1cd: it.it1cd, it2cd: ''}, (it.accnm || '') + ' - ' + (it.it1nm || ''));
     });

     // tab2 (원본 d_book12_1) — 재원 / 항 / 목 / 전표일자 / 차변 / 대변 / 잔액 / 잔액
     _this.itemDetailGrid = _this._grid('#theGrid_item_detail', [
      {binding: 'mssecnm',   header: '재원',     width: 90,  align: 'center'},
      {binding: 'it1nmShow', header: '항',       width: 200, align: 'left'},
      {binding: 'it2nmShow', header: '목',       width: 180, align: 'left'},
      {binding: 'datef',     header: '전표일자', width: 110, align: 'center'},
      {binding: 'dramt',     header: '차변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'cramt',     header: '대변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'runamt',    header: '잔액',     width: 140, align: 'right', format: 'n0'},
      {binding: 'bfamt',     header: '잔액',     width: 130, align: 'right', format: 'n0'},
     ]);
     _this.itemDetailGrid.downloadFileName = '관항별목별 월별집계내역';
     _this.itemDetailGrid.selectionChanged.addHandler(function () {
      const it = _this.itemDetailGrid.selectedItems[0];
      if (!it || it._kind !== 'd' || !it.it2cd) return;
      const k = {acccd: it.acccd, it1cd: it.it1cd, it2cd: it.it2cd, accnm: it.accnm, it1nm: it.it1nm};
      const t = _this.tab3Key;
      if (t && t.acccd === k.acccd && t.it1cd === k.it1cd && t.it2cd === k.it2cd) return;
      _this.tab3Key = k;
      _this.searchDetails();
     });

     // tab3 (원본 d_book12_2) — 전표일자 / 목 / 재원 / 비고 / 차변 / 대변 / 잔액
     _this.detailGrid3 = _this._grid('#theGrid_detail3', [
      {binding: 'datef',   header: '전표일자', width: 110, align: 'center'},
      {binding: 'it2nm',   header: '목',       width: 150, align: 'left'},
      {binding: 'mssecnm', header: '재원',     width: 90,  align: 'center'},
      {binding: 'summy',   header: '비고',     width: '*', align: 'left'},
      {binding: 'dramt',   header: '차변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'cramt',   header: '대변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'balamt',  header: '잔액',     width: 140, align: 'right', format: 'n0'},
     ]);
     _this.detailGrid3.downloadFileName = '관항별목별 상세내역(재원별)';

     // tab4 (원본 d_book12_3) — 전표일자 / 목 / 비고 / 카드번호 / 차변 / 대변 / 잔액
     _this.detailGrid4 = _this._grid('#theGrid_detail4', [
      {binding: 'datef',   header: '전표일자', width: 110, align: 'center'},
      {binding: 'it2nm',   header: '목',       width: 150, align: 'left'},
      {binding: 'summy',   header: '비고',     width: '*', align: 'left'},
      {binding: 'cardnum', header: '카드번호', width: 160, align: 'center'},
      {binding: 'dramt',   header: '차변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'cramt',   header: '대변금액', width: 130, align: 'right', format: 'n0'},
      {binding: 'balamt',  header: '잔액',     width: 140, align: 'right', format: 'n0'},
     ]);
     _this.detailGrid4.downloadFileName = '관항별목별 상세내역';

     [_this.detailGrid3, _this.detailGrid4].forEach(g => {
      g.hostElement.addEventListener('dblclick', function (e) {
       if (g.hitTest(e).cellType !== wijmo.grid.CellType.Cell) return;
       const it = g.selectedItems[0];
       if (it) _this.openSlipFromRow(it);
      });
     });
    }//init

    _d8(v) { return String(v == null ? '' : v).replace(/[^0-9]/g, ''); }
    _fmtD(d8) { return d8 === '00000000' || d8 === '' ? '전일이월' : d8.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'); }
    _bal(r) { const bf = Number(r.bfamt) || 0, dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0; return String(r.drcr) === '1' ? bf + dr - cr : bf + cr - dr; }
    _cond() {
     return {start: $('#searchfrdate').val(), end: $('#searchtodate').val(), mssec: $('#mssec').val() || ''};
    }

    // ══════ tab1 좌 : 계정과목 ══════
    searchSummary() {
     let _this = this;
     AjaxUtil.getAsyncData(this.url + '/read', Object.assign(_this._cond(), {acccd: $('#acccd').val()}), function (result) {
      if (!(result != null && result.success)) { console.log('집계(관) 조회 오류'); return; }
      _this.accGrid1.itemsSource = result.data || [];
      // 첫 행이 이미 선택돼 있으면 selectionChanged 가 안 뜨므로 오른쪽을 직접 채운다
      setTimeout(function () {
       if (_this.accGrid1.rows.length > 0) {
        _this.accGrid1.select(0, 0);
        _this.loadItemsByAcc(_this.accGrid1.rows[0].dataItem);
       } else _this.itemGrid1.itemsSource = [];
      }, 50);
     });
    }

    // ══════ tab1 우 : 항·목 (d_book12_0) ══════
    loadItemsByAcc(master) {
     let _this = this;
     if (!master) return;
     AjaxUtil.getAsyncData(this.url + '/readItem', Object.assign(_this._cond(), {
      acccd: master.acccd || '', it1cd: $('#it1cd').val() || '', it2cd: $('#it2cd').val() || ''
     }), function (result) {
      if (!(result != null && result.success)) { console.log('항목별 내역 조회 오류'); return; }
      // 원본처럼 차변 · 대변이 모두 0 인 행(전잔액만 있는 행)은 뺀다
      const src = (result.data || []).filter(r => (Number(r.dramt) || 0) !== 0 || (Number(r.cramt) || 0) !== 0);
      const out = [];
      if (src.length) out.push({_kind: 'h', it1nmShow: master.accnm || ''});
      let itK = null, t = null;
      const flush = () => { if (t) out.push({_kind: 's', it2nmShow: '', dramt: t.dr, cramt: t.cr, balamt: t.bal}); };
      // 원본 정렬 : 계정 → 항코드 (같은 항 안의 목 순서는 조회된 그대로)
      src.forEach((r, i) => r._i = i);
      //   원본 화면 확인 결과 : 항코드가 달라도(00335 / 00409) 빨간 소계는 계정 끝에 한 줄만 나온다
      //   → 소계는 계정 단위, 항 이름은 바뀔 때마다 보인다
      src.sort((x, y) => String(x.acccd).localeCompare(String(y.acccd)) || String(x.it1cd).localeCompare(String(y.it1cd)) || x._i - y._i);
      let nmK = null, itK2 = null;
      src.forEach(r => {
       const k = r.acccd;
       const newIt = k !== itK;
       if (newIt) { flush(); t = {dr: 0, cr: 0, bal: 0}; }
       const showNm = newIt || (r.it1nm || '') !== nmK || r.it1cd !== (itK2);
       itK2 = r.it1cd;
       const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0, bal = _this._bal(r);
       out.push(Object.assign({}, r, {_kind: 'd', it1nmShow: showNm ? r.it1nm : '', it2nmShow: r.it2nm, bfamt: Number(r.bfamt) || 0, dramt: dr, cramt: cr, balamt: bal}));
       t.dr += dr; t.cr += cr; t.bal += bal; itK = k; nmK = r.it1nm || '';
      });
      flush();
      _this.itemGrid1.itemsSource = out;
     });
    }

    // ══════ tab2 이동 ══════
    goToDetail(key, name) {
     this.tab2Key = {acccd: key.acccd || '', it1cd: key.it1cd || '', it2cd: key.it2cd || ''};
     this.tab2Name = name || '상세내역';
     $('#tab2Link').text(this.tab2Name).attr('title', this.tab2Name);
     $('#chkTotal').prop('checked', false);
     this.activateTab(2);
     this.searchItemDetail();
    }

    // ══════ tab2 (d_book12_1) ══════
    //   계정 머리행 · 항/목은 첫 줄만 · 잔액은 항이 바뀌면 다시 누계 · 목소계 · 계정소계(항 단위)
    searchItemDetail() {
     let _this = this;
     const k = _this.tab2Key;
     AjaxUtil.getAsyncData(this.url + '/readItemDetail', Object.assign(_this._cond(), {
      acccd: k.acccd, it1cd: k.it1cd, it2cd: k.it2cd
     }), function (result) {
      if (!(result != null && result.success)) { console.log('상세(tab2) 조회 오류'); return; }
      const src = (result.data || []).map(r => Object.assign({}, r, {d8: _this._d8(r.yymmdd)}));
      // 원본 d_book12_1 정렬 : mssec, acccd, it1cd, it2cd, yymmdd (재원이 맨 앞)
      src.sort((a, b) => String(a.mssec || '').localeCompare(String(b.mssec || '')) || String(a.acccd).localeCompare(String(b.acccd))
       || String(a.it1cd).localeCompare(String(b.it1cd)) || String(a.it2cd || '').localeCompare(String(b.it2cd || ''))
       || a.d8.localeCompare(b.d8));
      const out = [];
      let accK = null, itK = null, i2K = null, run = 0, m = null, g = null;
      const flushM = () => { if (m) out.push({_kind: 's', datef: '목소계', dramt: m.dr, cramt: m.cr}); m = null; };
      const flushG = () => { if (g) out.push({_kind: 's', datef: '계정소계', dramt: g.dr, cramt: g.cr, runamt: g.run, bfamt: g.bf}); g = null; };
      src.forEach(r => {
       const ik = r.it1cd, mk = ik + '|' + (r.it2cd || '');   // 원본 그룹 : acccd / acccd,it1cd / acccd,it1cd,it2cd
       const newAcc = r.acccd !== accK, newIt = newAcc || ik !== itK, newM = newIt || mk !== i2K;
       if (newM) flushM();
       if (newIt) { flushG(); run = 0; }
       if (newAcc) out.push({_kind: 'h', mssecnm: '', it1nmShow: r.accnm || ''});
       if (newIt) g = {dr: 0, cr: 0, run: 0, bf: 0};
       if (newM) m = {dr: 0, cr: 0};
       const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0, bf = Number(r.bfamt) || 0;
       run += bf;
       out.push(Object.assign({}, r, {_kind: 'd', it1nmShow: newIt ? r.it1nm : '', it2nmShow: newM ? r.it2nm : '',
        datef: _this._fmtD(r.d8), dramt: dr, cramt: cr, bfamt: bf, runamt: run}));
       m.dr += dr; m.cr += cr; g.dr += dr; g.cr += cr; g.run += run; g.bf += bf;
       accK = r.acccd; itK = ik; i2K = mk;
      });
      flushM(); flushG();
      _this.itemDetailGrid.itemsSource = out;
      _this.tab3Key = null;
      setTimeout(() => {
       const i = out.findIndex(o => o._kind === 'd' && o.it2cd);
       if (i > -1) _this.itemDetailGrid.select(i, 0);
      }, 0);
     });
    }

    // ══════ tab3 · tab4 (d_book12_2 / d_book12_3) : tab2 에서 고른 계정 · 항 · 목 ══════
    searchDetails() {
     let _this = this;
     const k = _this.tab3Key;
     if (!k) { _this.detailGrid3.itemsSource = []; _this.detailGrid4.itemsSource = []; _this.rows3 = []; _this.rows4 = []; return; }
     const data = Object.assign(_this._cond(), {acccd: k.acccd, it1cd: k.it1cd, it2cd: k.it2cd, mssec: '%'});
     AjaxUtil.getAsyncData(this.url + '/readDetail', data, function (res) {
      if (res != null && res.success) { _this.rows3 = _this.buildLedger(res.data || []); _this.detailGrid3.itemsSource = _this.rows3; }
     });
     AjaxUtil.getAsyncData(this.url + '/readDetail2', data, function (res) {
      if (res != null && res.success) { _this.rows4 = _this.buildLedger(res.data || []); _this.detailGrid4.itemsSource = _this.rows4; }
     });
    }

    // 원장 행 만들기 : 잔액 누계(이월 · 전표만), 월소계(97) · 월누계(98) 는 잔액 빈칸, 맨 끝 '계'
    buildLedger(src) {
     const _this = this;
     const rows = src.map(r => Object.assign({}, r, {d8: _this._d8(r.yymmdd), dramt: Number(r.dramt) || 0, cramt: Number(r.cramt) || 0, bfamt: Number(r.bfamt) || 0}))
     .filter(r => r.d8.endsWith('97') || r.d8.endsWith('98') || r.dramt !== 0 || r.cramt !== 0);
     rows.sort((a, b) => a.d8.localeCompare(b.d8) || String(a.spnum || '').localeCompare(String(b.spnum || '')) || (Number(a.rowseq) || 0) - (Number(b.rowseq) || 0));
     const out = [];
     let run = 0, cDr = 0, cCr = 0, tDr = 0, tCr = 0, last = null, prev = null;
     rows.forEach(r => {
      const isSub = r.d8 !== '00000000' && (r.d8.endsWith('97') || r.d8.endsWith('98'));
      if (isSub && r.d8.endsWith('97')) {
       out.push({_kind: 'm', d8: r.d8, datef: prev === 'm' ? '' : '월소계', mssecnm: r.mssecnm || '', dramt: r.dramt, cramt: r.cramt, balamt: null});
       prev = 'm'; last = null; return;
      }
      if (isSub) {
       if (prev !== 'c') out.push({_kind: 'c', d8: r.d8, datef: '월누계', dramt: cDr, cramt: cCr, balamt: null});
       prev = 'c'; return;
      }
      prev = null;
      run += r.bfamt; cDr += r.dramt; cCr += r.cramt; tDr += r.dramt; tCr += r.cramt;
      const f = _this._fmtD(r.d8);
      r._kind = 'd'; r.balamt = run; r.datef = (f === last) ? '' : f; r.mkey = f; last = f;
      if (r.d8 === '00000000' && !r.summy) r.summy = '전일이월';
      out.push(r);
     });
     if (out.length) out.push({_kind: 's', datef: '', summy: '계', dramt: tDr, cramt: tCr, balamt: null});
     return out;
    }

    openSlipFromRow(item) {
     if (item._kind !== 'd') return;
     const d8 = item.d8 || this._d8(item.yymmdd);
     if (!d8 || d8 === '00000000') { Alert.alert('확인', '전표일자가 있는 내역을 선택해주세요.'); return; }
     if (!item.spnum || item.spnum === '9999' || item.spnum === '0000') return;
     this.openSlipPopup({yymmdd: d8, spnum: item.spnum, acccd: item.acccd || ''});
    }

    // 총계정상세 (원본 dw_cdt itemchanged 'allchk')
    //   체크 : 계정 · 항 · 목 전체로 상세내역 조회 + 이동 / 해제 : 왼쪽 계정 + 오른쪽 항으로 다시 조회 (탭은 그대로)
    applyTotalFlag(checked) {

      _this.tab2Key = {acccd: '', it1cd: '', it2cd: ''};

      _this.tab2Name = acc ? (acc.accnm || '') + (item ? ' - ' + (item.it1nm || '') : '') : '상세내역';
     }

    // ══════════════════════════════════════
    // 인쇄 : 보고 있는 탭의 원본 인쇄용 DW 모양
    //   탭2 d_book12_1_print / 탭3 d_book12_2_print / 탭4 d_book12_3_print
    // ══════════════════════════════════════
    print() {
     const no = getActiveTabNo();
     if (no === 2) this.printItemDetail();
     else if (no === 3) this.printDetail3();
     else if (no === 4) this.printDetail4();
     else Alert.alert('확인', '집계내역 탭의 인쇄 양식(DW)은 아직 받지 못했습니다. 상세내역 탭에서 인쇄해 주세요.');
    }

    _esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
    _n0(v) { return (v == null || v === '') ? '' : Number(v).toLocaleString('ko-KR'); }

    _openPrint(title, sub, colsHtml, headHtml, bodyHtml) {
     const _this = this, esc = this._esc;
     AjaxUtil.getAsyncData(_this.url + '/readOrg', {}, function (res) {
      const org = (res && res.data && res.data.spjangnm) || '';
      const now = new Date(), p2 = n => String(n).padStart(2, '0');
      const ts = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
      const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>'
       + '@page{size:A4 portrait;margin:12mm 10mm 14mm;@bottom-center{content:"페이지 : " counter(page) " (" counter(pages) ")";font-size:10pt}}'
       + 'body{font-family:"Malgun Gothic",sans-serif;font-size:9.5pt;margin:0}'
       + 'h1{text-align:center;font-size:20pt;font-weight:bold;letter-spacing:4px;margin:4px 0}'
       + '.d{margin-bottom:2px}.hr{display:flex;align-items:flex-end;margin-bottom:4px}.hr div{flex:1}'
       + '.hr .s{text-align:center;font-size:12pt;font-weight:bold}.hr .t{text-align:right}'
       + 'table.g{width:100%;border-collapse:collapse}.g th,.g td{border:1px solid #555;padding:2px 4px;height:18px}'
       + '.g th{font-weight:normal}thead{display:table-header-group}tr{page-break-inside:avoid}'
       + '.c{text-align:center}.r{text-align:right}.b td{font-weight:bold}'
       + '</style></head><body><h1>' + esc(title) + '</h1>'
       + '<div class="d">기준일자 : ' + esc($('#searchfrdate').val()) + ' - ' + esc($('#searchtodate').val()) + '</div>'
       + '<div class="hr"><div>' + esc(org) + '</div><div class="s">' + esc(sub) + '</div><div class="t">출력일시 : ' + esc(ts) + '</div></div>'
       + '<table class="g"><colgroup>' + colsHtml + '</colgroup><thead><tr>' + headHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table></body></html>';
      const w = window.open('', '_blank', 'width=1000,height=800');
      if (!w) { Alert.alert('확인', '팝업이 차단되어 있습니다. 팝업을 허용해 주세요.'); return; }
      w.document.open(); w.document.write(html); w.document.close();
      w.onload = function () { w.focus(); w.print(); };
     });
    }

    // 탭2 인쇄 (d_book12_1_print) : 항 / 목 / 전표일자 / 차변 / 대변 / 잔액(그 행 금액), 항소계 · 계정소계
    printItemDetail() {
     const _this = this, esc = this._esc, n0 = this._n0, k = _this.tab2Key;
     if (!_this.itemDetailGrid.rows.length) { Alert.alert('확인', '상세내역을 조회한 뒤 인쇄하세요.'); return; }
     AjaxUtil.getAsyncData(_this.url + '/readPrintItemDetail', Object.assign(_this._cond(), {acccd: k.acccd, it1cd: k.it1cd}), function (res) {
      const rows = ((res && res.data) || []).map(r => Object.assign({}, r, {d8: _this._d8(r.yymmdd)}));
      if (!rows.length) { Alert.alert('확인', '인쇄할 내역이 없습니다.'); return; }
      rows.sort((a, b) => String(a.acccd).localeCompare(String(b.acccd)) || String(a.it1cd).localeCompare(String(b.it1cd))
       || String(a.it1nm || '').localeCompare(String(b.it1nm || '')) || a.d8.localeCompare(b.d8));
      let body = '', accK = null, itK = null, it = null, ac = null, accnm = rows[0].accnm || '';
      const sub = (lbl, t) => '<tr class="b"><td></td><td></td><td class="c">' + lbl + '</td><td class="r">' + n0(t.dr) + '</td><td class="r">' + n0(t.cr) + '</td><td class="r">' + n0(t.bf) + '</td></tr>';
      rows.forEach(r => {
       const ik = r.it1cd + '|' + (r.it1nm || '');
       const newAcc = r.acccd !== accK, newIt = newAcc || ik !== itK;
       if (newIt && it) body += sub('항소계', it);
       if (newAcc && ac) body += sub('계정소계', ac);
       if (newAcc) { ac = {dr: 0, cr: 0, bf: 0}; if (accK !== null) body += '<tr><td colspan="6" style="font-weight:bold">' + esc(r.accnm) + '</td></tr>'; }
       if (newIt) it = {dr: 0, cr: 0, bf: 0};
       const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0, bf = Number(r.bfamt) || 0;
       body += '<tr><td>' + (newIt ? esc(r.it1nm) : '') + '</td><td>' + esc(r.it2nm) + '</td><td class="c">' + esc(_this._fmtD(r.d8))
        + '</td><td class="r">' + n0(dr) + '</td><td class="r">' + n0(cr) + '</td><td class="r">' + n0(bf) + '</td></tr>';
       it.dr += dr; it.cr += cr; it.bf += bf; ac.dr += dr; ac.cr += cr; ac.bf += bf;
       accK = r.acccd; itK = ik;
      });
      if (it) body += sub('항소계', it);

     });
    }

    // ============================================================
    // 전표 팝업 (관항별원장/사업별입출 전표 팝업 이식)
    // ============================================================
    openSlipPopup(item) {
     let _this = this;
     if (_this.slipPopup) {
      _this.slipPopup.close();
      _this.slipPopup = null;
     }

     let content = tmpl('slipPopupTemplate', {});

    loadSlipDetail(item) {
     let _this = this;
     let spnum = item.spnum || item.slipno || '';
     let data = {
      yymmdd: item.yymmdd || '',
      spnum: spnum,
      slipno: spnum,
      acccd: item.acccd || ''
     };
     AjaxUtil.getAsyncData(_this.url + '/readSlip', data, function (res) {
      if (!res || !res.success) {
       Alert.alert('', '전표 조회 결과가 없습니다.');
       return;
      }
      _this.bindSlipPopup(res.data || {});
     });
    }

    fmtDateTime(v) {
     if (!v) return '';
     let s = String(v).trim();
     s = s.replace('T', ' ');
     let m = s.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
     if (m) return m[1];
     let d = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?(\d{2})?/);
     if (d) {
      let out = d[1] + '-' + d[2] + '-' + d[3];
      if (d[4]) out += ' ' + d[4] + ':' + (d[5] || '00') + ':' + (d[6] || '00');
      return out;
     }
     return s.substring(0, 19);
    }

    bindSlipPopup(data) {
     let _this = this;
     const h = data.head || data || {};
     const lines = data.lines || data.details || [];
     const first = lines.length > 0 ? lines[0] : {};

     const setV = (id, v) => {
      const $e = $('#' + id);
      if ($e.length) $e.val(v == null ? '' : v);
     };

     const yymmdd = h.spdate || h.yymmdd || '';
     setV('sp_yymmdd', String(yymmdd).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
     setV('sp_slipno', h.spnum || h.slipno || '');
     setV('sp_tiosecnm', h.tiosecnm || h.tiosec || '');
     setV('sp_inserdt', h.regdate || h.inserdt || '');
     setV('sp_buiscd', h.busipurnm || h.busipur || h.buiscd || '');
     setV('sp_spoccu', h.spoccunm || h.spoccu || '');
     setV('sp_updatedt', _this.fmtDateTime(h.inputdate || h.updatedt));
     setV('sp_title', h.subject || h.title || '');
     setV('sp_busim', h.businm || h.busim || '');
     setV('sp_orgnm', h.spjangnm || h.orgnm || '');
     setV('sp_remark', h.remark || '');
     const $cash = $('#sp_cashyn');
     if ($cash.length) $cash.prop('checked', (h.cashyn === '1' || h.cashyn === 'Y' || h.cashyn === true));

     setV('sp_custnm', first.cltnm || first.custnm || '');
     setV('sp_acctno', first.accnum || first.acctno || '');
     setV('sp_msseccd', first.mssec || first.msseccd || '');
     setV('sp_cardnm', first.cardnm || '');
     setV('sp_mssecnm', first.mssecnm || '');
     setV('sp_acctno2', first.banknm || '');

     if (_this.slipDetailGrid) {
      _this.slipDetailGrid.itemsSource = new wijmo.collections.CollectionView(lines);
     }
    }

    activateTab(no) {
     let $link = $('.tab-links a[href="#tab' + no + '"]');
     if ($link.length) { $link.trigger('click'); return; }
     $('.tab-item').removeClass('active');
     $('#tab' + no).addClass('active');
    }

    // 원본 ue_retrieve : 1 · 2 탭 → 집계를 다시 조회 / 3 · 4 탭 → 상세내역에서 고른 목
    searchMainData(tabNo) {
     tabNo = tabNo || 1;
     if ($('#acccd').val() && !$('#accnm').val().trim()) { Alert.alert('확인', '계정과목이 올바르지 않습니다.'); return; }
     if (tabNo === 1) this.searchSummary();
     else if (tabNo === 2) this.searchItemDetail();
     else this.searchDetails();
    }

   }//CategoryItemDetailLedgerPage

   function getActiveTabNo() {
    let $active = $('.tab-item.active');
    if (!$active.length) $active = $('.tab-item:visible').first();
    let no = parseInt(($active.attr('id') || 'tab1').replace('tab', ''), 10);
    return isNaN(no) ? 1 : no;
   }

   let page = null;

   $(document).ready(function () {
    page = new CategoryItemDetailLedgerPage();

    // 원본 open : 올해 1월 1일 ~ 오늘
    const now = new Date();
    $('#searchfrdate').val(CommonUtil.formatYYYYMMDD(new Date(now.getFullYear(), 0, 1)));
    $('#searchtodate').val(getNowDate());
    AjaxUtil.fillSelectOptions($('#mssec'), 'mssec', 'all', false);

    $('#btnSearch').on('click', function () { page.searchMainData(getActiveTabNo()); });
    $('#btnPrint').on('click', function () { page.print(); });
    $('#chkTotal').on('change', function () { page.applyTotalFlag($(this).is(':checked')); });

    // 관 · 항 · 목 : 엔터 → 팝업, 비우면 코드와 하위도 비움
    $('#accnm').on('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchAccnm(''); } })
    .on('input', function () { if ($(this).val() === '') { $('#acccd, #it1nm, #it1cd, #it2nm, #it2cd').val(''); } });
    $('#it1nm').on('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchIt1nm(''); } })
    .on('input', function () { if ($(this).val() === '') { $('#it1cd, #it2nm, #it2cd').val(''); } });
    $('#it2nm').on('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchIt2nm(''); } })
    .on('input', function () {
     if ($(this).val() === '') $('#it2cd').val('');
    });

    // 조회줄은 하나 — 탭을 옮기면 그 탭 맨 위로 옮긴다
    $('.tab-links a').on('click', function () {
     const $t = $($(this).attr('href'));
     if ($t.length) $t.prepend($('#cdtBox'));
    });

    page.searchMainData(1);   // 원본 open : 바로 조회

    $(document).on('keydown', function (ev) {
     if (ev.key === 'F4') {
      ev.preventDefault();
      page.searchMainData(getActiveTabNo());
     }
    });
   });
  </script>
