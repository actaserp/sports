<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<head>
    <style>
        .wj-header {
            text-align: center !important;
        }
    </style>
</head>

<th:block layout:fragment="content">
    <style>
        /* 조회 조건 한 줄 */
        .cc-top .search-wrap { align-items: flex-end; }
        .cc-top select.cc-state { height: 36px; width: 120px; padding: 0 10px; border-radius: 5px; }
        .cc-top .cc-hint { font-size: 11.5px; color: #8A99A8; margin-top: 4px; }

        /* 목록 위 요약 */
        .cc-summary { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
            margin: 0 0 8px; font-size: 12.5px; color: #45566A; }
        .cc-summary b { color: #1B2430; font-variant-numeric: tabular-nums; }
        .cc-summary .warn b { color: #8A5A00; }
        .cc-summary .alert b { color: #9E2A20; }

        /* 그리드 셀 표시 (formatItem 이 붙인다) */
        .cc-st { font-weight: 600; }
        .cc-st::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            margin-right: 5px; vertical-align: 1px; background: currentColor; }
        .cc-st.O    { color: #1F6B3A; }
        .cc-st.STOP { color: #9E2A20; }
        .cc-st.WAIT { color: #8A5A00; }
        .cc-idle { color: #8A5A00; font-weight: 600; }
        .cc-none { color: #B8C2CC; }
        .cc-open { color: #9E2A20; font-weight: 700; }

        /* 활동 이력 패널 */
        .cc-act { margin-top: 14px; }
        .cc-act-hd { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 8px; }
        .cc-act-hd h3 { margin: 0; font-size: 14px; font-weight: 700; color: #1B2430; }
        .cc-act-hd h3 span { font-weight: normal; font-size: 12.5px; color: #45566A; margin-left: 6px; }
        .cc-act-hd .sp { flex: 1 1 auto; }
        .cc-act-hd label.cc-chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
            color: #45566A; cursor: pointer; user-select: none; }
        .cc-act-hd a.cc-link { font-size: 12.5px; color: #24466F; text-decoration: underline; }
        .cc-act-empty { padding: 28px 20px; text-align: center; color: #8A99A8; font-size: 13px;
            border: 1px dashed #CBD3DB; background: #fff; }
        .cc-foot-space { height: 56px; }
    </style>

    <div class="layout-contents">
        <!-- Page Title -->
        <div class="page-title-wrap">
            <div class="left">
                <h2>고객사현황</h2>
            </div>
            <ul class="page-navi">
                <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
                <li>시스템관리</li>
                <li>고객사현황</li>
            </ul>
        </div>

        <section class="section">
            <div class="section-top cc-top">
                <form id="searchForm3" autocomplete="off" onsubmit="return false;">
                    <div class="search-wrap">
                        <dl>
                            <dt>가입일자</dt>
                            <dd>
                                <ul class="date-box">
                                    <li>
                                        <input class="tac date_from" type="date" id="srchStartDt" name="srchStartDt"/>
                                        <label for="srchStartDt" class="hide">시작일</label>
                                    </li>
                                    <li>
                                        <input class="tac date_to" type="date" id="srchEndDt" name="srchEndDt"/>
                                        <label for="srchEndDt" class="hide">종료일</label>
                                    </li>
                                </ul>
                            </dd>
                        </dl>

                        <dl>
                            <dt><label for="srchState">상태</label></dt>
                            <dd>
                                <select id="srchState" class="cc-state">
                                    <option value="">전체</option>
                                    <option value="WAIT">승인 대기</option>
                                    <option value="O">승인</option>
                                    <option value="STOP">중지</option>
                                </select>
                            </dd>
                        </dl>

                        <dl>
                            <dt><label for="keyword">회원명</label></dt>
                            <dd>
                                <div class="srch-box">
                                    <input class="form-control2" id="keyword" name="keyword"
                                           placeholder="회원명 · 코드 · 등록번호"/>
                                </div>
                            </dd>
                        </dl>

                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <a class="btn btn-delete" title="검색 (F4)" id="btnSearch">
                                        <img th:src="@{/images/icon/btn-srch.svg}" alt="검색 아이콘">
                                        검색
                                    </a>
                                </li>
                            </dd>
                        </dl>
                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <button type="button" class="btn-delete" id="batchApprove"
                                            style="width: 86px; height: 36px;">승인</button>
                                </li>
                            </dd>
                        </dl>
                        <dl>
                            <dt><span class="eq"></span></dt>
                            <dd>
                                <li>
                                    <button type="button" class="btn-delete" id="btnStop"
                                            style="width: 86px; height: 36px;">중지</button>
                                </li>
                            </dd>
                        </dl>
                    </div>
                </form>
            </div> <!--//section-top end -->

            <div class="container-fluid">
                <div class="cc-summary" id="ccSummary"></div>
                <div id="theGrid" style="height: 420px; max-height: 420px;"></div>
            </div>

            <!-- 선택한 고객사의 활동 이력 -->
            <div class="cc-act">
                <div class="cc-act-hd">
                    <h3 id="ccActTitle">활동 이력<span>목록에서 고객사를 선택하세요</span></h3>
                    <span class="ca-chips" id="ccTypeChips" role="group" aria-label="유형"></span>
                    <label class="cc-chk"><input type="checkbox" id="ccUndone"/> 미완료만</label>
                    <span class="sp"></span>
                    <a class="cc-link" th:href="@{/gui/wm_customer_activity}" id="ccAllLink">전체 이력 보기</a>
                    <button type="button" class="ca-btn solid" id="ccActNew" disabled>+ 이력 등록</button>
                </div>
                <div id="ccActMount" style="display:none"></div>
                <div class="cc-act-empty" id="ccActEmpty">위 목록에서 고객사 행을 누르면 교육 · 요청 · 계약 · 장애 이력이 나옵니다.</div>
            </div>
            <div class="cc-foot-space" id="ccFootSpace"></div>
        </section>
    </div> <!--//layout-contents end -->

</th:block>
<th:block layout:fragment="scripts">
    <th:block th:replace="common/approve_box :: approve_box"></th:block>
    <th:block th:replace="common/ax5_uploader :: ax5_uploader"></th:block>
    <th:block th:replace="common/upload_one_image_box :: upload_one_image_box"></th:block>
    <th:block th:replace="common/popup_select_user_code :: popup_select_user_code"></th:block>
    <th:block th:replace="common/customer_activity_box :: customer_activity_box"></th:block>

    <script type="text/javascript">

        // 상태값은 CustomerCurrentService.STATE_APPROVED · STATE_STOPPED 와 같다
        const ST_APPROVED = 'O', ST_STOPPED = '중지', INTERNAL = 'ZZ';
        const IDLE_DAYS = 30;   // 마지막 사용이 이보다 오래되면 강조

        var theGrid;
        var actBox;
        var current = null;     // 이력 패널에 띄운 고객사 행
        var actTypes = [];      // 이력 유형 필터 (빈 배열 = 전체)

        document.addEventListener('DOMContentLoaded', () => {
            init();
            searchDataBind();
        });

        function init() {
            theGrid = new wijmo.grid.FlexGrid('#theGrid', {
                selectionMode: wijmo.grid.SelectionMode.Row,
                headersVisibility: wijmo.grid.HeadersVisibility.Column,
                autoGenerateColumns: false,
                showMarquee: true,
                frozenColumns: 3,
                columns: [
                    {binding: 'selected', header: '', width: 40, align: 'center', allowSorting: false,
                        isReadOnly: false, dataType: 'Boolean'},
                    {binding: 'seq', header: '순번', width: 50, align: 'center'},
                    {binding: 'spjangnm', header: '회원명', width: 190, align: 'left'},
                    {binding: 'spjangcd', header: '코드', width: 60, align: 'center'},
                    {binding: 'state_nm', header: '상태', width: 90, align: 'left'},
                    {binding: 'plan_nm', header: '요금제', width: 90, align: 'left'},
                    {binding: 'join_dt', header: '가입일', width: 96, align: 'center'},
                    {binding: 'approve_dt', header: '승인일', width: 96, align: 'center'},
                    {binding: 'stop_dt', header: '중지일', width: 96, align: 'center'},
                    {binding: 'subscribeunit', header: '구독단위', width: 76, align: 'center'},
                    {binding: 'billingdate', header: '청구일', width: 60, align: 'center'},
                    {binding: 'users_txt', header: '계정(활성/전체)', width: 110, align: 'center'},
                    {binding: 'last_use', header: '마지막 사용', width: 104, align: 'center'},
                    {binding: 'open_cnt', header: '미완료 이력', width: 90, align: 'center'},
                    {binding: 'last_act', header: '마지막 활동', width: 104, align: 'center'},
                    {binding: 'saupnum', header: '등록번호', width: 120, align: 'left'},
                    {binding: 'prenm', header: '대표자', width: 90, align: 'left'},
                    {binding: 'tel1', header: '연락처', width: 120, align: 'left'},
                    {binding: 'emailadres', header: '이메일', width: '*', minWidth: 160, align: 'left'}
                ],
                itemsSource: new wijmo.collections.CollectionView([])
            });

            new FlexGridContextMenu(theGrid);
            theGrid.downloadFileName = '고객사 현황';

            // 데이터 로드 후 초기 선택 상태 해제
            theGrid.loadedRows.addHandler(() => {
                setTimeout(() => theGrid.select(-1, -1), 0);
            });

            theGrid.formatItem.addHandler((s, e) => {
                const col = s.columns[e.col];

                if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
                    e.cell.style.textAlign = 'center';
                    // 헤더 체크박스 (전체선택)
                    if (col.binding === 'selected') {
                        e.cell.innerHTML = '<input type="checkbox" id="allCheck" title="전체 선택"/>';
                        const allCheck = e.cell.querySelector('#allCheck');
                        const items = theGrid.itemsSource.items;
                        allCheck.checked = items.length > 0 && items.every(row => row.selected);
                        allCheck.onclick = (ev) => {
                            const checked = ev.target.checked;
                            items.forEach(row => row.selected = checked);
                            theGrid.refresh();
                        };
                    }
                    return;
                }
                if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;

                const item = s.rows[e.row].dataItem;
                if (!item) return;
                if (col.binding === 'state_nm') {
                    e.cell.innerHTML = '<span class="cc-st ' + item.state_cd + '" title="' + esc(item.state || '(비어 있음)') + '">' +
                        esc(item.state_nm) + '</span>';
                } else if (col.binding === 'last_use') {
                    if (!item.last_use) {
                        e.cell.innerHTML = '<span class="cc-none">사용 전</span>';
                    } else if (item.idle_days >= IDLE_DAYS && item.state_cd === 'O') {
                        e.cell.innerHTML = '<span class="cc-idle" title="' + item.idle_days + '일째 사용 없음">' + esc(item.last_use) + '</span>';
                    }
                } else if (col.binding === 'open_cnt') {
                    e.cell.innerHTML = item.open_cnt > 0
                        ? '<span class="cc-open">' + item.open_cnt + '</span>'
                        : '<span class="cc-none">0</span>';
                }
            });

            // 체크박스 컬럼만 편집 허용
            theGrid.beginningEdit.addHandler((s, e) => {
                if (s.columns[e.col].binding !== 'selected') e.cancel = true;
            });

            // 행을 고르면 아래에 그 고객사의 이력을 띄운다
            theGrid.selectionChanged.addHandler((s) => {
                const r = s.selection.row;
                if (r < 0 || !s.rows[r]) return;
                const item = s.rows[r].dataItem;
                if (item && (!current || current.spjangcd !== item.spjangcd)) showActivity(item);
            });

            actBox = new CustomerActivityBox({
                mount: '#ccActMount',
                showSite: false,
                pageSize: 10,
                // 저장 · 삭제하면 목록의 '미완료 이력' · '마지막 활동' 도 바뀌므로 다시 읽는다
                onChange: () => searchDataBind(true)
            });
            renderTypeChips();

            $('#ccTypeChips').on('click', '.ca-chip', function () {
                const v = $(this).attr('data-v');
                const on = $(this).attr('aria-pressed') !== 'true';
                $(this).attr('aria-pressed', String(on));
                actTypes = on ? actTypes.concat([v]) : actTypes.filter(x => x !== v);
                loadActivity();
            });
            $('#ccUndone').on('change', loadActivity);
            $('#ccActNew').on('click', () => actBox.openEditor(null));

            $('#batchApprove').on('click', () => batchApprove());
            $('#btnStop').on('click', () => btnStop());
            $('#btnSearch').on('click', () => searchDataBind());
            $('#srchState').on('change', () => searchDataBind());
            $('#keyword').on('keydown', (e) => {
                if (e.key === 'Enter') searchDataBind();
            });
            $(document).on('keydown', (ev) => {
                if (ev.key === 'F4') {
                    ev.preventDefault();
                    searchDataBind();
                }
            });

            fitFooter();
            window.addEventListener('resize', fitFooter);
        }

        // ── 목록 ────────────────────────────────────────────

        /** @param keep true 면 선택 · 이력 패널을 그대로 둔다 (이력 저장 뒤 숫자만 새로 고칠 때) */
        function searchDataBind(keep) {
            const st = $('#srchStartDt').val(), en = $('#srchEndDt').val();
            if (st && en && st > en) {
                Alert.alert('', '가입일자 시작일이 종료일보다 늦습니다.');
                return;
            }
            if ((st && !en) || (!st && en)) {
                Alert.alert('', '가입일자는 시작일과 종료일을 함께 입력하거나 둘 다 비워 주세요.');
                return;
            }

            $.ajax({
                url: '/api/system/customer_current/read',
                type: 'GET',
                data: {srchStartDt: st, srchEndDt: en, keyword: $('#keyword').val(), state: $('#srchState').val()},
                success: function (result) {
                    if (!result || !result.success) {
                        Alert.alert('', (result && result.message) || '조회에 실패했습니다.');
                        return;
                    }
                    const rows = (result.data || []).map(prepare);
                    const checked = keep ? new Set(theGrid.itemsSource.items.filter(r => r.selected).map(r => r.spjangcd)) : null;
                    if (checked) rows.forEach(r => r.selected = checked.has(r.spjangcd));
                    theGrid.itemsSource.sourceCollection = rows;
                    theGrid.refresh();
                    renderSummary(rows);
                    if (current) {
                        const again = rows.find(r => r.spjangcd === current.spjangcd);
                        if (again) {
                            current = again;
                            renderActTitle();
                        }
                    }
                },
                error: function (jqXHR, textStatus) {
                    Alert.alert('', '조회 중 오류가 발생했습니다. (' + textStatus + ')');
                }
            });
        }

        /** 서버 행 → 그리드 행 (표시용 값을 미리 만든다) */
        function prepare(r, i) {
            const state = String(r.state || '').trim();
            const cd = state === ST_APPROVED ? 'O' : (state === ST_STOPPED ? 'STOP' : 'WAIT');
            const idle = r.last_use ? daysSince(r.last_use) : null;
            return Object.assign({}, r, {
                selected: false,
                seq: i + 1,
                state_cd: cd,
                state_nm: cd === 'O' ? '승인' : (cd === 'STOP' ? '중지' : '승인 대기'),
                join_dt: ymd(r.subscriptiondate),
                approve_dt: ymd(r.approvedate),
                // 중지일 : 중지 상태일 때만 의미가 있다 (승인하면 서버가 비운다)
                stop_dt: cd === 'STOP' ? ymd(r.expirationdate) : '',
                users_txt: (Number(r.active_cnt) || 0) + ' / ' + (Number(r.user_cnt) || 0),
                open_cnt: Number(r.open_cnt) || 0,
                idle_days: idle
            });
        }

        function renderSummary(rows) {
            const n = cd => rows.filter(r => r.state_cd === cd).length;
            const idle = rows.filter(r => r.state_cd === 'O' && (r.idle_days === null || r.idle_days >= IDLE_DAYS)).length;
            const open = rows.reduce((a, r) => a + r.open_cnt, 0);
            $('#ccSummary').html(
                '<span>전체 <b>' + rows.length + '</b>곳</span>' +
                '<span class="warn">승인 대기 <b>' + n('WAIT') + '</b></span>' +
                '<span>승인 <b>' + n('O') + '</b></span>' +
                '<span class="alert">중지 <b>' + n('STOP') + '</b></span>' +
                '<span class="warn" title="승인됐는데 ' + IDLE_DAYS + '일 넘게 실무자 사용이 없거나 아직 안 쓴 곳">' +
                '사용 저조 <b>' + idle + '</b></span>' +
                '<span class="alert">미완료 이력 <b>' + open + '</b>건</span>');
        }

        // ── 활동 이력 패널 ───────────────────────────────────

        function renderTypeChips() {
            $('#ccTypeChips').html(CustomerActivityBox.TYPES.map(t =>
                '<button type="button" class="ca-chip" data-v="' + t.v + '" aria-pressed="false">' + esc(t.t) + '</button>').join(''));
        }

        function showActivity(item) {
            current = item;
            actBox.setSite(item.spjangcd);
            renderActTitle();
            $('#ccActEmpty').hide();
            $('#ccActMount').show();
            $('#ccActNew').prop('disabled', false);
            loadActivity();
        }

        function renderActTitle() {
            if (!current) return;
            $('#ccActTitle').html('활동 이력 · ' + esc(current.spjangnm || current.spjangcd) +
                '<span>' + esc(current.spjangcd) + (current.open_cnt ? ' · 미완료 ' + current.open_cnt + '건' : '') + '</span>');
            // 전체 이력 화면으로 갈 때 이 고객사를 골라 둔 채로 연다
            const base = $('#ccAllLink').attr('href').split('?')[0];
            $('#ccAllLink').attr('href', base + '?site=' + encodeURIComponent(current.spjangcd));
        }

        function loadActivity() {
            if (!current) return;
            actBox.load({
                site: current.spjangcd,   // spjangcd 로 보내면 보안 인터셉터가 막는다
                types: actTypes.join(','),
                status: $('#ccUndone').is(':checked') ? 'UNDONE' : ''
            });
        }

        // ── 승인 · 중지 ─────────────────────────────────────

        /** 승인 · 중지 요청 중에는 두 버튼을 잠근다 (두 번 눌러 겹치지 않게) */
        function lockActions(on) {
            $('#batchApprove, #btnStop').prop('disabled', on).css('opacity', on ? .5 : '');
        }

        function checkedRows() {
            return theGrid.itemsSource.items.filter(row => row.selected === true);
        }

        /** 확인창에 넣을 이름 목록. 많으면 앞의 몇 곳만 */
        function nameList(rows) {
            const names = rows.map(r => '· ' + (r.spjangnm || r.spjangcd));
            return names.length > 8 ? names.slice(0, 8).join('\n') + '\n· 외 ' + (names.length - 8) + '곳' : names.join('\n');
        }

        function batchApprove() {
            const rows = checkedRows();
            if (!rows.length) {
                Alert.alert('', '승인할 사업체를 선택하여주세요');
                return;
            }
            const todo = rows.filter(r => r.state_cd !== 'O');
            if (!todo.length) {
                Alert.alert('', '선택한 사업체는 모두 이미 승인되어 있습니다.');
                return;
            }
            const re = todo.filter(r => r.state_cd === 'STOP').length;
            const msg = '아래 ' + todo.length + '곳을 승인합니다.\n' + nameList(todo) +
                (re ? '\n\n중지됐던 ' + re + '곳은 중지 때 막았던 계정의 로그인이 다시 열립니다.' : '') +
                (todo.length < rows.length ? '\n\n(이미 승인된 ' + (rows.length - todo.length) + '곳은 건너뜁니다)' : '');
            Alert.confirm('', msg, () => {
                lockActions(true);
                const unlock = setTimeout(() => lockActions(false), 30000);   // 응답이 안 와도 풀리게
                AjaxUtil.postJsonData('/api/system/customer_current/batchApprove', {ids: todo.map(r => r.spjangcd)}, res => {
                    clearTimeout(unlock);
                    lockActions(false);
                    Alert.alert('', (res && res.message) || (res && res.success ? '승인되었습니다' : '승인하지 못했습니다.'));
                    if (res && res.success) {
                        searchDataBind();
                        if (current && todo.some(r => r.spjangcd === current.spjangcd)) loadActivity();
                    }
                });
            });
        }

        function btnStop() {
            const rows = checkedRows();
            if (!rows.length) {
                Alert.alert('', '중지할 사업체를 선택하여주세요');
                return;
            }
            if (rows.some(r => r.spjangcd === INTERNAL)) {
                Alert.alert('', '내부 사업장(' + INTERNAL + ')은 중지할 수 없습니다. 선택에서 빼 주세요.');
                return;
            }
            const todo = rows.filter(r => r.state_cd !== 'STOP');
            if (!todo.length) {
                Alert.alert('', '선택한 사업체는 모두 이미 중지되어 있습니다.');
                return;
            }
            const users = todo.reduce((a, r) => a + (Number(r.active_cnt) || 0), 0);
            const msg = '아래 ' + todo.length + '곳을 중지합니다.\n' + nameList(todo) +
                '\n\n해당 사업장 계정 ' + users + '개의 로그인이 막힙니다. 다시 승인하면 풀립니다.' +
                '\n(이미 로그인해 있는 사용자는 세션이 끝날 때까지 쓸 수 있습니다)';
            Alert.confirm('', msg, () => {
                lockActions(true);
                const unlock = setTimeout(() => lockActions(false), 30000);   // 응답이 안 와도 풀리게
                AjaxUtil.postJsonData('/api/system/customer_current/btnStop', {ids: todo.map(r => r.spjangcd)}, res => {
                    clearTimeout(unlock);
                    lockActions(false);
                    Alert.alert('', (res && res.message) || (res && res.success ? '중지되었습니다' : '중지하지 못했습니다.'));
                    if (res && res.success) {
                        searchDataBind();
                        if (current && todo.some(r => r.spjangcd === current.spjangcd)) loadActivity();
                    }
                });
            });
        }

        // ── 공통 ────────────────────────────────────────────

        function ymd(v) {
            const s = String(v || '').trim();
            return /^\d{8}$/.test(s) ? s.substring(0, 4) + '-' + s.substring(4, 6) + '-' + s.substring(6) : s;
        }

        function daysSince(d) {
            const t = Date.UTC(+d.substring(0, 4), +d.substring(5, 7) - 1, +d.substring(8, 10));
            const n = new Date();
            return Math.floor((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate()) - t) / 86400000);
        }

        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        /** 하단 고정 푸터가 마지막 줄을 덮지 않게 그 높이만큼 비운다 */
        function fitFooter() {
            const f = document.querySelector('footer, .footer, .layout-footer, #footer');
            if (!f) return;
            const pos = getComputedStyle(f).position;
            if (pos === 'fixed' || pos === 'absolute' || pos === 'sticky') {
                document.getElementById('ccFootSpace').style.height = Math.round(f.getBoundingClientRect().height + 24) + 'px';
            }
        }

    </script>
</th:block>
