<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <style>
      .grid-guide-box {
          background: #eef3ff;
          border-left: 4px solid #2f5cff;
          padding: 6px 10px;
          font-size: 13px;
          margin-bottom: 6px;
          color: #333;
      }
      /* 집계내역 좌우 2분할 */
      .split-wrap { display: flex; gap: 8px; }
      .split-left  { width: 650px; flex: 0 0 650px; }
      .split-right { flex: 1 1 auto; min-width: 0; }

      /* ── 전표 팝업 레이아웃 ── */
      .slip-popup .slip-head-table,
      .slip-popup .slip-foot-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-head-table td,
      .slip-popup .slip-foot-table th,
      .slip-popup .slip-foot-table td {
          border: 1px solid #d5d9e0;
          padding: 4px 6px;
          font-size: 13px;
          vertical-align: middle;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-foot-table th {
          background: #f5f6f8;
          color: #333;
          font-weight: 600;
          text-align: center;
          white-space: nowrap;
      }
      .slip-popup .slip-head-table td input,
      .slip-popup .slip-head-table td textarea,
      .slip-popup .slip-foot-table td input {
          width: 100%;
          border: none;
          background: transparent;
          font-size: 13px;
          box-sizing: border-box;
      }
      .slip-popup .slip-head-table td textarea { resize: none; }
      .slip-popup .chk-cell { text-align: center; white-space: nowrap; }
      .slip-popup .slip-grid-box { margin: 8px 0; }
      .slip-popup { width: 100%; box-sizing: border-box; padding: 4px; }
      .slip-popup .section { width: 100%; }
  </style>
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>관항목별원장</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>장부출력</li>
        <li>관항목별원장</li>
      </ul>
    </div>
    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tab1" title="집계 내역">집계 내역</a></li>
        <li><a href="#tab2" id="tab2Link" title="상세내역">상세내역</a></li>
        <li><a href="#tab3" title="상세 내역(재원별)">상세 내역(재원별)</a></li>
        <li><a href="#tab4" title="상세 내역">상세 내역</a></li>
      </ul>
      <div class="tab-contents">

        <!-- ── 집계 내역 (tab1) : 좌(관+금액) + 우(항+목) 2분할 ── -->
        <section class="tab-item" id="tab1">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate1" name="searchfrdate1" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate1" name="searchtodate1" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>구분</label></dt>
                <dd>
                  <select class="form-control2" id="tiosec1" name="tiosec1" style="width: 100px;">
                    <option value="1">세입</option>
                    <option value="2">세출</option>
                  </select>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목(관)</label></dt>
                <dd>
                  <input class="form-control2" id="accnm1" name="accnm1" placeholder="관 (엔터로 검색)" />
                  <input type="hidden" id="acccd1" name="acccd1" />
                </dd>
              </dl>
              <dl>
                <dt><label>항</label></dt>
                <dd>
                  <input class="form-control2" id="it1nm1" name="it1nm1" placeholder="항 (엔터로 검색)" />
                  <input type="hidden" id="it1cd1" name="it1cd1" />
                </dd>
              </dl>
              <dl>
                <dt><label>목</label></dt>
                <dd>
                  <input class="form-control2" id="it2nm1" name="it2nm1" placeholder="목 (엔터로 검색)" />
                  <input type="hidden" id="it2cd1" name="it2cd1" />
                </dd>
              </dl>
              <!--<dl>
                <dt><label>재원</label></dt>
                <dd>
                  <select class="form-control2" id="mssec1" name="mssec1"></select>
                </dd>
              </dl>-->
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <li>
                    <button class="btn btn-delete" id="btnSearch1" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 왼쪽 계정과목을 선택하면 오른쪽에 항·목별 내역이 표시됩니다. 관·항·목은 엔터로 팝업 검색합니다. (단축키 조회:F4)</div>
          <div class="split-wrap">
            <div class="split-left">
              <div id="theGrid_acc" style="height: 495px;"></div>
            </div>
            <div class="split-right">
              <div id="theGrid_item" style="height: 495px;"></div>
            </div>
          </div>
        </section>

        <!-- ── 상세내역 (tab2) : 관→항→목 3단계 그룹 + 소계 (마스터) ── -->
        <section class="tab-item" id="tab2">
          <div class="section-top">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate2" name="searchfrdate2" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate2" name="searchtodate2" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>구분</label></dt>
                <dd>
                  <select class="form-control2" id="tiosec2" name="tiosec2">
                    <option value="1">세입</option>
                    <option value="2">세출</option>
                  </select>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목(관)</label></dt>
                <dd>
                  <input class="form-control2" id="accnm2" name="accnm2" placeholder="관 (엔터로 검색)" />
                  <input type="hidden" id="acccd2" name="acccd2" />
                </dd>
              </dl>
              <dl>
                <dt><label>항</label></dt>
                <dd>
                  <input class="form-control2" id="it1nm2" name="it1nm2" placeholder="항 (엔터로 검색)" />
                  <input type="hidden" id="it1cd2" name="it1cd2" />
                </dd>
              </dl>
              <dl>
                <dt><label>목</label></dt>
                <dd>
                  <input class="form-control2" id="it2nm2" name="it2nm2" placeholder="목 (엔터로 검색)" />
                  <input type="hidden" id="it2cd2" name="it2cd2" />
                </dd>
              </dl>
              <dl>
                <dt><label>재원</label></dt>
                <dd>
                  <select class="form-control2" id="mssec2" name="mssec2"></select>
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <li>
                    <button class="btn btn-delete" id="btnSearch2" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 행을 선택하면 상세내역(재원별)·상세내역 탭이 조회됩니다.</div>
          <div class="grid_box" id="divItemDetail">
            <div id="theGrid_item_detail" style="height: 495px;"></div>
          </div>
        </section>

        <!-- ── 상세내역(재원별) (tab3) : 디테일 ── -->
        <section class="tab-item" id="tab3">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail3">
            <div id="theGrid_detail3" style="height: 495px;"></div>
          </div>
        </section>

        <!-- ── 상세내역 (tab4) : 디테일(카드) ── -->
        <section class="tab-item" id="tab4">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail4">
            <div id="theGrid_detail4" style="height: 495px;"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <!-- 관명 팝업 -->
  <script id="accnmTemplate" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="AccGrid" style="height:350px; display:block;"></div></section></div>
  </script>
  <!-- 항명 팝업 -->
  <script id="it1Template" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="It1Grid" style="height:350px; display:block;"></div></section></div>
  </script>
  <!-- 목명 팝업 -->
  <script id="it2Template" type="text/x-tmpl">
    <div class="content_wrap popup"><section class="section"><div id="It2Grid" style="height:350px; display:block;"></div></section></div>
  </script>

  <!-- 전표 팝업 -->
  <script id="slipPopupTemplate" type="text/x-tmpl">
    <div class="content_wrap popup slip-popup">
      <section class="section">
        <div class="slip-header">
          <table class="slip-head-table">
            <colgroup>
              <col style="width:90px"><col>
              <col style="width:90px"><col>
              <col style="width:90px"><col>
              <col style="width:80px"><col>
            </colgroup>
            <tbody>
              <tr>
                <th>전표일자</th><td><input type="date" id="sp_yymmdd" readonly></td>
                <th>전표번호</th><td><input type="text" id="sp_slipno" readonly></td>
                <th>입출금번호</th><td><input type="text" id="sp_tiosecnm" readonly></td>
                <th>작성일자</th><td><input type="text" id="sp_inserdt" readonly></td>
              </tr>
              <tr>
                <th>사업구분</th><td><input type="text" id="sp_buiscd" readonly></td>
                <th>증빙구분</th><td><input type="text" id="sp_spoccu" readonly></td>
                <th>최종수정일</th><td><input type="text" id="sp_updatedt" readonly></td>
                <th>현금</th><td class="chk-cell"><input type="checkbox" id="sp_cashyn" disabled></td>
              </tr>
              <tr>
                <th>제목</th><td colspan="3"><input type="text" id="sp_title" readonly></td>
                <th>사업명</th><td colspan="3"><input type="text" id="sp_busim" readonly></td>
              </tr>
              <tr>
                <th>기관명</th><td colspan="7"><input type="text" id="sp_orgnm" readonly></td>
              </tr>
              <tr>
                <th>비고</th><td colspan="7"><textarea id="sp_remark" rows="4" readonly></textarea></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="slip-grid-box"><div id="SlipDetailGrid" style="height:200px; display:block;"></div></div>
        <div class="slip-footer">
          <table class="slip-foot-table">
            <colgroup>
              <col style="width:80px"><col>
              <col style="width:80px"><col>
              <col style="width:80px"><col>
            </colgroup>
            <tbody>
              <tr>
                <th>거래처</th><td><input type="text" id="sp_custnm" readonly></td>
                <th>계좌번호</th><td><input type="text" id="sp_acctno" readonly></td>
                <th>수입자체</th><td><input type="text" id="sp_msseccd" readonly></td>
              </tr>
              <tr>
                <th>카드</th><td><input type="text" id="sp_cardnm" readonly></td>
                <th>재원</th><td><input type="text" id="sp_mssecnm" readonly></td>
                <th></th><td><input type="text" id="sp_acctno2" readonly></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </script>

</th:block>
<th:block layout:fragment="scripts">
  <th:block th:replace="common/popup_account :: popup_account" />
  <script type="text/javascript">
   class CategoryItemDetailLedgerPage {
    constructor() {
     this.url = '/api/ledger/CategoryItemDetailLedger';
     this.entry_url = '/api/account_management/slip_entry';
     this.accGrid1 = null;         // tab1 좌 - 관
     this.itemGrid1 = null;        // tab1 우 - 항+목
     this.itemDetailGrid = null;   // tab2 - 마스터
     this.detailGrid3 = null;      // tab3 - 재원별
     this.detailGrid4 = null;      // tab4 - 카드
     this.mssecOptions = null;
     this.tab2Name = '상세내역';
     this.init();
    }

    init() {
     let _this = this;

     // ══════════════════════════════════════
     // tab1 좌 : 관(계정과목) + 금액
     // ══════════════════════════════════════
     _this.accGrid1 = new wijmo.grid.FlexGrid('#theGrid_acc', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'accnm',  header: '계정과목', width: 160, align: 'left'},
       {binding: 'bfamt',  header: '전잔액',   width: 120, align: 'right', format: 'n0'},
       {binding: 'dramt',  header: '차변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 120, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.accGrid1);
     _this.accGrid1.downloadFileName = '계정과목';
     _this.accGrid1.columnFooters.rows.push(new wijmo.grid.GroupRow());
     let acIdx = _this.accGrid1.columns.findIndex(c => c.binding === 'accnm');
     if (acIdx > -1) _this.accGrid1.columnFooters.setCellData(0, acIdx, '합계');
     ['bfamt','dramt','cramt','balamt'].forEach(b => {
      const col = _this.accGrid1.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     _this.accGrid1.selectionChanged.addHandler(function () {
      const master = _this.accGrid1.selectedItems[0];
      if (master) _this.loadItemsByAcc(master);
     });

     // ══════════════════════════════════════
     // tab1 우 : 항+목별 내역
     // ══════════════════════════════════════
     _this.itemGrid1 = new wijmo.grid.FlexGrid('#theGrid_item', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 2,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'it1nm',  header: '항',       width: 160, align: 'left'},
       {binding: 'it2nm',  header: '목',       width: 160, align: 'left'},
       {binding: 'bfamt',  header: '전잔액',   width: 120, align: 'right', format: 'n0'},
       {binding: 'dramt',  header: '차변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'cramt',  header: '대변금액', width: 120, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액',     width: 120, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.itemGrid1);
     _this.itemGrid1.downloadFileName = '항목별내역';
     _this.itemGrid1.columnFooters.rows.push(new wijmo.grid.GroupRow());
     let itIdx = _this.itemGrid1.columns.findIndex(c => c.binding === 'it1nm');
     if (itIdx > -1) _this.itemGrid1.columnFooters.setCellData(0, itIdx, '합계');
     ['bfamt','dramt','cramt','balamt'].forEach(b => {
      const col = _this.itemGrid1.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     // tab1 우측 항·목 더블클릭 → tab2 이름 변경 + 이동 + 조회
     _this.itemGrid1.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.itemGrid1.hitTest(e);
      if (ht.cellType === wijmo.grid.CellType.Cell) {
       const item = _this.itemGrid1.selectedItems[0];
       if (item) _this.goToDetailFromSummary(item);
      }
     });

     // ══════════════════════════════════════
     // tab2 : 상세내역 (관→항→목 3단계 그룹 + 소계)
     // ══════════════════════════════════════
     _this.itemDetailGrid = new wijmo.grid.FlexGrid('#theGrid_item_detail', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: false,
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 3,
      showGroups: true,
      groupHeaderFormat: '{value}',
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center';
      },
      columns: [
       {binding: 'mssecnm', header: '재원',     width: 110, align: 'center'},
       {binding: 'it1nm',   header: '항',       width: 150, align: 'left'},
       {binding: 'it2nm',   header: '목',       width: 150, align: 'left'},
       {binding: 'yymmdd',  header: '전표일자', width: 110, align: 'center'},
       {binding: 'dramt',   header: '차변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'cramt',   header: '대변금액', width: 140, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.itemDetailGrid);
     _this.itemDetailGrid.downloadFileName = '상세내역';

     ['dramt','cramt'].forEach(b => {
      const col = _this.itemDetailGrid.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });

     // 그룹 푸터 : 목(레벨2)=목항소계, 관(레벨0)=계정소계, 항(레벨1)=표시 안함
     _this.itemDetailGrid.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType === wijmo.grid.CellType.Cell) {
       const row = s.rows[e.row];
       if (row instanceof wijmo.grid.GroupRow && row.dataItem == null) {
        const gr = row;
        if (gr.level === 1) return;  // 항 소계는 표시 안 함
        const label = (gr.level === 2) ? '목항소계' : '계정소계';
        const it2Idx = s.columns.findIndex(c => c.binding === 'it2nm');
        if (e.col === it2Idx) {
         e.cell.style.color = '#d33'; e.cell.style.fontWeight = '600';
         e.cell.textContent = label;
        }
        const b = s.columns[e.col] && s.columns[e.col].binding;
        if (b === 'dramt' || b === 'cramt') {
         e.cell.style.color = '#d33'; e.cell.style.fontWeight = '600';
        }
       }
      }
     });

     // tab2 행 선택 → tab3·tab4 함께 조회
     _this.itemDetailGrid.selectionChanged.addHandler(function () {
      const item = _this.itemDetailGrid.selectedItems[0];
      if (item) _this.searchDetailByMaster(item);
     });

     // ══════════════════════════════════════
     // tab3 : 상세내역(재원별)
     // 전표일자 / 목 / 재원 / 비고 / 차변 / 대변 / 잔액
     // ══════════════════════════════════════
     _this.detailGrid3 = new wijmo.grid.FlexGrid('#theGrid_detail3', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 2,
      formatItem: (s, e) => { if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center'; },
      columns: [
       {binding: 'yymmdd',  header: '전표일자', width: 100, align: 'center'},
       {binding: 'it2nm',   header: '목',       width: 150, align: 'left'},
       {binding: 'mssecnm', header: '재원',     width: 110, align: 'center'},
       {binding: 'summy',   header: '비고',     width: '*', align: 'left'},

    // 상세 그리드 공통 : PB 행정리 + 98제외 합계 푸터
    bindDetailGrid(grid, rows) {
     rows = rows || [];
     // 차/대변 모두 0인 행 제거 (소계 97/98 유지)
     rows = rows.filter(r => {
      const yy = String(r.yymmdd || '');
      if (yy.endsWith('97') || yy.endsWith('98')) return true;
      const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0;
      return (dr !== 0 || cr !== 0);
     });
     grid.itemsSource = rows;

     const foot = this.calcFooterExcludeSub(rows);
     const cf = grid.columnFooters;
     if (cf.rows.length === 0) cf.rows.push(new wijmo.grid.GroupRow());
     const cSummy = grid.columns.findIndex(c => c.binding === 'summy');
     const cDr = grid.columns.findIndex(c => c.binding === 'dramt');
     const cCr = grid.columns.findIndex(c => c.binding === 'cramt');
     if (cSummy > -1) cf.setCellData(0, cSummy, '합계');
     if (cDr > -1) cf.setCellData(0, cDr, foot.dramt);
     if (cCr > -1) cf.setCellData(0, cCr, foot.cramt);
    }

    // 97/98 소계행 제외 합계
    calcFooterExcludeSub(rows) {
     let dr = 0, cr = 0;
     rows.forEach(r => {
      const yy = String(r.yymmdd || '');
      if (yy.endsWith('97') || yy.endsWith('98')) return;
      dr += Number(r.dramt) || 0;
      cr += Number(r.cramt) || 0;
     });
     return { dramt: dr, cramt: cr };
    }

    // 소계행(97/98) 빨간색 + 라벨 (비고 컬럼에)
    applySubtotalStyle(grid, labelBinding) {
     grid.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType === wijmo.grid.CellType.Cell) {
       const item = s.rows[e.row].dataItem;
       if (!item) return;
       const yy = String(item.yymmdd || '');
       if (yy.endsWith('97') || yy.endsWith('98')) {
        e.cell.style.color = '#d33';
        e.cell.style.fontWeight = '600';
        if (s.columns[e.col] && s.columns[e.col].binding === labelBinding) {
         e.cell.textContent = yy.endsWith('97') ? '월소계' : '계정소계';
        }
        if (s.columns[e.col] && s.columns[e.col].binding === 'yymmdd') {
         e.cell.textContent = '';
        }
       }
      }
     });
    }

    // 상세행 더블클릭 → 전표 팝업 (소계/이월 제외)
    openSlipFromRow(item) {
     const yy = String(item.yymmdd || '');
     if (yy.endsWith('97') || yy.endsWith('98')) return;
     if (!item.spnum || item.spnum === '9999' || item.spnum === '0000') return;
     // 전표일자 : yymmdd가 화면표기(2026-06-10)일 수 있으니 숫자만 추출
     let spdate = String(item.yymmdd || item.spdate || '').replace(/[^0-9]/g, '');
     this.openSlipPopup({ yymmdd: spdate, spnum: item.spnum, acccd: item.acccd || '' });
    }

    fmtDateTime(v) {
     if (!v) return '';
     let s = String(v).trim();
     s = s.replace('T', ' ');
     let m = s.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
     if (m) return m[1];
     let d = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?(\d{2})?/);
     if (d) {
      let out = d[1] + '-' + d[2] + '-' + d[3];
      if (d[4]) out += ' ' + d[4] + ':' + (d[5] || '00') + ':' + (d[6] || '00');
      return out;
     }
     return s.substring(0, 19);
    }

    bindSlipPopup(data) {
     let _this = this;
     const h = data.head || data || {};
     const lines = data.lines || data.details || [];
     const first = lines.length > 0 ? lines[0] : {};

     const setV = (id, v) => {
      const $e = $('#' + id);
      if ($e.length) $e.val(v == null ? '' : v);
     };

     const yymmdd = h.spdate || h.yymmdd || '';
     setV('sp_yymmdd', String(yymmdd).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
     setV('sp_slipno', h.spnum || h.slipno || '');
     setV('sp_tiosecnm', h.tiosecnm || h.tiosec || '');
     setV('sp_inserdt', h.regdate || h.inserdt || '');
     setV('sp_buiscd', h.busipurnm || h.busipur || h.buiscd || '');
     setV('sp_spoccu', h.spoccunm || h.spoccu || '');
     setV('sp_updatedt', _this.fmtDateTime(h.inputdate || h.updatedt));
     setV('sp_title', h.subject || h.title || '');
     setV('sp_busim', h.businm || h.busim || '');
     setV('sp_orgnm', h.spjangnm || h.orgnm || '');
     setV('sp_remark', h.remark || '');
     const $cash = $('#sp_cashyn');
     if ($cash.length) $cash.prop('checked', (h.cashyn === '1' || h.cashyn === 'Y' || h.cashyn === true));

     setV('sp_custnm', first.cltnm || first.custnm || '');
     setV('sp_acctno', first.accnum || first.acctno || '');
     setV('sp_msseccd', first.mssec || first.msseccd || '');
     setV('sp_cardnm', first.cardnm || '');
     setV('sp_mssecnm', first.mssecnm || '');
     setV('sp_acctno2', first.banknm || '');

     if (_this.slipDetailGrid) {
      _this.slipDetailGrid.itemsSource = new wijmo.collections.CollectionView(lines);
     }
    }

    showAccnmPopup(dataList, tabNo) {
     let _this = this;
     if (_this.accnmPopup) { _this.accnmPopup.close(); _this.accnmPopup = null; }
     let content = tmpl('accnmTemplate', {});
     _this.accnmPopup = new PopupDraggable('관 조회');
     _this.accnmPopup.open({width: 700, height: 420, $content: $(content)});

      ],
      itemsSource: new wijmo.collections.CollectionView(dataList)
     });
     _this.accGridPop.keyActionEnter = wijmo.grid.KeyAction.None;

     const sel = function () {
      let s = _this.accGridPop.selection;
      if (!s || s.row < 0) return;
      let item = _this.accGridPop.rows[s.row].dataItem;
      _this.applyAccnmData(item, tabNo);
      _this.accnmPopup.close(); _this.accnmPopup = null; _this.accGridPop = null;
     };
     setTimeout(function () {
      if (_this.accGridPop && _this.accGridPop.rows.length > 0) { _this.accGridPop.select(0, 0); _this.accGridPop.focus(); }
     }, 50);
     _this.accGridPop.hostElement.addEventListener('dblclick', sel);
     _this.accGridPop.hostElement.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sel(); }
     });

    applyAccnmData(item, tabNo) {
     $('#accnm' + tabNo).val(item.accnm || '');
     $('#acccd' + tabNo).val(item.acccd || '');
     // 관 팝업 결과에 tiosec가 있으면 화면 구분 셀렉트도 동기화
     if (item.tiosec != null && String(item.tiosec).trim() !== '') {
      $('#tiosec' + tabNo).val(String(item.tiosec).trim());

     // 관을 바꾸면 하위 항·목 초기화

     let _this = this;
     let keyword = $('#it2nm' + tabNo).val();
     let tiosec = $('#tiosec' + tabNo).val() || '1';   // 화면 구분(세입/세출)
     AjaxUtil.getAsyncData(_this.entry_url + '/findIt2nm', {it2nm: keyword, tiosec: tiosec}, function (res) {
      let list = res.data || [];
      if (!list || list.length === 0) { Alert.alert('', '목 조회 결과가 없습니다.'); return; }
      _this.showIt2Popup(list, tabNo);
     });
    }

    showIt2Popup(dataList, tabNo) {
     let _this = this;
     if (_this.it2Popup) { _this.it2Popup.close(); _this.it2Popup = null; }
     let content = tmpl('it2Template', {});
     _this.it2Popup = new PopupDraggable('목 조회');
     _this.it2Popup.open({width: 700, height: 420, $content: $(content)});

     _this.it2Grid = new wijmo.grid.FlexGrid('#It2Grid', {
      isReadOnly: true, selectionMode: wijmo.grid.SelectionMode.Row,
      headersVisibility: wijmo.grid.HeadersVisibility.Column, autoGenerateColumns: false,
      columns: [
       {binding: 'it2cd', header: '목코드', width: 100, align: 'center'},
       {binding: 'it2nm', header: '목명', width: '*', align: 'left'}
      ],
      itemsSource: new wijmo.collections.CollectionView(dataList)
     });
     _this.it2Grid.keyActionEnter = wijmo.grid.KeyAction.None;

     const sel = function () {
      let s = _this.it2Grid.selection;
      if (!s || s.row < 0) return;
      let item = _this.it2Grid.rows[s.row].dataItem;
      _this.applyIt2Data(item, tabNo);
      _this.it2Popup.close(); _this.it2Popup = null; _this.it2Grid = null;
     };
     setTimeout(function () {
      if (_this.it2Grid && _this.it2Grid.rows.length > 0) { _this.it2Grid.select(0, 0); _this.it2Grid.focus(); }
     }, 50);
     _this.it2Grid.hostElement.addEventListener('dblclick', sel);
     _this.it2Grid.hostElement.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); sel(); }
     });
    }

    applyIt2Data(item, tabNo) {
     $('#it2nm' + tabNo).val(item.it2nm || '');
     $('#it2cd' + tabNo).val(item.it2cd || '');
     if (item.it1cd) $('#it1cd' + tabNo).val(item.it1cd);
     if (item.it1nm) $('#it1nm' + tabNo).val(item.it1nm);
     if (item.acccd) $('#acccd' + tabNo).val(item.acccd);
     if (item.accnm) $('#accnm' + tabNo).val(item.accnm);
     this.searchMainData(tabNo);
    }

    activateTab(no) {
     let $link = $('.tab-links a[href="#tab' + no + '"]');
     if ($link.length) { $link.trigger('click'); return; }
     $('.tab-item').removeClass('active');
     $('#tab' + no).addClass('active');
    }

    searchMainData(tabNo) {
     tabNo = tabNo || 1;
     if (tabNo === 1) this.searchSummary();
     else if (tabNo === 2) this.searchItemDetail();
    }

   }//CategoryItemDetailLedgerPage

   function getActiveTabNo() {
    let $active = $('.tab-item.active');
    if (!$active.length) $active = $('.tab-item:visible').first();
    let id = ($active.attr('id') || 'tab1').replace('tab', '');
    let no = parseInt(id, 10);
    return isNaN(no) ? 1 : no;
   }

   let page = null;

   $(document).ready(function (e) {
    page = new CategoryItemDetailLedgerPage();

    let fr = new Date();
    fr.setDate(1);
    let frStr = CommonUtil.formatYYYYMMDD(fr);
    let toStr = getNowDate();

    for (let i = 1; i <= 4; i++) {
     $('#searchfrdate' + i).val(frStr);
     $('#searchtodate' + i).val(toStr);
     let $sel = $('#mssec' + i);
     if ($sel.length) AjaxUtil.fillSelectOptions($sel, 'mssec', 'all', false);
     $('#btnSearch' + i).on('click', (function (tabNo) {
      return function () { page.searchMainData(tabNo); };
     })(i));

     // 관 엔터 → 관 팝업
     $('#accnm' + i).on('keydown', (function (tabNo) {
      return function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchAccnm(tabNo); } };
     })(i));
     // 관 비우면 하위 항·목 초기화
     $('#accnm' + i).on('input', (function (tabNo) {
      return function () {
       if ($(this).val() === '') {
        $('#acccd' + tabNo).val('');
        $('#it1nm' + tabNo).val(''); $('#it1cd' + tabNo).val('');
        $('#it2nm' + tabNo).val(''); $('#it2cd' + tabNo).val('');
       }
      };
     })(i));

     // 항 엔터 → 항 팝업
     $('#it1nm' + i).on('keydown', (function (tabNo) {
      return function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchIt1nm(tabNo); } };
     })(i));
     // 항 비우면 하위 목 초기화
     $('#it1nm' + i).on('input', (function (tabNo) {
      return function () {
       if ($(this).val() === '') {
        $('#it1cd' + tabNo).val('');
        $('#it2nm' + tabNo).val(''); $('#it2cd' + tabNo).val('');
       }
      };
     })(i));

     // 목 엔터 → 목 팝업
     $('#it2nm' + i).on('keydown', (function (tabNo) {
      return function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); page.searchIt2nm(tabNo); } };
     })(i));
     // 목 비우면 히든 코드 초기화
     $('#it2nm' + i).on('input', (function (tabNo) {
      return function () { if ($(this).val() === '') $('#it2cd' + tabNo).val(''); };
     })(i));
    }

    page.searchMainData(1);

    $(document).on('keydown', function (ev) {
     if (ev.key === 'F4') { ev.preventDefault(); page.searchMainData(getActiveTabNo()); }
    });
   });
  </script>
</th:block>
