<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
<style>
  /* ── tab2 테이블 셀 크기 약 25% 축소 ──
     font-size : % (부모 대비 상대값)
     height/padding/width : em (현재 font-size 기준 상대값)
     ※ th/td의 height는 CSS % 미지원 → em 사용
  ── */
  #tab2 table th,
  #tab2 table td {
    font-size: 90% !important;     /* 부모 font-size 대비 80% (약 20% 축소) */
    height: 2em !important;        /* 80%×15px≈12px → 3×12px=36px */
  }
  #tab2 table.view-table th,
  #tab2 table.view-table td {
    padding: 0.25em 0.67em !important;  /* ≈ 3px 8px */
  }
  #tab2 table.write-table th {
    padding: 0.58em 1.25em !important;  /* ≈ 7px 15px */
  }
  #tab2 table.write-table td {
    padding: 0.33em 0.75em !important;  /* ≈ 4px 9px */
  }
  #tab2 table td input[type="text"],
  #tab2 table td input[type="date"] {
    font-size: 100% !important;    /* td의 80%를 그대로 상속 */
    height: 2.17em !important;     /* ≈ 26px */
    line-height: 2.17em !important;
  }
  #tab2 table td select {
    font-size: 100% !important;
    height: 2.17em !important;     /* ≈ 26px */
    line-height: normal !important;  /* 추가 */
    padding: 0 0.5em !important;     /* 추가: 좌우 여백 + 상하 0으로 중앙 정렬 */
    vertical-align: middle !important; /* 추가 */
    box-sizing: border-box !important; /* 추가 */
  }
  #tab2 table td textarea {
    font-size: 100% !important;
  }
  /* ── 전표번호 변경 버튼 축소 ── */
  #tab2 table .btn.in_btn {
    font-size: 92% !important;     /* ≈ 11px */
    padding: 0.18em 0.67em !important;
    height: 2em !important;        /* ≈ 22~24px */
    line-height: 2em !important;
    white-space: nowrap;
  }

  /* ── 분개 라인 행 추가(+) 버튼 축소 ── */
  #addSlipLine {
    width: 2em !important;         /* ≈ 24px */
    height: 2em !important;
  }
  #addSlipLine img {
    width: 0.83em !important;      /* ≈ 10px */
    height: 0.83em !important;
  }

  /* ── 분개 라인 행 삭제(휴지통) 버튼 축소 ── */
  #slipLineTbody .btn.in_btn.del {
    width: 2em !important;         /* ≈ 24px */
    height: 2em !important;
  }
  #slipLineTbody .btn.in_btn.del img {
    width: 0.83em !important;      /* ≈ 10px */
    height: 0.83em !important;
    margin-left: 0.42em !important; /* ≈ 5px */
  }
  /* ── 행 추가/삭제 버튼 컬럼 정렬 ── */
  #slipLineTable thead th:last-child,
  #slipLineTable tbody td:last-child {
      width: 2.5em !important;
      min-width: 2.5em !important;
      text-align: center !important;
      padding: 0 !important;
      vertical-align: middle !important;
  }

  /* ── 행 추가(+) 버튼 ── */
  #addSlipLine {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 2em !important;
      height: 2em !important;
      margin: 0 auto !important;
  }

  /* ── 행 삭제(휴지통) 버튼 ── */
  #slipLineTbody .btn.in_btn.del {
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      width: 2em !important;
      height: 2em !important;
      margin: 0 auto !important;
  }
</style>

  <!-- 전표 출력 미리보기 팝업 템플릿 -->
  <script id="printSelectTemplate" type="text/x-tmpl">
    <div class="content_wrap popup" style="display:flex;flex-direction:column;height:100%;">
      <section class="section" style="display:flex;flex-direction:column;height:100%;padding:0;">

        <!-- 상단 컨트롤 바 -->
        <div style="display:flex;align-items:center;gap:10px;padding:10px 14px;
                    border-bottom:1px solid #e5e7eb;flex-shrink:0;">
          <label style="font-size:13px;font-weight:600;white-space:nowrap;">출력 양식</label>
          <select id="ppPrintType"
            style="padding:-41px 10px;border:1px solid #ddd;border-radius:4px;font-size:13px;">
            <option value="1">전표(산출내역)</option>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/ax5_uploader :: ax5_uploader"></th:block>
  <th:block th:replace="common/popup_company.html :: popup_company"></th:block>
  <th:block th:replace="common/popup_account :: popup_account" />

  <script type="text/javascript">
   class SlipStatusPage {
    constructor() {
     this.url = '/api/account_management/slip_status';
     this.entry_url = '/api/account_management/slip_entry'
     this.grid = null;
     this.viewData = new wijmo.collections.CollectionView();
     this.uploader = null;
     this.currentSlipId = null;
     this.lineIndex = 0;
     this.mssecOptions = null;
     this.init();
    }

    init() {
     let _this = this;
     _this.initDrcrControl();

     this.addSlipLine('1');  // 차변
     this.addSlipLine('2');

     _this.grid = new wijmo.grid.FlexGrid('#theGrid_slip_list', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Cell,
      isReadOnly: false,
      imeEnabled: true,
      frozenColumns: 2,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) {
        e.cell.style.textAlign = 'center';
       }
       if (e.panel.cellType === wijmo.grid.CellType.Cell) {
        const col = s.columns[e.col];
        if (col.binding === 'tiosec') {
         const val = e.cell.textContent.trim();
         if (val === '세입') {
          e.cell.style.color = 'red';
         } else if (val === '세출') {
          e.cell.style.color = 'black';
         } else if (val === '대체') {
          e.cell.style.color = 'green';
         } else {
          e.cell.style.color = '';  // 초기화
         }
        } else {
         e.cell.style.color = '';  // 다른 컬럼 초기화
        }
       }
      },
      columns: [
       {
        binding: 'selected',
        header: '인쇄',
        width: 50,
        align: 'center',
        dataType: wijmo.DataType.Boolean,
        isReadOnly: false   // 체크박스만 편집 가능
       },
       {binding: 'setnum', header: '관리번호', width: 100, align: 'center', visible: false, isReadOnly: true},
       {binding: 'spdate', header: '전표일자', width: 100, align: 'center', isReadOnly: true},
       {binding: 'spnum', header: '전표번호', width: 80, align: 'center', isReadOnly: true},
       {binding: 'tiosec', header: '구분', width: 100, align: 'center', isReadOnly: true},
       {binding: 'amt', header: '금액', width: 150, align: 'right', format: 'n0', isReadOnly: true},
       {binding: 'it2nm', header: '목', width: 120, align: 'center', isReadOnly: true},
       {binding: 'subject', header: '제목', width: 300, align: 'left', isReadOnly: true},
       {binding: 'businm', header: '사업명', width: 250, align: 'left', isReadOnly: true},
       {binding: 'buiscd_cnt', header: '회차', width: 100, align: 'center', isReadOnly: true},
       {binding: 'fixflag', header: '확정', width: 80, align: 'center', isReadOnly: true},
       {binding: 'mssec', header: '재원', width: 100, align: 'center', isReadOnly: true},
       {binding: 'appgubun', header: '결재상태', width: 100, align: 'center', isReadOnly: true},
       {binding: 'apppernm', header: '작성자', width: 100, align: 'center', isReadOnly: true},
       {binding: 'spoccu', header: '증빙구분', width: 100, align: 'center', isReadOnly: true},
       {binding: 'banknm', header: '은행', width: 200, align: 'center', isReadOnly: true},
       {binding: 'cltnm', header: '거래처', width: 150, align: 'center', isReadOnly: true},
       {binding: 'cardnm', header: '카드', width: 150, align: 'center', isReadOnly: true},
      ],
      itemsSource: this.viewData,
     });
     new FlexGridContextMenu(this.grid);
     _this.grid.downloadFileName = '전표내역';

     // footer 합계행 추가
     _this.grid.columnFooters.rows.push(new wijmo.grid.GroupRow());

     // '일자' 컬럼 위치에 합계 표시
     const apvDtColIndex = _this.grid.columns.findIndex(c => c.binding === 'spdate');
     if (apvDtColIndex > -1) {
      _this.grid.columnFooters.setCellData(0, apvDtColIndex, '합계');
     }

     // 금액 컬럼 aggregate 지정
     const buySumCol = _this.grid.columns.getColumn('amt');
     if (buySumCol) {
      buySumCol.aggregate = wijmo.Aggregate.Sum;
     }

     // ── 그리드 더블클릭 → 전표 등록 탭으로 이동 + 데이터 바인딩 ──
     _this.grid.hostElement.addEventListener('dblclick', function () {
      const items = _this.grid.selectedItems;
      if (!items || items.length === 0) return;

      const selected = items[0];

      // 탭2(전표 등록)로 전환
      $('a[href="#tab2"]').trigger('click');

      // 탭 전환 후 데이터 바인딩
      setTimeout(() => {
       _this.bindToTab2Form(selected);
      }, 100);
     });

     //===전표등록 ==

     //-- 행 추가 --
     $('#addSlipLine').on('click', () => {
      this.addSlipLine();
     });

     // ── 행 삭제 ──
     $('#slipLineTbody').on('click', 'a[title="행 삭제"]', function () {
      const $tbody = $('#slipLineTbody');
      const $rows = $tbody.find('tr:not(.slip-line-template)');
      const $targetRow = $(this).closest('tr');

      if ($rows.length <= 2) {
       $targetRow.find('input[type="text"]:not([readonly])').val('');
       $targetRow.find('input[type="hidden"]').val('');
       $targetRow.find('input[name="dramt"]').val('0');
       $targetRow.find('input[name="cramt"]').val('0');
      } else {
       $targetRow.remove();
      }
      _this.calcSum();
     });

     // ── 합계 계산 ──
     $('#slipLineTbody').on('input', 'input[name="dramt"], input[name="cramt"]', function () {
      _this.calcSum();
     });


    }//init

    searchMainData() {
     let _this = this;
     let url = this.url + '/read';
     let start = $('#searchfrdate').val();
     let end = $('#searchtodate').val();

     let data = {
      'start': start,
      'end': end,
      mssec: $('#mssec').val(),
      sbuject: $('#search_sbuject').val(),
     };
     let fnsuccess = function (result) {
      if (result != null && result.success) {
       _this.viewData.sourceCollection = result.data;
      } else {
       console.log('전표입력현황 read 오류');
      }
     }

     AjaxUtil.getAsyncData(url, data, fnsuccess);
    }

    // 전표 출력 팝업 열기
    showPrintSelectPopup() {
     let _this = this;
     // html2pdf.js 동적 로드
     if (!document.getElementById('html2pdf-script')) {
      const script = document.createElement('script');
      script.id = 'html2pdf-script';
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
      document.head.appendChild(script);
     }

     const existing = document.getElementById('slip-print-overlay');
     if (existing) existing.remove();

     const selectedItems = _this.viewData.sourceCollection.filter(r => r.selected);
     const keys = selectedItems.map(r => r.spdate.replace(/-/g, '') + r.spnum).join(',');
     // console.log('keys:', keys);

     fetch(withCtx(`/api/account_management/slip_status/print?printType=1&keys=${encodeURIComponent(keys)}`))
     .then(r => r.json())
     .then(d => {
      // console.log('전체:', d);
      // console.log('전표 수:', d.data?.length);
      if (d.data?.length > 0) {
       console.log('첫번째 전표:', d.data[0]);
       // console.log('차변:', d.data[0].debit);
       // console.log('대변:', d.data[0].credit);
       // console.log('amt:', d.data[0].amt);
      }
     });

     // ── 스타일 ──
     const css = `
        #slip-print-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.5);
            z-index:10000; display:flex; align-items:center; justify-content:center;
        }
        #slip-print-popup {
            width:88vw; max-width:1100px; height:88vh;
            background:#fff; border-radius:12px;
            box-shadow:0 24px 48px rgba(0,0,0,.2);
            display:flex; flex-direction:column; overflow:hidden;
        }
        #slip-print-popup .sp-head {
            display:flex; align-items:center; justify-content:space-between;
            padding:14px 20px; border-bottom:1px solid #e5e7eb; flex-shrink:0;
        }
        #slip-print-popup .sp-body { flex:1; overflow:hidden; }
        #slip-print-popup .sp-body iframe { width:100%; height:100%; border:none; }
    `;
     let styleEl = document.getElementById('slip-print-style');
     if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'slip-print-style';
      document.head.appendChild(styleEl);
     }
     styleEl.textContent = css;

     // ── 팝업 HTML ──
     // 인쇄/다운로드 버튼 없음 → 브라우저 PDF toolbar가 자동으로 제공
     const overlay = document.createElement('div');
     overlay.id = 'slip-print-overlay';

     const popup = document.createElement('div');
     popup.id = 'slip-print-popup';
     popup.innerHTML = `
        <div class="sp-head">
            <span style="font-size:18px;font-weight:700;color:#111;">전표 출력 미리보기</span>
            <div style="display:flex;gap:8px;align-items:center;">
                <select id="spPrintType"
                    style="padding:-1px 10px;border:1px solid #ddd;border-radius:4px;">
                    <option value="1">전표(산출내역)</option>
                    <option value="2">결의양식1</option>
                    <option value="3">결의양식2(하단)</option>
                    <option value="4">결의양식2(상단)</option>
                    <option value="5">결의양식3(세입세출)</option>
                    <option value="6">결의양식3(대체)</option>
                    <option value="7">전표(산출내역):하단결재</option>
                </select>
                <button id="spPrintBtn"
                style="padding:6px 18px;background:#1a56db;color:#fff;
                       border:none;border-radius:4px;font-size:13px;
                       font-weight:700;cursor:pointer;">
                인쇄
            </button>
            <button id="spDownloadBtn"
                style="padding:6px 18px;background:#059669;color:#fff;
                       border:none;border-radius:4px;font-size:13px;
                       font-weight:700;cursor:pointer;">
                PDF 저장
            </button>

            <button id="spCloseBtn"
                style="background:none;border:none;font-size:20px;
                       color:#9ca3af;cursor:pointer;line-height:1;padding:4px;">✕
            </button>
            </div>
        </div>
        <!-- ↓ PDF iframe → 브라우저가 toolbar(인쇄/다운로드) 자동 제공 -->
        <div class="sp-body">
            <iframe id="spIframe" style="width:100%;height:100%;border:none;"></iframe>
        </div>
    `;

     overlay.appendChild(popup);
     document.body.appendChild(overlay);

     // ── iframe에 PDF URL 세팅 ──
     function renderPreview(printType) {
      // printType=1, keys=20260420-0761,... 형태로 요청
      const url = `${_this.url}/print?printType=${printType}&keys=${encodeURIComponent(keys)}`;
      document.getElementById('spIframe').src = withCtx(url);
     }

     renderPreview(document.getElementById('spPrintType').value);

     document.getElementById('spPrintType').addEventListener('change', function () {
      renderPreview(this.value);
     });

     document.getElementById('spCloseBtn').addEventListener('click', function () {
      overlay.remove();
     });

     document.getElementById('spDownloadBtn').addEventListener('click', function () {
      const printType = document.getElementById('spPrintType').value;
      const url = withCtx(`${_this.url}/print/pdf?printType=${printType}&keys=${encodeURIComponent(keys)}`);

      // 링크 클릭으로 다운로드
      const a = document.createElement('a');
      a.href = url;
      a.download = '';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
     });

     // 기존 이벤트들 아래에 추가
     document.getElementById('spPrintBtn').addEventListener('click', function () {
      const iframe = document.getElementById('spIframe');
      iframe.contentWindow.focus();
      iframe.contentWindow.print();
     });

     overlay.addEventListener('click', function (e) {
      if (e.target === overlay) overlay.remove();
     });
    }

    //==== 전표 등록 ====

    // ── 더블클릭 선택 데이터 → 전표 등록 탭 바인딩 ──
    bindToTab2Form(item) {
     let _this = this;

     // 폼 초기화 후 바인딩
     _this.resetForm();

     // 헤더 키값 저장 (수정 모드 구분용)
     _this.currentSlipId = item.spnum;

     // 헤더 필드 바인딩
     $('#spdate').val(item.spdate);
     $('#spnum').val(item.spnum);

     // 입출구분 (1:세입, 2:세출, 3:대체)
     const tiosecMap = { '세입': '1', '세출': '2', '대체': '3' };
     $('#tiosec').val(tiosecMap[item.tiosec] || '');

     $('#readate').val(item.readate || getNowDate());
     $('#subject').val(item.subject || '');
     $('#remark').val(item.remark || '');
     $('#busicd').val(item.busicd || '');
     $('#businame').val(item.businm || '');
     $('#bsdate').val(item.bsdate || '');
     $('#bseccd').val(item.bseccd || '');
     $('#inputdate').val(item.inputdate || '');
     $('#cashyn').prop('checked', item.cashyn === '1' || item.cashyn === true);

     // 헤더 상세(inputdate 등) + 라인 동시 조회
     _this.fetchSlipHeader(item.spdate, item.spnum);
     _this.fetchSlipLines(item.spdate, item.spnum);
    }

    // ── 헤더 상세 조회 (inputdate 등 별도 API) ──
    fetchSlipHeader(spdate, spnum) {
     let _this = this;
     const spdateFmt = (spdate || '').replace(/-/g, '');

     AjaxUtil.getAsyncData(
      _this.entry_url + '/getHeader',   // ← 새로 만들 API
      { spdate: spdateFmt, spnum: spnum },
      function (res) {
       if (!res || !res.success || !res.data) return;
       $('#inputdate').val(res.data.inputdate || '');
      }
     );
    }

    // ── 분개 라인 서버 조회 후 바인딩 ──
    fetchSlipLines(spdate, spnum) {
     let _this = this;
     const spdateFmt = (spdate || '').replace(/-/g, '');
     AjaxUtil.getAsyncData(
      _this.entry_url + '/getLines',
      { spdate: spdateFmt, spnum: spnum },
      function (res) {
       if (!res || !res.success || !res.data || res.data.length === 0) return;

       $('#slipLineTbody tr:not(.slip-line-template)').remove();
       _this.lineIndex = 0;

       res.data.forEach(function (line) {
        _this.addSlipLine(line.drcr || '1');

        const $row = $('#slipLineTbody tr:not(.slip-line-template)').filter(':not([data-detail-idx])').last();
        const idx  = $row.attr('data-line-idx');

        $row.find('input[name^="spseq"]').val(line.spseq || '');
        $row.find('input[name^="acccd"]').val(line.acccd || '');
        $row.find('input[name^="accnm"]').val(line.accnm || '');
        $row.find('select[name^="drcr"]').val(line.drcr || '1');
        $row.find('input[name^="it1cd"]').val(line.it1cd || '');
        $row.find('input[name^="it1nm"]').val(line.it1nm || '');
        $row.find('input[name^="it2cd"]').val(line.it2cd || '');
        $row.find('input[name^="it2nm"]').val(line.it2nm || '');
        $row.find('input[name^="summy"]').val(line.summy || '');
        $row.find('input[name^="msseccd"]').val(line.mssec || line.msseccd || '');
        $row.find('input[name^="mssecnm"]').val(line.mssecnm || '');

        // ── applyDrcrRule 먼저: readonly 상태 결정 ──
        _this.applyDrcrRule($row);

        // ── 금액은 applyDrcrRule 이후에 바인딩 (val('') 초기화 방지) ──
        const drFmt = line.dramt ? Number(line.dramt).toLocaleString() : '0';
        const crFmt = line.cramt ? Number(line.cramt).toLocaleString() : '0';
        $row.find('input[name^="dramt"]').val(drFmt);
        $row.find('input[name^="cramt"]').val(crFmt);

        // ── 상세행 표시 여부 ──
        const accnmClean = (line.accnm || '').replace(/\s/g, '');
        const hasValue   = line.cltnm || line.cardnum  || line.accnum || line.banknm;
        const isOpen     = accnmClean.includes('보통예금') || !!hasValue;

        const $detailRow = $(`tr[data-detail-idx="${idx}"]`);
        $detailRow[0].style.display = isOpen ? '' : 'none';

        if (isOpen) {
         $detailRow.find('input[name^="cltnm"]').val(line.cltnm  || '');
         $detailRow.find('input[name^="cltcd"]').val(line.cltcd  || '');
         $detailRow.find('input[name^="cardnm"]').val(line.cardnum || '');
         $detailRow.find('input[name^="cardcd"]').val(line.cardcd || '');
         $detailRow.find('input[name^="banknm"]').val(line.accnum || '');
         $detailRow.find('input[name^="bankcd"]').val(line.bankcd || '');
        }
       });

       // ── 전체 바인딩 완료 후 합계 갱신 ──
       _this.calcSum();
       // console.log('calcSum 호출됨');
       // console.log($('#sum_dramt').val());
      }
     );
    }

    // 행 추가 공통 함수
    addSlipLine(drcrVal = '1') {
     const $tbody = $('#slipLineTbody');
     const $template    = $tbody.find('.slip-line-template').not('.slip-detail-template').first();
     const $detailTmpl  = $tbody.find('.slip-detail-template').first();

     const $newRow    = $template.clone().removeClass('slip-line-template').show();
     const $detailRow = $detailTmpl.clone().removeClass('slip-line-template slip-detail-template');
     // 상세 행은 기본 숨김
     $detailRow.hide();
     // 상세 행과 메인 행 연결용 data 속성
     const idx = this.lineIndex;
     $newRow.attr('data-line-idx', idx);
     $detailRow.attr('data-detail-idx', idx);

     // name에 index 부여
     $newRow.find('input, select').each(function () {
      const baseName = $(this).attr('name');
      if (baseName) $(this).attr('name', `${baseName}_${idx}`);
     });
     $detailRow.find('input').each(function () {
      const baseName = $(this).attr('name');
      if (baseName) $(this).attr('name', `${baseName}_${idx}`);
     });

     $newRow.find('select[name^="drcr"]').val(drcrVal);
     $newRow.find('input[type="text"]:not([readonly])').val('');
     $newRow.find('input[type="hidden"]').val('');
     $newRow.find('input[name^="dramt"]').val('0');
     $newRow.find('input[name^="cramt"]').val('0');

     $tbody.append($newRow);
     $tbody.append($detailRow);  // 메인 행 바로 아래에 추가
     // ── 핸들러 바인딩 ──
     this.bindDetailHandlers($detailRow, idx);

     this.applyDrcrRule($newRow);
     this.lineIndex++;
    }

    bindDetailHandlers($detailRow, idx) {
     let _this = this;

     // ── 거래처 ──
     const $cltInput  = $detailRow.find('input.btn-clt-search');
     const $cltHidden = $detailRow.find('input[name^="cltcd"]');
     const $cltFlag   = $detailRow.find('input[name^="cltflag"]');

     const cltInputId  = `clt_nm_${idx}`;
     const cltHiddenId = `clt_cd_${idx}`;
     const cltFlagId   = `clt_flag_${idx}`;

     $cltInput.attr('id', cltInputId);
     $cltHidden.attr('id', cltHiddenId);
     $cltFlag.attr('id', cltFlagId);

     $cltInput.off('keydown').on('keydown', function(e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();

      const keyword = $cltInput.val();   // ← 입력한 검색어

      const poppage = new PopCompComponent();
      poppage.show(function(item) {
       $cltInput.val(item.compname || '');
       $cltHidden.val(item.compcode || '');
       $cltFlag.val(item.cltflag || '');
       setTimeout(() => {
        $detailRow.find('input[name^="cardnm"]').focus().select();
       }, 200);
      }, keyword);   // ← 두 번째 인자로 검색어 전달
     });

     // ── 재원 keydown 핸들러 제거 ──
     // (재원은 이제 메인행 focusOrder에서 처리)

     // ── 카드 ──
     const $cardInput  = $detailRow.find('input.btn-card-search');
     const $cardHidden = $detailRow.find('input[name^="cardcd"]');
     const cardInputId  = `card_nm_${idx}`;
     const cardHiddenId = `card_cd_${idx}`;
     $cardInput.attr('id', cardInputId);
     $cardHidden.attr('id', cardHiddenId);

     $cardInput.off('keydown').off('input');
     CardInputHandler.bind({
      cardnumSelector: `#${cardInputId}`,
      cardnmSelector:  `#${cardInputId}`,
      cardidSelector:  `#${cardHiddenId}`,
      minLength: 0,
      onComplete: function(item) {
       if (item) {
        $cardInput.val(item.cardnum || item.cardnm || '');
        $cardHidden.val(item.cardid || '');
       }
       _this.focusAfterCard($detailRow, idx);
      }
     });

     // ── 계좌 ──
     const $bankInput  = $detailRow.find('input.btn-bank-search');
     const $bankHidden = $detailRow.find('input[name^="bankcd"]');
     const bankInputId  = `bank_nm_${idx}`;
     const bankHiddenId = `bank_cd_${idx}`;
     $bankInput.attr('id', bankInputId);
     $bankHidden.attr('id', bankHiddenId);

     AccountInputHandler.bind({
      accnumSelector: `#${bankInputId}`,
      bankidSelector:  `#${bankHiddenId}`,
      minLength: 0,
      onSelect: function() {
       _this.focusNextAfterDetail($detailRow);
      }
     });
    }

    // 카드 선택 후 → acnflag 판단
    focusAfterCard($detailRow, idx) {
     const $mainRow = $(`tr[data-line-idx="${idx}"]`);
     const acnflag  = $mainRow.find('input[name^="acnflag"]').val();

     if (acnflag === '1') {
      setTimeout(() => $detailRow.find('input[name^="banknm"]').focus().select(), 50);
     } else {
      this.focusNextAfterDetail($detailRow);
     }
    }

// 상세행 완료 후 → 다음 메인행 관명으로
    focusNextAfterDetail($detailRow) {
     const idx      = $detailRow.attr('data-detail-idx');
     const $mainRow = $(`tr[data-line-idx="${idx}"]`);
     const $nextRow = $mainRow.nextAll('tr[data-line-idx]:visible').first();

     if ($nextRow.length) {
      setTimeout(() => $nextRow.find('input[name^="accnm"]').focus().select(), 50);
     } else {
      $('#addSlipLine').trigger('click');
      setTimeout(() => {
       const $newRow = $('#slipLineTbody tr[data-line-idx]:last');
       $newRow.find('input[name^="accnm"]').focus().select();
      }, 80);
     }
    }

    calcSum() {
     let totalDr = 0;
     let totalCr = 0;

     $('#slipLineTbody tr[data-line-idx]').each(function () {
      const drVal = $(this).find('input[name^="dramt"]').val();
      const crVal = $(this).find('input[name^="cramt"]').val();

      totalDr += parseFloat((drVal || '0').replace(/,/g, '')) || 0;
      totalCr += parseFloat((crVal || '0').replace(/,/g, '')) || 0;
     });

     const diff = totalDr - totalCr;

     $('#sum_dramt').val(totalDr.toLocaleString());
     $('#sum_cramt').val(totalCr.toLocaleString());
     $('#sum_diff').val(diff.toLocaleString());

     // 차액 색상: 0 → 초록, 불일치 → 빨강
     $('#sum_diff').css('color', diff === 0 ? '#198754' : '#dc3545');
    }

    applyDrcrRule($row) {
     const val = $row.find('select[name^="drcr"]').val();
     const $dramt = $row.find('input[name^="dramt"]');
     const $cramt = $row.find('input[name^="cramt"]');

     if (val === '1') {
      $dramt.prop('readonly', false).css({ background: '', color: '', paddingRight: '30px' });
      $cramt.prop('readonly', true).val('').css({ background: '#f5f5f5', color: '#aaa', paddingRight: '30px' });
     } else {
      $cramt.prop('readonly', false).css({ background: '', color: '', paddingRight: '30px' });
      $dramt.prop('readonly', true).val('').css({ background: '#f5f5f5', color: '#aaa', paddingRight: '30px' });
     }
    }

    initDrcrControl() {
     let _this = this;

     // 초기 행 적용
     $('#slipLineTbody tr:not(.slip-line-template)').each(function () {
      _this.applyDrcrRule($(this));
     });

     // select 변경 시
     $('#slipLineTbody').on('change', 'select[name^="drcr"]', function () {
      _this.applyDrcrRule($(this).closest('tr'));
     });

     // 숫자만 + 자동 포맷 (keyup)
     $('#slipLineTbody').on('keyup', 'input[name^="dramt"], input[name^="cramt"]', function () {
      _this.formatNumberInput($(this).val(), this);
     });

     // 포커스 아웃 시 합계 계산
     $('#slipLineTbody').on('blur', 'input[name^="dramt"], input[name^="cramt"]', function () {
      _this.calcSum();
     });

     // 포커스 인 시 포맷 제거
     $('#slipLineTbody').on('focus', 'input[name^="dramt"], input[name^="cramt"]', function () {
      const raw = $(this).val().replace(/,/g, '');
      $(this).val(raw === '0' ? '' : raw);
     });

     // ── 엔터키 포커스 이동 ──
     const focusOrder = [
      'input[name^="accnm"]',       // 관명(계정) - 엔터 시 팝업 열림
      'select[name^="drcr"]',       // 차대
      'input[name^="it1nm"]',       // 항 - 엔터 시 팝업 열림
      'input[name^="it2nm"]',       // 목 - 엔터 시 팝업 열림
      'input[name^="summy"]',       // 산출내역
      'input[name^="mssecnm"]',     // 재원
      'input[name^="dramt"]',       // 차변금액
      'input[name^="cramt"]',       // 대변금액
     ];

     $('#slipLineTbody').on('keydown', 'input, select', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();

      const $current = $(this);
      const $row = $current.closest('tr');
      const currentSelector = focusOrder.find(sel => $current.is(sel));
      if (!currentSelector) return;

      const currentIdx = focusOrder.indexOf(currentSelector);

      // 팝업 필드는 팝업에서 선택 후 포커스 이동하므로 여기서 처리 안 함
      const popupFields = ['input[name^="accnm"]', 'input[name^="it1nm"]', 'input[name^="it2nm"]','input[name^="mssecnm"]',];
      if (popupFields.includes(currentSelector)) return;

      // 다음 칸으로 이동 (readonly인 금액 칸은 건너뜀)
      if (currentIdx < focusOrder.length - 1) {
       const $next = $row.find(focusOrder[currentIdx + 1]);
       if ($next.length && !$next.prop('readonly')) {
        $next.focus();
        if ($next.is('input')) $next.select();
        return;
       }
       // readonly면 그 다음 칸도 확인
       if (currentIdx + 2 < focusOrder.length) {
        const $nextNext = $row.find(focusOrder[currentIdx + 2]);
        if ($nextNext.length && !$nextNext.prop('readonly')) {
         $nextNext.focus();
         if ($nextNext.is('input')) $nextNext.select();
         return;
        }
       }
      }

    // 마지막 활성 금액 칸(dramt 또는 cramt)에서 엔터
    // → 상세행(토글)이 열려있으면 거래처로, 아니면 다음행으로
      const lineIdx   = $row.attr('data-line-idx');
      const $detailRow = $(`tr[data-detail-idx="${lineIdx}"]`);
      const isDetailOpen = $detailRow.length && $detailRow.is(':visible');

      if (isDetailOpen) {
       $detailRow.find('input[name^="cltnm"]').focus().select();
      } else {
       const $nextRow = $row.nextAll('tr[data-line-idx]:visible').first();
       if ($nextRow.length) {
        $nextRow.find(focusOrder[0]).focus().select();
       } else {
        $('#addSlipLine').trigger('click');
        setTimeout(() => {
         const $newRow = $('#slipLineTbody tr[data-line-idx]:last');
         $newRow.find(focusOrder[0]).focus().select();
        }, 50);
       }
      }
     });

    }//initDrcrControl

    resetForm() {
     document.getElementById('CategoryForm').reset();
     $('#slipLineTbody tr:not(.slip-line-template)').remove();

     this.lineIndex = 0;      // ← 리셋
     this.addSlipLine('1');   // 차변
     this.addSlipLine('2');   // 대변

     this.calcSum();
     this.currentSlipId = null;
     $('#spdate').val(getNowDate());
    }

    //전표 저장
    saveSlip() {
     let _this = this;

     // ── 1. 헤더 데이터 수집 ──
     const spdate   = $('#spdate').val();
     const spnum    = $('#spnum').val();
     const tiosec   = $('#tiosec').val();
     const busipur  = $('#busipur').val();
     const spoccu   = $('#spoccu').val();
     const cashyn   = $('#cashyn').is(':checked') ? '1' : '0';
     const subject  = $('#subject').val();
     const remark   = $('#remark').val();
     const busicd   = $('#busicd').val();
     const businame = $('#businame').val();
     const bsdate   = $('#bsdate').val();
     const bseccd   = $('#bseccd').val();

     // ── 2. 헤더 유효성 검사 ──
     if (!spdate) {
      Alert.alert('', '전표일자를 입력하세요.');
      $('#spdate').focus();
      return;
     }
     if (!tiosec) {
      Alert.alert('', '입출구분을 선택하세요.');
      $('#tiosec').focus();
      return;
     }
     if (!subject) {
      Alert.alert('', '제목을 입력하세요.');
      $('#subject').focus();
      return;
     }

     // ── 3. 분개 라인 수집 ──
     const lines = [];
     let lineValid = true;

     $('#slipLineTbody tr[data-line-idx]').each(function (i) {
      const $row   = $(this);
      const lineIdx = $row.attr('data-line-idx');
      const $detailRow = $(`tr[data-detail-idx="${lineIdx}"]`);

      const spseq = $row.find('input[name^="spseq"]').val();
      const acccd  = $row.find('input[name^="acccd"]').val();
      const accnm  = $row.find('input[name^="accnm"]').val();
      const drcr   = $row.find('select[name^="drcr"]').val();
      const it1cd  = $row.find('input[name^="it1cd"]').val();
      const it1nm  = $row.find('input[name^="it1nm"]').val();
      const it2cd  = $row.find('input[name^="it2cd"]').val();
      const it2nm  = $row.find('input[name^="it2nm"]').val();
      const summy  = $row.find('input[name^="summy"]').val();
      const msseccd = $row.find('input[name^="msseccd"]').val();
      const mssecnm = $row.find('input[name^="mssecnm"]').val();
      const dramt  = parseFloat($row.find('input[name^="dramt"]').val().replace(/,/g, '')) || 0;
      const cramt  = parseFloat($row.find('input[name^="cramt"]').val().replace(/,/g, '')) || 0;

      // ── 상세행 (코드/번호 기준) ──
      const cltcd   = $detailRow.find('input[name^="cltcd"]').val()  || '';   // 거래처: 코드
      const cardnum = $detailRow.find('input[name^="cardnm"]').val() || '';   // 카드: 번호
      const bankcd  = $detailRow.find('input[name^="bankcd"]').val() || '';   // 계좌: 코드


      // ── 빈 행 스킵: 관명도 없고 금액도 0이면 입력 안 한 행 ──
      const isEmptyRow = !acccd && dramt === 0 && cramt === 0;
      if (isEmptyRow) {
       return true; // continue (검증·push 건너뜀)
      }

      // 여기부터는 "내용이 있는 행"만 옴 → 검증
      if (!acccd) {
       Alert.alert('', `${i + 1}번째 행의 관명(계정)을 입력하세요.`);
       $row.find('input[name^="accnm"]').focus();
       lineValid = false;
       return false;
      }
      if (dramt === 0 && cramt === 0) {
       Alert.alert('', `${i + 1}번째 행의 금액을 입력하세요.`);
       lineValid = false;
       return false;
      }

      lines.push({ spseq, acccd, accnm, drcr, it1cd, it1nm, it2cd, it2nm,
       summy, dramt, cramt, msseccd, mssecnm, lineSeq: i + 1,
       cltcd, cardnum, bankcd  });
     });

     if (!lineValid) return;

     if (lines.length === 0) {
      Alert.alert('', '분개 라인을 1건 이상 입력하세요.');
      return;
     }

     // ── 4. 차변/대변 합계 일치 검사 ──
     const totalDr = lines.reduce((s, l) => s + l.dramt, 0);
     const totalCr = lines.reduce((s, l) => s + l.cramt, 0);

     if (totalDr !== totalCr) {
      Alert.alert('', `차변 합계(${totalDr.toLocaleString()})와 대변 합계(${totalCr.toLocaleString()})가 일치하지 않습니다.`);
      return;
     }

     // ── 5. 전송 데이터 구성 ──
     const payload = {
      spdate, spnum, tiosec, busipur, spoccu,
      cashyn, subject, remark,
      busicd, businame, bsdate, bseccd,
      //분개라인
      lines
     };

     // ── 6. API 호출 ──
     const url = _this.entry_url + '/save';

     AjaxUtil.postJsonData(url, payload, function (result) {
      if (result && result.success) {
       Alert.alert('', '저장되었습니다.', function () {
        // 저장 후 전표번호 세팅 (신규 시 서버에서 채번)
        if (result.data?.spnum) {
         $('#spnum').val(result.data.spnum);
         _this.currentSlipId = result.data.spnum;
        }
        // 초기화 + 목록 새로고침
        _this.resetForm();
        _this.searchMainData();
       });
      } else {
       const msg = result?.message || '저장 중 오류가 발생했습니다.';
       Alert.alert('', msg);
      }
     });

    } // saveSlip

    DeleteSlip() {
     let _this = this;

     const spdate = $('#spdate').val();
     const spnum  = $('#spnum').val();

     // console.log('1. DeleteSlip 진입', spdate, spnum);

     // 신규 작성 중이면 삭제 대상 없음
     if (!spnum) {
      Alert.alert('', '삭제할 전표가 없습니다. 먼저 전표를 선택하세요.');
      return;
     }
     // console.log('2. spnum 통과');

     // 삭제 확인
     Alert.confirm('', '선택한 전표를 삭제하시겠습니까?', function () {
      // console.log('3. confirm 확인 클릭');

      const payload = { spdate, spnum };
      const url = _this.entry_url + '/delete';
      // console.log('4. 요청 직전', url, payload);

      AjaxUtil.postJsonData(url, payload, function (result) {
       // console.log('5. 응답 도착', result);
       if (result && result.success) {
        Alert.alert('', '삭제되었습니다.', function () {
         _this.resetForm();        // 폼 초기화
         _this.searchMainData();   // 목록 새로고침
        });
       } else {
        const msg = result?.message || '삭제 중 오류가 발생했습니다.';
        Alert.alert('', msg);
       }
      });
      // console.log('6. 요청 호출 끝');
     });

    }//DeleteSlip

   }//SlipStatusPage

   // ── 금액 입력 시 합계 갱신 ──
   $('#slipLineTbody').on('input', 'input[name="dramt"], input[name="cramt"]', function () {

// ── 분개 라인 항/목 엔터 → 팝업 ──
    $('#slipLineTbody').on('keydown', 'input.btn-it1-search', function (e) {

    $('#slipLineTbody').on('keydown', 'input.btn-it2-search', function (e) {
     if (e.key === 'Enter') {

      let $row = $(this).closest('tr');
      page.searchIt2nm($row);
     }
    });

    $('#slipLineTbody').on('keydown', 'input[name^="accnm"]', function (e) {
     if (e.key === 'Enter') {
      e.preventDefault();
      let $row = $(this).closest('tr');
      page.searchAccnm($row);
     }
    });
   //재원
    $('#slipLineTbody').on('keydown', 'input[name^="mssecnm"]', function(e) {
     if (e.key !== 'Enter') return;
     e.preventDefault();
     let $row = $(this).closest('tr');

    // 저장 버튼
    $('#btnSave').on('click', function () {
