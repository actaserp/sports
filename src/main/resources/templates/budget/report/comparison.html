<!--
  결산서및예산안대조표 — PowerBuilder w_tb_aa009_sh16 이식. 2026-11-11
  * 년도(결산 연도) 입력 → 예산 연도 = 년도 + 1
  * 좌: 세입(과목 · 결산금액 · 예산금액 · 증감액) / 우: 세출(같은 구성)
  * 아래: 합계 → 전기이월금 · 차기이월금 → 총 계 (전기이월 자료가 있을 때만)
  * 증감액 = 결산금액 - 예산금액 (원본 d_tb_aa009_sh16_4 식 그대로)
  * 조회 후 [인쇄] — A4 가로, 한 쪽 25줄(합계 묶음 포함, 묶음은 쪼개지 않음)씩 나누고 쪽마다 '페이지 : n (전체)'
  * 인쇄 여백 0 이라 브라우저 머리글(날짜 · 제목 · 주소)이 찍히지 않는다
  * API  GET /api/budget/report/comparison?yyyy=
-->
<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <style>
      .layout-contents { height: 100vh !important; min-height: 0 !important; box-sizing: border-box; padding-bottom: 8px !important; overflow: hidden !important; }
      .layout-contents .tab-wrap, .layout-contents section { flex: 1 1 auto !important; min-height: 0 !important; overflow: auto !important; }

      .cmp-bar { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
      .cmp-bar dl dt { font-size: 14px; font-weight: 700; color: #4d4d4d; margin-bottom: 4px; }
      .cmp-bar .right { margin-left: auto; display: flex; gap: 6px; }

      /* 미리보기 용지 */
      .cmp-paper-wrap { background: #e9ecef; padding: 20px; overflow: auto; border-radius: 8px; }
      /* 원본 미리보기처럼 A4 가로 한 장씩 나누고, 쪽마다 머리글 · 쪽번호를 직접 그린다 */
      #cmpPaper { display: flex; flex-direction: column; gap: 16px; align-items: center; }
      .cmp-paper {
          width: 297mm; height: 210mm; box-sizing: border-box; background: #fff;
          padding: 10mm 12mm 8mm; box-shadow: 0 2px 10px rgba(0,0,0,.12);
          font-family: 'Malgun Gothic', sans-serif; color: #000;
          display: flex; flex-direction: column; overflow: hidden;
      }
      .cmp-paper .cmp-body { flex: 1; min-height: 0; overflow: hidden; }
      /* 줄바꿈되는 칸이 있어도 숫자는 한 줄 */
      table.cmp td.r { white-space: nowrap; }
      .cmp-page-no { text-align: center; font-size: 11px; padding-top: 4px; }
      .cmp-title-space { height: 34px; margin: 0 0 12px; }
      .cmp-title { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 2px; margin: 0 0 12px; }
      .cmp-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
      .cmp-empty { text-align: center; color: #888; padding: 60px 0; font-size: 14px; }

      table.cmp { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5px; border-top: none; }
      table.cmp th, table.cmp td {
          border: 1px solid #000; height: 19px; padding: 1px 6px; background: #fff; width: auto;
          font-weight: 400; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3;
      }
      table.cmp th { text-align: center; }
      table.cmp th.grp { letter-spacing: 12px; }
      table.cmp td.l { text-align: left; }
      table.cmp td.r { text-align: right; }
      table.cmp td.mid { border-left: 2px solid #000; }
      table.cmp th.mid { border-left: 2px solid #000; }
      table.cmp tr.sum td, table.cmp tr.carry td, table.cmp tr.total td { font-weight: 700; }
      table.cmp tr.sum td.l, table.cmp tr.carry td.l, table.cmp tr.total td.l { text-align: center; }
      table.cmp tr.sum td { border-top: 2px solid #000; }
      table.cmp thead { display: table-header-group; }   /* 쪽이 넘어가면 머리글 반복 */
      table.cmp tr { page-break-inside: avoid; }
      table.cmp td.neg { color: #c00; }

      /* 여백 0 → 브라우저가 날짜 · 제목 · 주소 머리글/바닥글을 넣을 자리가 없어 찍히지 않는다 */
      @page { size: A4 landscape; margin: 0; }
      @media print {
          body * { visibility: hidden; }
          #cmpPaper, #cmpPaper * { visibility: visible; }
          #cmpPaper { position: absolute; left: 0; top: 0; display: block; }
          .cmp-paper { box-shadow: none; margin: 0; page-break-after: always; break-after: page; }
          .cmp-paper:last-child { page-break-after: auto; break-after: auto; }
          table.cmp td.neg { color: #000; }
          * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>결산서및예산안대조표</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>예산관리</li>
        <li>예산서출력</li>
        <li>결산서및예산안대조표</li>
      </ul>
    </div>

    <section>
      <div class="cmp-bar">
        <dl>
          <dt><label for="cmpYyyy">년도 (결산)</label></dt>
          <dd><input id="cmpYyyy" maxlength="4" style="width:90px; text-align:center;" type="text"/></dd>
        </dl>
        <button class="btn btn-delete" id="btnCmpSearch" title="조회" type="button">
          <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}"> 조회
        </button>
        <span id="cmpHint" style="font-size:13px; color:#666; margin-bottom:8px;"></span>
        <div class="right">
          <a class="btn btn-edit" id="btnCmpPrint" title="인쇄">
            <img alt="인쇄 아이콘" th:src="@{/images/icon/ico-edit.svg}"> 인쇄
          </a>
        </div>
      </div>

      <div class="cmp-paper-wrap">
        <div id="cmpPaper">
          <div class="cmp-paper"><div class="cmp-empty">년도를 입력하고 조회하세요.</div></div>
        </div>
      </div>
    </section>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   (function () {
    const API = '/api/budget/report/comparison';
    // 쪽 나누기: A4 한 장 높이에 들어가는 만큼(보통 25줄 안팎). 과목 이름이 길어 줄바꿈되면 그만큼 덜 들어간다.
    // 합계 묶음은 쪼개지 않는다 — 남은 자리에 다 들어가지 않으면 묶음 전체를 다음 쪽으로 넘긴다.
    let loaded = false;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
     c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    // 원본처럼 값이 없는 칸(행 수가 다른 쪽)은 비우고, 있으면 0 도 표시한다
    const fmt = v => (v === undefined || v === null) ? '' : Number(v).toLocaleString();
    const diff = (a, b) => (a === undefined && b === undefined) ? undefined : (Number(a) || 0) - (Number(b) || 0);
    const numTd = (v, cls) => {
     const neg = v !== undefined && v !== null && Number(v) < 0;
     return `<td class="r${cls ? ' ' + cls : ''}${neg ? ' neg' : ''}">${fmt(v)}</td>`;
    };
    const now = () => {
     const d = new Date(), p = n => String(n).padStart(2, '0');
     return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };


    /**
     * 인쇄 쪽 나누기 — 줄 수가 아니라 실제 높이를 재서 넘치면 다음 쪽으로 넘긴다.
     * 긴 글자가 줄바꿈되어 행 높이가 달라져도 한 쪽을 넘치지 않는다.
     *  pageHtml(i): i번째 쪽 틀(빈 tbody, .pg-body, .pg-no 포함) / blocks: 함께 다닐 행 묶음 [[tr html, ...], ...]
     */
    function paginate(wrap, pageHtml, blocks) {
     const st = wrap.style;
     const hidden = getComputedStyle(wrap).display === 'none';
     if (hidden) { st.display = 'block'; st.position = 'absolute'; st.left = '-10000px'; st.top = '0'; }
     wrap.innerHTML = '';
     const pages = [];
     const add = () => {
      const t = document.createElement('div');
      t.innerHTML = pageHtml(pages.length).trim();
      const el = t.firstElementChild;
      wrap.appendChild(el);
      const pg = {el: el, body: el.querySelector('.pg-body'), tbody: el.querySelector('tbody')};
      pages.push(pg);
      return pg;
     };
     let cur = add();
     blocks.forEach(block => {
      const t = document.createElement('tbody');
      t.innerHTML = block.join('');
      const trs = [...t.children];
      trs.forEach(tr => cur.tbody.appendChild(tr));
      // 인쇄 시 글꼴·배율 차이로 화면보다 조금 길어지므로 여유(SAFE)를 둔다
      const SAFE = 24;
      if (cur.tbody.closest('table').getBoundingClientRect().bottom - cur.body.getBoundingClientRect().top > cur.body.clientHeight - SAFE && cur.tbody.children.length > trs.length) {
       trs.forEach(tr => tr.remove());
       cur = add();
       trs.forEach(tr => cur.tbody.appendChild(tr));
       // 새 쪽 첫 행의 반복값을 먼저 복원해서 높이에 반영
       const td = cur.tbody.querySelector('tr:first-child td[data-full]');
       if (td) td.textContent = td.dataset.full;
      }
     });
     pages.forEach((p, i) => {
      const n = p.el.querySelector('.pg-no');
      if (n) n.textContent = `페이지 : ${i + 1} (${pages.length})`;
      // 쪽 첫 행에서 숨겼던 반복값(월 · 사업구분 등)은 다시 보여준다
      const td = p.tbody.querySelector('tr:first-child td[data-full]');
      if (td) td.textContent = td.dataset.full;
     });
     if (hidden) { st.display = ''; st.position = ''; st.left = ''; st.top = ''; }
     return pages;
    }

    function render(data) {
     const rows = data.rows || [];
     const y1 = data.yyyy, y2 = data.yyyy2;
     $('#cmpHint').text(`결산 ${y1}년 · 예산 ${y2}년`);
     if (!rows.length) {
      $('#cmpPaper').html(`<div class="cmp-paper"><div class="cmp-empty">${esc(y1)}년 결산 · ${esc(y2)}년 예산 자료가 없습니다.</div></div>`);
      loaded = false;
      return;
     }
     const rowHtml = r => {
      const cls = r.kind || '';
      return `<tr class="${cls}">`
       + `<td class="l">${esc(r.acc1 || '')}</td>`
       + numTd(r.amt2) + numTd(r.amt1) + numTd(diff(r.amt2, r.amt1))
       + `<td class="l mid">${esc(r.acc2 || '')}</td>`
       + numTd(r.amt4) + numTd(r.amt3) + numTd(diff(r.amt4, r.amt3))
       + `</tr>`;
     };
     const printed = now();
     const detail = rows.filter(r => !r.kind);
     const footer = rows.filter(r => r.kind);   // sum, carry, total

     const pageHtml = pi => `
      <div class="cmp-paper">
       <div class="cmp-body pg-body">
        ${pi === 0
      ? `<div class="cmp-title">${esc(y1)}년 결산서 및 ${esc(y2)}년 예산안 대조표</div>`
      : `<div class="cmp-title-space"></div>`}
        <div class="cmp-meta">
          <span>${esc(data.spjangnm || '')}</span>
          <span>출력일시 : ${printed}</span>
        </div>
        <table class="cmp">
          <colgroup>
            <col style="width:15%"><col style="width:11.66%"><col style="width:11.66%"><col style="width:11.66%">
            <col style="width:15%"><col style="width:11.66%"><col style="width:11.66%"><col style="width:11.68%">
          </colgroup>
          <thead>
            <tr><th class="grp" colspan="4">세입</th><th class="grp mid" colspan="4">세출</th></tr>
            <tr>
              <th>과목</th><th>${esc(y1)} 결산금액</th><th>${esc(y2)} 예산금액</th><th>증감액</th>
              <th class="mid">과목</th><th>${esc(y1)} 결산금액</th><th>${esc(y2)} 예산금액</th><th>증감액</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
       </div>
       <div class="cmp-page-no pg-no"></div>
      </div>`;

     // 과목 한 줄씩, 합계 묶음(합계 · 이월금 · 총계)은 쪼개지 않고 함께 다닌다
     const blocks = detail.map(r => [rowHtml(r)]);
     if (footer.length) blocks.push(footer.map(rowHtml));
     paginate(document.getElementById('cmpPaper'), pageHtml, blocks);
     loaded = true;
    }

    function retrieve() {
     let yyyy = String($('#cmpYyyy').val() || '').trim();
     if (yyyy === '') {                       // 비어 있으면 당해 연도로 채워서 조회
      yyyy = String(new Date().getFullYear());
      $('#cmpYyyy').val(yyyy);
     }
     if (!/^\d{4}$/.test(yyyy)) {
      Alert.alert('', '년도를 4자리로 입력하세요.');
      $('#cmpYyyy').focus();
      return;
     }
     AjaxUtil.getAsyncData(API, {yyyy: yyyy}, res => {
      if (!res || !res.success) {
       Alert.alert('', (res && res.message) || '조회 중 오류가 발생했습니다.');
       return;
      }
      render(res.data || {});
     });
    }

    $(document).ready(function () {
     $('#cmpYyyy').val(String(new Date().getFullYear()));   // 결산 연도 기본값: 당해 연도
     $('#btnCmpSearch').on('click', retrieve);
     $('#cmpYyyy').on('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); retrieve(); } });   // 원본: 년도에서 Enter → 조회
     $('#btnCmpPrint').on('click', () => {
      if (!loaded) { Alert.alert('', '먼저 조회하세요.'); return; }
      window.print();
     });
     $(document).on('keydown', e => { if (e.key === 'F4') { e.preventDefault(); retrieve(); } });
    });
   })();
  </script>
</th:block>
</html>
