<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <style>
      .grid-guide-box {
          background: #eef3ff;
          border-left: 4px solid #2f5cff;
          padding: 6px 10px;
          font-size: 13px;
          margin-bottom: 6px;
          color: #333;
      }

      /* 체크박스 — bank_account .ba-type 방식 (전역 가상요소 제거, 네이티브 모양) */
      .chk-inline { display: inline-flex; align-items: center; gap: 6px; height: 30px; font-size: 13px; cursor: pointer; white-space: nowrap; }
      .chk-inline input[type="checkbox"] {
          -webkit-appearance: auto !important; -moz-appearance: auto !important; appearance: auto !important;
          flex: 0 0 16px !important; width: 16px !important; height: 16px !important;
          min-width: 16px !important; max-width: 16px !important; min-height: 16px !important;
          margin: 0 !important; padding: 0 !important; border: 0 !important; border-radius: 0 !important;
          background: none !important; box-shadow: none !important; vertical-align: middle !important; accent-color: #2563eb;
      }
      .chk-inline input[type="checkbox"]::before,
      .chk-inline input[type="checkbox"]::after { content: none !important; display: none !important; }

      /* 집계내역 좌우 2분할 */
      .split-wrap { display: flex; gap: 8px; }
      .split-left  { flex: 0 0 auto; width: 240px; }   /* 원본 d_book10_0_list : 계정과목만 */
      .split-right { flex: 1 1 auto; min-width: 0; }

      /* ── 전표 팝업 레이아웃 ── */
      .slip-popup .slip-head-table,
      .slip-popup .slip-foot-table {
          width: 100%;
          border-collapse: collapse;
          table-layout: fixed;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-head-table td,
      .slip-popup .slip-foot-table th,
      .slip-popup .slip-foot-table td {
          border: 1px solid #d5d9e0;
          padding: 4px 6px;
          font-size: 13px;
          vertical-align: middle;
      }
      .slip-popup .slip-head-table th,
      .slip-popup .slip-foot-table th {
          background: #f5f6f8;
          color: #333;
          font-weight: 600;
          text-align: center;
          white-space: nowrap;
      }
      .slip-popup .slip-head-table td input,
      .slip-popup .slip-head-table td textarea,
      .slip-popup .slip-foot-table td input {
          width: 100%;
          border: none;
          background: transparent;
          font-size: 13px;
          box-sizing: border-box;
      }
      .slip-popup .slip-head-table td textarea { resize: none; }
      .slip-popup .chk-cell { text-align: center; white-space: nowrap; }
      .slip-popup .slip-grid-box { margin: 8px 0; }
      .slip-popup { width: 100%; box-sizing: border-box; padding: 4px; }
      .slip-popup .section { width: 100%; }
  </style>
  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>관항별원장</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>장부출력</li>
        <li>관항별원장</li>
      </ul>
    </div>
    <div class="tab-wrap">
      <ul class="tab-links">
        <li><a href="#tab1" title="집계 내역">집계 내역</a></li>
        <li><a href="#tab2" id="tab2Link" title="상세 내역">상세 내역</a></li>
        <li><a href="#tab3" title="상세 내역">상세 내역</a></li>
      </ul>
      <div class="tab-contents">

        <!-- ── 집계 내역 (tab1) : 좌(관) + 우(항) 2분할 ── -->
        <section class="tab-item" id="tab1">
          <!-- 공통 조회조건 : 원본 w_book10 처럼 모든 탭이 같은 조건을 쓴다 -->
          <div class="section-top" id="cdtBox">
            <div class="search-wrap">
              <dl>
                <dt><label>기준일자<span class="eq"></span></label></dt>
                <dd>
                  <div class="srch-box">
                    <input id="searchfrdate" name="searchfrdate" type="date"/>
                    <span class="slow_sign">~</span>
                    <input id="searchtodate" name="searchtodate" type="date"/>
                  </div>
                </dd>
              </dl>
              <dl>
                <dt><label>계정과목</label></dt>
                <dd>
                  <input class="form-control2" id="accnm" name="accnm" placeholder="계정과목 (엔터로 검색)"/>
                  <input type="hidden" id="acccd" name="acccd"/>
                </dd>
              </dl>
              <dl>
                <dt><label>항</label></dt>
                <dd>
                  <input class="form-control2" id="it1nm" name="it1nm" placeholder="항 (엔터로 검색)"/>
                  <input type="hidden" id="it1cd" name="it1cd"/>
                </dd>
              </dl>
              <dl>
                <dt><label>재원</label></dt>
                <dd><select class="form-control2" id="mssec" name="mssec"></select></dd>
              </dl>
              <dl>
                <dt><label>사업구분</label></dt>
                <dd>
                  <select class="form-control2" id="busipur" name="busipur">
                    <option value="">전체</option>
                    <option value="1">고유목적</option>
                    <option value="2">수익</option>
                    <option value="3">공통</option>
                  </select>
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd>
                  <label class="chk-inline" title="체크하면 전체 계정의 상세내역을 상세내역 탭에 조회합니다">
                    <input type="checkbox" id="chkTotal"/> 총계정상세
                  </label>
                </dd>
              </dl>
              <dl>
                <dt>&nbsp;</dt>
                <dd style="display:flex; align-items:center; gap:6px;">
                  <li>
                    <button class="btn btn-delete" id="btnSearch" title="검색" type="button">
                      <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}">
                      검색
                    </button>
                  </li>
                  <li>
                    <button class="btn btn-delete" id="btnPrint" title="인쇄 (보고 있는 탭)" type="button">인쇄</button>
                  </li>
                </dd>
              </dl>
            </div>
          </div>
          <div class="grid-guide-box">※ 왼쪽 계정과목을 선택하면 오른쪽에 항별 내역이 나옵니다. 계정이나 항을 더블클릭하면 상세내역 탭이 조회됩니다. (단축키 조회:F4)</div>
          <div class="split-wrap">
            <div class="split-left">
              <div id="theGrid_acc" style="height: 495px;"></div>
            </div>
            <div class="split-right">
              <div id="theGrid_item" style="height: 495px;"></div>
            </div>
          </div>
        </section>

        <!-- ── 상세 내역 (tab2) : 마스터 ── -->
        <section class="tab-item" id="tab2">
          <div class="grid-guide-box">※ 행을 선택한 뒤 상세내역 탭을 누르거나 더블클릭하면 그 항의 전표 내역이 조회됩니다. 집계내역에서 계정·항을 더블클릭하거나 총계정상세를 체크하면 이 탭이 조회됩니다.</div>
          <div class="grid_box" id="divItemDetail">
            <div id="theGrid_item_detail" style="height: 495px;"></div>
          </div>
        </section>

        <!-- ── 상세 내역 (tab3) : 디테일 ── -->
        <section class="tab-item" id="tab3">
          <div class="grid-guide-box">※ 더블 클릭 하시면 전표 팝업이 열립니다.</div>
          <div class="grid_box" id="divDetail">
            <div id="theGrid_detail" style="height: 495px;"></div>
          </div>
        </section>

      </div>
    </div>
  </div>

  <!-- 관명 팝업 -->
  <script id="accnmTemplate" type="text/x-tmpl">
    <div class="content_wrap popup">
        <section class="section"><div id="AccGrid" style="height:350px; display:block;"></div></section>
    </div>
  </script>

  <!-- 항명 팝업 -->
  <script id="it1Template" type="text/x-tmpl">
    <div class="content_wrap popup">
        <section class="section"><div id="It1Grid" style="height:350px; display:block;"></div></section>
    </div>
  </script>

  <!-- 재원 팝업 -->
  <script id="mssecTemplate" type="text/x-tmpl">
    <div class="content_wrap popup">
      <section class="section"><div id="MssecGrid" style="height:300px; display:block;"></div></section>
    </div>
  </script>

  <!-- 전표 팝업 -->
  <script id="slipPopupTemplate" type="text/x-tmpl">
    <div class="content_wrap popup slip-popup">
      <section class="section">
        <div class="slip-header">
          <table class="slip-head-table">
            <colgroup>
              <col style="width:90px"><col>
              <col style="width:90px"><col>
              <col style="width:90px"><col>
              <col style="width:80px"><col>
            </colgroup>
            <tbody>
              <tr>
                <th>전표일자</th><td><input type="date" id="sp_yymmdd" readonly></td>
                <th>전표번호</th><td><input type="text" id="sp_slipno" readonly></td>
                <th>입출금번호</th><td><input type="text" id="sp_tiosecnm" readonly></td>
                <th>작성일자</th><td><input type="text" id="sp_inserdt" readonly></td>
              </tr>
              <tr>
                <th>사업구분</th><td><input type="text" id="sp_buiscd" readonly></td>
                <th>증빙구분</th><td><input type="text" id="sp_spoccu" readonly></td>
                <th>최종수정일</th><td><input type="text" id="sp_updatedt" readonly></td>
                <th>현금</th><td class="chk-cell"><input type="checkbox" id="sp_cashyn" disabled></td>
              </tr>
              <tr>
                <th>제목</th><td colspan="3"><input type="text" id="sp_title" readonly></td>
                <th>사업명</th><td colspan="3"><input type="text" id="sp_busim" readonly></td>
              </tr>
              <tr>
                <th>기관명</th><td colspan="7"><input type="text" id="sp_orgnm" readonly></td>
              </tr>
              <tr>
                <th>비고</th><td colspan="7"><textarea id="sp_remark" rows="4" readonly></textarea></td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="slip-grid-box"><div id="SlipDetailGrid" style="height:200px; display:block;"></div></div>
        <div class="slip-footer">
          <table class="slip-foot-table">
            <colgroup>
              <col style="width:80px"><col>
              <col style="width:80px"><col>
              <col style="width:80px"><col>
            </colgroup>
            <tbody>
              <tr>
                <th>거래처</th><td><input type="text" id="sp_custnm" readonly></td>
                <th>계좌번호</th><td><input type="text" id="sp_acctno" readonly></td>
                <th>수입자체</th><td><input type="text" id="sp_msseccd" readonly></td>
              </tr>
              <tr>
                <th>카드</th><td><input type="text" id="sp_cardnm" readonly></td>
                <th>재원</th><td><input type="text" id="sp_mssecnm" readonly></td>
                <th></th><td><input type="text" id="sp_acctno2" readonly></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </script>

</th:block>
<th:block layout:fragment="scripts">
  <th:block th:replace="common/ax5_uploader :: ax5_uploader"></th:block>
  <th:block th:replace="common/popup_company.html :: popup_company"></th:block>
  <th:block th:replace="common/popup_account :: popup_account" />
  <script th:src="@{/js/cycle/AccountInputHandler.js}"></script>
  <th:block th:replace="common/popup_card :: popup_card" />
  <script th:src="@{/js/cycle/CardInputHandler.js}"></script>
  <script type="text/javascript">
   class CategoryItemLedgerPage { //관항별원장
    constructor() {
     this.url = '/api/ledger/CategoryItemLedger';
     this.entry_url = '/api/account_management/slip_entry';
     this.accGrid1 = null;   // tab1 좌측 - 관 목록
     this.itemGrid1 = null;   // tab1 우측 - 항 목록
     this.itemDetailGrid = null;   // tab2 - 마스터
     this.detailGrid = null;   // tab3 - 디테일
     this.mssecOptions = null;
     this.tab2Name = '상세 내역';   // 선택된 관명으로 갱신
     this.tab2Key = {acccd: '', it1cd: ''};   // tab2 조회 기준 (집계 더블클릭 / 총계정상세)
     this.tab3Key = null;                     // tab3 조회 기준 (tab2 에서 고른 행)
     this.init();
    }

    init() {
     let _this = this;

     // ══════════════════════════════════════
     // tab1 좌측 : 관(계정과목) 목록
     // ══════════════════════════════════════
     _this.accGrid1 = new wijmo.grid.FlexGrid('#theGrid_acc', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center';
      },
      columns: [
       {binding: 'accnm',  header: '계정과목', width: '*', align: 'left'},
      ],
     });
     new FlexGridContextMenu(_this.accGrid1);
     _this.accGrid1.downloadFileName = '계정과목';
     // 좌측 관 선택 → 우측 항 목록 채움 (같은 탭 안 마스터-디테일)
     _this.accGrid1.selectionChanged.addHandler(function () {
      const master = _this.accGrid1.selectedItems[0];
      if (master) _this.loadItemsByAcc(master);
     });

     // ══════════════════════════════════════
     // tab1 우측 : 항별 내역
     // ══════════════════════════════════════
     _this.itemGrid1 = new wijmo.grid.FlexGrid('#theGrid_item', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center';
      },
      columns: [
       {binding: 'it1nm', header: '항', width: 220, align: 'left'},
       {binding: 'bfamt', header: '전잔액', width: 130, align: 'right', format: 'n0'},
       {binding: 'dramt', header: '차변금액', width: 130, align: 'right', format: 'n0'},
       {binding: 'cramt', header: '대변금액', width: 130, align: 'right', format: 'n0'},
       {binding: 'balamt', header: '잔액', width: 130, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.itemGrid1);
     _this.itemGrid1.downloadFileName = '항별내역';
     // 원본 d_book11_0 : 맨 위에 계정과목 머리행(하늘색), 합계줄 없음
     _this.itemGrid1.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
      const it = s.rows[e.row].dataItem;
      if (it && it._hdr) e.cell.style.background = '#d7ebfb';
     });

     // 우측 항 더블클릭 → 상세내역(tab2) : 그 계정 · 항 (원본 탭 이름 '관 - 항')
     _this.itemGrid1.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.itemGrid1.hitTest(e);
      if (ht.cellType !== wijmo.grid.CellType.Cell) return;
      const it = _this.itemGrid1.rows[ht.row].dataItem;
      if (!it || it._hdr) return;
      _this.goToDetail(it.acccd, it.it1cd, (it.accnm || '') + ' - ' + (it.it1nm || ''), it.tiosec || '');
     });

     // 좌측 계정 더블클릭 → 상세내역(tab2) : 그 계정
     _this.accGrid1.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.accGrid1.hitTest(e);
      if (ht.cellType !== wijmo.grid.CellType.Cell) return;
      const item = _this.accGrid1.selectedItems[0];
      if (item) _this.goToDetailFromSummary(item);
     });

     // ══════════════════════════════════════
     // tab2 : 관-항 상세내역 (원본 d_book11_1)
     //   관 → 항 → 전표일자, 항소계 · 계정소계 (빨강), 잔액은 항이 바뀌면 다시 누계
     // ══════════════════════════════════════
     _this.itemDetailGrid = new wijmo.grid.FlexGrid('#theGrid_item_detail', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false, allowSorting: false,
      selectionMode: wijmo.grid.SelectionMode.Row, isReadOnly: true,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) { e.cell.style.textAlign = 'center'; return; }
       if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
       const it = s.rows[e.row].dataItem;
       const sub = it && it._kind !== 'd';
       // 그리드가 셀을 재사용하므로 일반 행은 색을 원래대로 되돌린다
       e.cell.style.color = sub ? '#d33' : '';
       e.cell.style.fontWeight = sub ? '600' : '';
       e.cell.style.background = sub ? '#fff8ec' : '';
      },
      columns: [
       {binding: 'accnmShow', header: '관',       width: 150, align: 'left'},
       {binding: 'it1nmShow', header: '항',       width: 260, align: 'left'},
       {binding: 'datef',     header: '전표일자', width: 120, align: 'center'},
       {binding: 'dramt',     header: '차변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'cramt',     header: '대변금액', width: 140, align: 'right', format: 'n0'},
       {binding: 'balamt',    header: '잔액',     width: 140, align: 'right', format: 'n0'},
      ],
     });
     new FlexGridContextMenu(_this.itemDetailGrid);
     _this.itemDetailGrid.downloadFileName = '관항상세내역';
     // 행 선택 → 상세내역(tab3) 조회 기준 기억 (원본 : tab3 을 누르면 tab2 현재 행으로 조회)
     _this.itemDetailGrid.selectionChanged.addHandler(function () {
      const it = _this.itemDetailGrid.selectedItems[0];
      if (it && it._kind === 'd') _this.tab3Key = {acccd: it.acccd, it1cd: it.it1cd, tiosec: it.tiosec || '', frdate: it.frdate, todate: it.todate};
     });
     // 행 더블클릭 → 상세내역(tab3)
     _this.itemDetailGrid.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.itemDetailGrid.hitTest(e);
      if (ht.cellType !== wijmo.grid.CellType.Cell) return;
      const it = _this.itemDetailGrid.rows[ht.row].dataItem;
      if (!it || it._kind !== 'd') return;
      _this.activateTab(3);
     });

     // ══════════════════════════════════════
     // tab3 : 상세내역 (디테일)
     // ══════════════════════════════════════
     _this.detailGrid = new wijmo.grid.FlexGrid('#theGrid_detail', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      showMarquee: true,
      allowSorting: 'MultiColumn',
      selectionMode: wijmo.grid.SelectionMode.Row,
      isReadOnly: true,
      frozenColumns: 1,
      formatItem: (s, e) => {
       if (e.panel.cellType === wijmo.grid.CellType.ColumnHeader) e.cell.style.textAlign = 'center';
      },
      columns: [
       {binding: 'mssecnm', header: '재원',     width: 90,  align: 'center'},
       {binding: 'datef',   header: '전표일자', width: 110, align: 'center'},
       {binding: 'summy',   header: '비고',     width: '*', align: 'left'},
       {binding: 'dramt',   header: '차변금액', width: 130, align: 'right', format: 'n0'},
       {binding: 'cramt',   header: '대변금액', width: 130, align: 'right', format: 'n0'},
       {binding: 'balamt',  header: '잔액',     width: 130, align: 'right', format: 'n0'},
       {binding: 'cardnum', header: '카드번호', width: 150, align: 'center'},
       {binding: 'cardnm',  header: '카드명칭', width: 160, align: 'left'},
      ],
     });
     new FlexGridContextMenu(_this.detailGrid);
     _this.detailGrid.downloadFileName = '상세내역';
     // tab3 : 월소계(97) 파랑 · 월누계(98) · 계정소계 빨강
     _this.detailGrid.formatItem.addHandler(function (s, e) {
      if (e.panel.cellType !== wijmo.grid.CellType.Cell) return;
      const item = s.rows[e.row].dataItem;
      if (!item || !item._kind) return;
      if (item._kind === 'm') { e.cell.style.color = '#1f4fd1'; e.cell.style.background = '#eaf3ff'; }
      else if (item._kind === 'c') { e.cell.style.color = '#d33'; }
      else { e.cell.style.color = '#d33'; e.cell.style.background = '#fff4f4'; }
      e.cell.style.fontWeight = '600';
     });

     _this.detailGrid.hostElement.addEventListener('dblclick', function (e) {
      const ht = _this.detailGrid.hitTest(e);
      if (ht.cellType === wijmo.grid.CellType.Cell) {
       const item = _this.detailGrid.selectedItems[0];
       if (item) _this.openSlipFromRow(item);
      }
     });

    }//init

    // 원장 행 잔액 : 일반 행만 누계, 97/98 행은 그 시점 누계
    ledgerBalance(rows) {
     let run = 0;
     (rows || []).forEach(r => {
      r.dramt = Number(r.dramt) || 0; r.cramt = Number(r.cramt) || 0; r.bfamt = Number(r.bfamt) || 0;
      const yy = String(r.yymmdd || '');
      if (!(yy.endsWith('97') || yy.endsWith('98'))) run += r.bfamt;
      r.balamt = run;
      if (yy === '00000000') r.summy = r.summy || '전기이월';
     });
     return rows || [];
    }

    // tab3 더블클릭 → 전표 팝업
    // PB: yymmdd='00000000'(이월/기초행)이면 안내 후 중단, 정상행이면 yymmdd|spnum|acccd
    openSlipFromRow(item) {
     if (item._sub || item._kind) return;
     const yy = String(item.yymmdd || '').replace(/[^0-9]/g, '');
     if (yy === '00000000' || yy === '') {
      Alert.alert('확인', '전표일자가 있는 내역을 선택해주세요.');
      return;
     }
     if (yy.endsWith('97') || yy.endsWith('98')) return;   // 소계행
     this.openSlipPopup({ yymmdd: yy, spnum: item.spnum || '', acccd: item.acccd || '' });
    }

    // ══════════════════════════════════════
    // 공통 : 차변/대변이 모두 0인 행 제거
    //   PB RetrieveEnd 이식(전개 시 dramt<>0 또는 cramt<>0 인 행만 유지)
    // ══════════════════════════════════════
    filterZeroRows(rows) {
     rows = rows || [];
     return rows.filter(function (r) {
      const dr = Number(r.dramt) || 0;
      const cr = Number(r.cramt) || 0;
      return dr !== 0 || cr !== 0;
     });
    }

    // 잔액 계산 : drcr='1' ? bfamt+dramt-cramt : bfamt+cramt-dramt
    //   (서버가 balamt를 안 내려줘도 프론트에서 보정)
    calcBalance(rows) {
     rows = rows || [];
     rows.forEach(function (r) {
      const bf = Number(r.bfamt) || 0;
      const dr = Number(r.dramt) || 0;
      const cr = Number(r.cramt) || 0;
      r.bfamt = bf;
      r.dramt = dr;
      r.cramt = cr;
      r.balamt = (String(r.drcr) === '1') ? (bf + dr - cr) : (bf + cr - dr);
     });
     return rows;
    }

    // ══════════════════════════════════════
    // tab1 : 관(좌측) 목록 조회
    // ══════════════════════════════════════
    searchSummary() {
     let _this = this;
     let data = {
      start: $('#searchfrdate').val(),
      end: $('#searchtodate').val(),
      mssec: $('#mssec').val(),
      acccd: $('#acccd').val(),
      it1cd: ''
     };
     AjaxUtil.getAsyncData(this.url + '/read', data, function (result) {
      if (result != null && result.success) {
       _this.accGrid1.itemsSource = _this.calcBalance(_this.filterZeroRows(result.data || []));
       // 첫 관 자동 선택 → 우측 자동 조회
       // 첫 행이 이미 선택돼 있으면 selectionChanged 가 안 뜨므로 오른쪽을 직접 채운다
       setTimeout(function () {
        if (_this.accGrid1.rows.length > 0) {
         _this.accGrid1.select(0, 0);
         const first = _this.accGrid1.rows[0].dataItem;
         if (first) _this.loadItemsByAcc(first);
        } else {
         _this.itemGrid1.itemsSource = [];
        }
       }, 50);
      } else {
       console.log('집계(관) 조회 오류');
      }
     });
    }

    // 좌측 관 선택 → 우측 항 목록 조회
    loadItemsByAcc(master) {
     let _this = this;
     let data = {
      start: $('#searchfrdate').val(),
      end: $('#searchtodate').val(),
      mssec: $('#mssec').val(),
      acccd: master.acccd || '',
      it1cd: $('#it1cd').val() || '',   // 원본 dw_cdt 항
      busipur: $('#busipur').val()
     };
     AjaxUtil.getAsyncData(this.url + '/readItem', data, function (result) {
      if (result != null && result.success) {
       // 원본 정렬 : 계정 → 항코드
       const rows = _this.calcBalance(_this.filterZeroRows(result.data || []))
       .sort((x, y) => String(x.it1cd || '').localeCompare(String(y.it1cd || '')));
       const hdr = {_hdr: true, it1nm: master.accnm || '', bfamt: null, dramt: null, cramt: null, balamt: null};
       _this.itemGrid1.itemsSource = rows.length ? [hdr].concat(rows) : [];
      } else {
       console.log('항별 내역 조회 오류');
      }
     });
    }

    // 집계 → 상세내역(tab2)
    goToDetailFromSummary(item) {
     this.goToDetail(item.acccd, '', item.accnm || '', '');
    }
    goToDetail(acccd, it1cd, name, tiosec) {
     this.tab2Name = name || '상세 내역';
     $('#tab2Link').text(this.tab2Name).attr('title', this.tab2Name);
     this.tab2Key = {acccd: acccd || '', it1cd: it1cd || '', tiosec: tiosec || ''};
     $('#chkTotal').prop('checked', false);
     this.activateTab(2);
     this.searchItemDetail();
    }

    // tab2 조회 (원본 d_book11_1) + 항소계 · 계정소계 행 만들기
    searchItemDetail() {
     let _this = this;
     AjaxUtil.getAsyncData(this.url + '/readItemDetail', {
      start: $('#searchfrdate').val(), end: $('#searchtodate').val(),
      mssec: $('#mssec').val(), busipur: $('#busipur').val(),
      acccd: _this.tab2Key.acccd, it1cd: _this.tab2Key.it1cd, tiosec: _this.tab2Key.tiosec || ''
     }, function (result) {
      if (!(result != null && result.success)) { console.log('상세(tab2) 조회 오류'); return; }
      const src = (result.data || []).slice().sort((a, b) =>
       String(a.acccd).localeCompare(String(b.acccd)) || String(a.it1cd).localeCompare(String(b.it1cd)) ||
       String(a.it1nm || '').localeCompare(String(b.it1nm || '')) ||
       String(a.yymmdd || '').localeCompare(String(b.yymmdd || '')));
      const out = [];
      let accK = null, itK = null, run = 0;
      let it = {dr: 0, cr: 0, bf: 0}, ac = {dr: 0, cr: 0, bf: 0};
      const flushIt = () => { if (itK !== null) out.push({_kind: 'it', datef: '항소계', dramt: it.dr, cramt: it.cr, balamt: it.bf}); it = {dr: 0, cr: 0, bf: 0}; };
      const flushAc = () => { if (accK !== null) out.push({_kind: 'acc', datef: '계정소계', dramt: ac.dr, cramt: ac.cr, balamt: ac.bf}); ac = {dr: 0, cr: 0, bf: 0}; };
      src.forEach(r => {
       const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0, bf = Number(r.bfamt) || 0;
       const ik = r.it1cd + '|' + (r.it1nm || '');
       const newAcc = r.acccd !== accK, newIt = newAcc || ik !== itK;
       if (newIt) flushIt();
       if (newAcc) { flushAc(); }
       if (newIt) run = 0;
       run += bf;
       out.push(Object.assign({}, r, {
        _kind: 'd', dramt: dr, cramt: cr, balamt: run,
        accnmShow: newAcc ? r.accnm : '', it1nmShow: newIt ? r.it1nm : '',
        datef: r.yymmdd ? r.yymmdd : '전기이월'
       }));
       it.dr += dr; it.cr += cr; it.bf += run; ac.dr += dr; ac.cr += cr; ac.bf += run;
       accK = r.acccd; itK = ik;
      });
      flushIt(); flushAc();
      _this.itemDetailGrid.itemsSource = out;
      _this.tab3Key = null;
      setTimeout(() => { if (out.length) _this.itemDetailGrid.select(0, 0); }, 0);
     });
    }

    // 탭 활성화 (해시/클래스 방식 모두 대비)
    activateTab(no) {
     let $link = $('.tab-links a[href="#tab' + no + '"]');
     if ($link.length) {
      $link.trigger('click');
      return;
     }
     // fallback
     $('.tab-item').removeClass('active');
     $('#tab' + no).addClass('active');
    }

    // tab2 행 선택 → tab3 자동조회
    searchDetailByMaster(master) {
     let _this = this;
     _this.tab3Key = master;

     let data = {
      start: (master.frdate || $('#searchfrdate').val()),
      end: (master.todate || $('#searchtodate').val()),
      acccd: master.acccd || '',
      it1cd: master.it1cd || '',
      tiosec: master.tiosec || '',
      mssec: $('#mssec').val()
     };
     AjaxUtil.getAsyncData(this.url + '/readDetail', data, function (result) {
      if (result != null && result.success) {
       _this.detailGrid.itemsSource = result.data || [];
      } else {
       console.log('상세(tab3) 조회 오류');
      }
     });
    }

    // tab3 조회 (원본 d_book11_2) : tab2 에서 고른 행의 계정 · 항 · 구분
    searchDetailData() {
     let _this = this;
     const m = _this.tab3Key;
     if (!m || !m.acccd) { _this.detailGrid.itemsSource = []; return; }
     AjaxUtil.getAsyncData(this.url + '/readDetail', {
      start: m.frdate || $('#searchfrdate').val(), end: m.todate || $('#searchtodate').val(),
      acccd: m.acccd, it1cd: m.it1cd || '', tiosec: m.tiosec || '', mssec: '', busipur: $('#busipur').val()
     }, function (result) {
      if (!(result != null && result.success)) return;
      const src = result.data || [];
      // 재원명
      const mm = {}; (_this.mssecOptions || []).forEach(o => mm[o.value] = o.text);
      $('#mssec option').each(function () { if (this.value) mm[this.value] = $(this).text(); });
      // 원본 d_book11_2 : 일반 행 잔액 = 그 행 금액, 월소계(97) = 그 달 합, 월누계(98) = 처음부터 그 달까지
      let cumDr = 0, cumCr = 0, cumBf = 0, lastDay = null, prevKind = null;
      const rows = [];
      src.forEach(r => {
       r.dramt = Number(r.dramt) || 0; r.cramt = Number(r.cramt) || 0; r.bfamt = Number(r.bfamt) || 0;
       const yy = String(r.yymmdd || '');
       r.mssecnm = mm[r.mssec] || r.mssec || '';
       if (yy !== '00000000' && yy.endsWith('97')) {
        rows.push({_kind: 'm', yymmdd: yy, datef: prevKind === 'm' ? '' : '월소계', mkey: '월소계' + yy, summy: '', dramt: r.dramt, cramt: r.cramt, balamt: r.bfamt});
        prevKind = 'm'; lastDay = null; return;
       }
       if (yy !== '00000000' && yy.endsWith('98')) {
        rows.push({_kind: 'c', yymmdd: yy, datef: prevKind === 'c' ? '' : '월누계', mkey: '월누계' + yy, summy: '', dramt: cumDr, cramt: cumCr, balamt: cumBf});
        prevKind = 'c'; return;
       }
       prevKind = null;
       cumDr += r.dramt; cumCr += r.cramt; cumBf += r.bfamt;
       r.balamt = r.bfamt;
       if (yy === '00000000') { r.datef = '전일이월'; r.mkey = '전일이월'; r.summy = r.summy || '전일이월'; }
       else { const f = yy.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'); r.mkey = f; r.datef = (f === lastDay) ? '' : f; lastDay = f; }
       rows.push(r);
      });
      if (rows.length) rows.push({_kind: 's', datef: '계정소계', mkey: '계정소계', summy: '', dramt: cumDr, cramt: cumCr, balamt: cumBf});
      _this.detailRows = rows;
      _this.detailGrid.itemsSource = rows;
     });
    }

    // ══════════════════════════════════════
    // 인쇄 : 지금 보고 있는 탭의 원본 인쇄용 DW 모양으로
    //   탭1 d_book11_0_print / 탭2 d_book11_1_print / 탭3 d_book11_2_print
    // ══════════════════════════════════════
    print() {
     const no = getActiveTabNo();
     if (no === 1) this.printSummary();
     else if (no === 2) this.printItemDetail();
     else this.printDetail();
    }

    _esc(v) { return String(v == null ? '' : v).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c])); }
    _n0(v) { return (v == null || v === '') ? '' : Number(v).toLocaleString('ko-KR'); }
    _d8(v) { const t = String(v || ''); return t === '00000000' ? '전일이월' : t.replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'); }

    // 공통 머리글 + 창 열기
    _openPrint(title, sub, colsHtml, headHtml, bodyHtml, showConfirm) {
     const _this = this, esc = this._esc;
     AjaxUtil.getAsyncData(_this.url + '/readOrg', {}, function (res) {
      const org = (res && res.data && res.data.spjangnm) || '';
      if (!showConfirm) return go(org, '');
      AjaxUtil.getAsyncData(_this.url + '/readConfirm', {}, function (r2) {
       go(org, _this._confirmHtml((r2 && r2.data) || {}));
      });
     });
     function go(org, confirm) {
      const now = new Date(), p2 = n => String(n).padStart(2, '0');
      const ts = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
      const fr = $('#searchfrdate').val(), to = $('#searchtodate').val();
      const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(title) + '</title><style>'
       + '@page{size:A4 portrait;margin:12mm 10mm 14mm;@bottom-center{content:"페이지 : " counter(page) " (" counter(pages) ")";font-size:10pt}}'
       + 'body{font-family:"Malgun Gothic",sans-serif;font-size:9.5pt;margin:0}'
       + 'h1{text-align:center;font-size:20pt;font-weight:bold;letter-spacing:4px;margin:4px 0}'
       + '.d{margin-bottom:2px}.hr{display:flex;align-items:flex-end;margin-bottom:4px}.hr div{flex:1}'
       + '.hr .s{text-align:center;font-size:12pt;font-weight:bold}.hr .t{text-align:right}'
       + 'table.g{width:100%;border-collapse:collapse}.g th,.g td{border:1px solid #555;padding:2px 4px;height:18px}'
       + '.g th{font-weight:normal}thead{display:table-header-group}tr{page-break-inside:avoid}'
       + '.c{text-align:center}.r{text-align:right}.b td{font-weight:bold}'
       + '.cf{border-collapse:collapse;margin-left:auto}.cf th,.cf td{border:1px solid #555;width:64px;text-align:center;font-weight:normal;padding:1px}'
       + '.cf td{height:46px;font-weight:bold}.cf td.x{background:linear-gradient(to top right,transparent calc(50% - .5px),#555 50%,transparent calc(50% + .5px))}'
       + '</style></head><body>' + confirm + '<h1>' + esc(title) + '</h1>'
       + '<div class="d">기준일자 : ' + esc(fr) + ' - ' + esc(to) + '</div>'
       + '<div class="hr"><div>' + esc(org) + '</div><div class="s">' + esc(sub) + '</div><div class="t">출력일시 : ' + esc(ts) + '</div></div>'
       + '<table class="g"><colgroup>' + colsHtml + '</colgroup><thead><tr>' + headHtml + '</tr></thead><tbody>' + bodyHtml + '</tbody></table></body></html>';
      const w = window.open('', '_blank', 'width=1000,height=800');
      if (!w) { Alert.alert('확인', '팝업이 차단되어 있습니다. 팝업을 허용해 주세요.'); return; }
      w.document.open(); w.document.write(html); w.document.close();
      w.onload = function () { w.focus(); w.print(); };
     }
    }

    // 결재란 (원본 d_confirm_001) : settle1~8 이름, crolin 이면 사선, junchk 이면 '전결'
    //   이름(settleN)이 빈 칸은 찍지 않는다
    _confirmHtml(c) {
     const on = v => !(v == null || String(v).trim() === '' || String(v).trim() === '0');
     let h = '', d = '';
     for (let i = 1; i <= 8; i++) {
      const nm = c['settle' + i];
      if (nm == null || String(nm).trim() === '') continue;
      h += '<th>' + this._esc(nm) + '</th>';
      d += '<td' + (on(c['crolin' + i]) ? ' class="x"' : '') + '>' + (on(c['junchk' + i]) ? '전결' : '') + '</td>';
     }
     return h ? '<table class="cf"><tr>' + h + '</tr><tr>' + d + '</tr></table>' : '';
    }

    // 탭1 인쇄 (d_book11_0_print) : 왼쪽에서 고른 계정의 항별 — 관 / 항 / 전잔액 / 차변 / 대변 / 잔액, 맨 끝 '계'
    printSummary() {
     const _this = this, esc = this._esc, n0 = this._n0;
     const acc = _this.accGrid1.selectedItems[0];
     if (!acc) { Alert.alert('확인', '집계내역에서 계정과목을 선택한 뒤 인쇄하세요.'); return; }
     AjaxUtil.getAsyncData(_this.url + '/readPrintSummary', {
      start: $('#searchfrdate').val(), end: $('#searchtodate').val(), mssec: $('#mssec').val(), acccd: acc.acccd
     }, function (res) {
      const rows = (res && res.data) || [];
      if (!rows.length) { Alert.alert('확인', '인쇄할 내역이 없습니다.'); return; }
      let body = '', tot = 0;
      rows.forEach((r, i) => {
       const bf = Number(r.bfamt) || 0, dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0;
       const bal = String(r.drcr) === '1' ? bf + dr - cr : bf + cr - dr;
       tot += bal;
       body += '<tr><td>' + (i === 0 ? esc(r.accnm) : '') + '</td><td>' + esc(r.it1nm) + '</td><td class="r">' + n0(bf)
        + '</td><td class="r">' + n0(dr) + '</td><td class="r">' + n0(cr) + '</td><td class="r">' + n0(bal) + '</td></tr>';
      });
      body += '<tr class="b"><td class="c">계</td><td colspan="4"></td><td class="r">' + n0(tot) + '</td></tr>';
      _this._openPrint('관항별원장', acc.accnm || '',
       '<col style="width:14%"><col style="width:22%"><col style="width:16%"><col style="width:16%"><col style="width:16%"><col style="width:16%">',
       '<th>관</th><th>항</th><th>전잔액</th><th>차변</th><th>대변</th><th>잔액</th>', body, true);
     });
    }

    // 탭2 인쇄 (d_book11_1_print) : 항 / 전표일자 / 차변 / 대변 / 잔액(그 행 금액), 항소계 · 계정소계
    printItemDetail() {
     const _this = this, esc = this._esc, n0 = this._n0;
     const k = _this.tab2Key || {};
     if (!(_this.itemDetailGrid.rows.length)) { Alert.alert('확인', '상세내역을 조회한 뒤 인쇄하세요.'); return; }
     AjaxUtil.getAsyncData(_this.url + '/readPrintItemDetail', {
      start: $('#searchfrdate').val(), end: $('#searchtodate').val(), acccd: k.acccd || '', it1cd: k.it1cd || ''
     }, function (res) {
      const rows = (res && res.data) || [];
      if (!rows.length) { Alert.alert('확인', '인쇄할 내역이 없습니다.'); return; }
      let body = '', accK = null, itK = null, it = null, ac = null;
      const sub = (lbl, t) => '<tr class="b"><td></td><td class="c">' + lbl + '</td><td class="r">' + n0(t.dr) + '</td><td class="r">' + n0(t.cr) + '</td><td class="r">' + n0(t.bf) + '</td></tr>';
      rows.forEach(r => {
       const dr = Number(r.dramt) || 0, cr = Number(r.cramt) || 0, bf = Number(r.bfamt) || 0;
       const ik = r.it1cd + '|' + (r.it1nm || '');
       const newAcc = r.acccd !== accK, newIt = newAcc || ik !== itK;
       if (newIt && it) body += sub('항소계', it);
       if (newAcc && ac) body += sub('계정소계', ac);
       if (newAcc) { ac = {dr: 0, cr: 0, bf: 0}; body += '<tr><td colspan="5" style="font-weight:bold;border-left:0;border-right:0">' + esc(r.accnm) + '</td></tr>'; }
       if (newIt) it = {dr: 0, cr: 0, bf: 0};
       body += '<tr><td>' + (newIt ? esc(r.it1nm) : '') + '</td><td class="c">' + esc(_this._d8(r.yymmdd)) + '</td><td class="r">' + n0(dr)
        + '</td><td class="r">' + n0(cr) + '</td><td class="r">' + n0(bf) + '</td></tr>';
       it.dr += dr; it.cr += cr; it.bf += bf; ac.dr += dr; ac.cr += cr; ac.bf += bf;
       accK = r.acccd; itK = ik;
      });
      if (it) body += sub('항소계', it);
      if (ac) body += sub('계정소계', ac);
      _this._openPrint('관항별원장(집계내역)', '',
       '<col style="width:30%"><col style="width:13%"><col style="width:19%"><col style="width:19%"><col style="width:19%">',
       '<th>항</th><th>전표일자</th><th>차변금액</th><th>대변금액</th><th>잔액</th>', body, false);
     });
    }

    // 탭3 인쇄 (d_book11_2_print) : 화면 그대로 — 재원 / 전표일자 / 비고 / 차변 / 대변 / 잔액
    printDetail() {
     const _this = this, esc = this._esc, n0 = this._n0;
     const rows = _this.detailRows || [];
     if (rows.length === 0) { Alert.alert('확인', '상세내역을 조회한 뒤 인쇄하세요.'); return; }
     const first = rows.find(r => !r._kind) || {};
     const span = new Array(rows.length).fill(1);
     for (let i = rows.length - 1; i > 0; i--) {
      if (rows[i].mkey && rows[i].mkey === rows[i - 1].mkey) { span[i - 1] = span[i] + 1; span[i] = 0; }
     }
     let body = '';
     rows.forEach((r, i) => {
      const b = (r._kind === 'c' || r._kind === 's') ? ' class="b"' : '';
      const lbl = r._kind ? (r._kind === 'm' ? '월소계' : r._kind === 'c' ? '월누계' : '계정소계') : (r.mkey || '');
      body += '<tr' + b + '><td class="c">' + esc(r._kind ? '' : r.mssecnm) + '</td>'
       + (span[i] ? '<td class="c"' + (span[i] > 1 ? ' rowspan="' + span[i] + '"' : '') + '>' + esc(lbl) + '</td>' : '')
       + '<td>' + esc(r.summy) + '</td><td class="r">' + n0(r.dramt) + '</td><td class="r">' + n0(r.cramt) + '</td><td class="r">' + n0(r.balamt) + '</td></tr>';
     });
     _this._openPrint('관항별원장', (first.accnm || '') + ' - ' + (first.it1nm || ''),
      '<col style="width:7%"><col style="width:10%"><col style="width:38%"><col style="width:15%"><col style="width:15%"><col style="width:15%">',
      '<th>재원</th><th>전표일자</th><th>비고</th><th>차변금액</th><th>대변금액</th><th>잔액</th>', body, false);
    }

    // 총계정상세 (원본 dw_cdt 'flag') : 체크 → 전체 계정, 해제 → 집계내역에서 고른 계정으로 상세내역 조회
    // 원본 dw_cdt itemchanged 'allchk'
    //   체크   : 계정 · 항 · 구분 모두 전체로 상세내역(tab2) 조회 + tab2 로 이동
    //   해제   : 집계내역 왼쪽 현재 계정 + 오른쪽 현재 항으로 tab2 다시 조회 (탭은 그대로)
    applyTotalFlag(checked) {
     let _this = this;
     if (checked) {
      _this.tab2Key = {acccd: '', it1cd: '', tiosec: ''};
      _this.tab2Name = '상세 내역';
     } else {
      const acc = _this.accGrid1.selectedItems[0];
      const it = _this.itemGrid1.selectedItems[0];
      const item = (it && !it._hdr) ? it : null;
      _this.tab2Key = {acccd: acc ? (acc.acccd || '') : '', it1cd: item ? (item.it1cd || '') : '', tiosec: ''};
      _this.tab2Name = acc ? ((acc.accnm || '') + (item ? ' - ' + (item.it1nm || '') : '')) : '상세 내역';
     }
     $('#tab2Link').text(_this.tab2Name).attr('title', _this.tab2Name);
     if (checked) _this.activateTab(2);
     _this.searchItemDetail();
    }

    // 탭별 메인 조회 라우터
    // 원본 ue_retrieve : 1·2 탭 → 집계 다시 조회 후 1탭 / 3 탭 → 상세내역에서 고른 행 / 4 탭 → 사업별 / 5 탭 → 4탭에서 고른 행
    searchMainData(tabNo) {
     tabNo = tabNo || 1;
     // 계정과목 코드는 있는데 이름이 비면 원본처럼 막는다
     if ($('#acccd').val() && !$('#accnm').val().trim()) {
      Alert.alert('확인', '계정과목이 올바르지 않습니다.');
      return;
     }
     if (tabNo === 1 || tabNo === 2) {
      if (tabNo === 2) this.activateTab(1);
      this.searchSummary();
     } else if (tabNo === 3) {
      const cur = this.itemDetailGrid.selectedItems[0];
      if (cur && cur._kind === 'd') this.tab3Key = {acccd: cur.acccd, it1cd: cur.it1cd, tiosec: cur.tiosec || '', frdate: cur.frdate, todate: cur.todate};
      this.searchDetailData();
     }
    }

      headersVisibility: wijmo.grid.HeadersVisibility.Column, autoGenerateColumns: false,

       {binding: 'acccd', header: '관코드', width: 100, align: 'center'},

    // ============================================================
    // 재원 팝업 (필요시)

       return;
      }

     let _this = this;

      }
     }, 50);
     _this.mssecGrid.hostElement.addEventListener('dblclick', sel);
     _this.mssecGrid.hostElement.addEventListener('keydown', function (e) {

    // ============================================================
    // 전표 팝업 (사업별입출현황 전표 팝업 이식 · 관항별원장 응답구조에 맞춤)
    // ============================================================
    openSlipPopup(item) {
     let _this = this;
     if (_this.slipPopup) {
      _this.slipPopup.close();
      _this.slipPopup = null;
     }

     let content = tmpl('slipPopupTemplate', {});
     _this.slipPopup = new PopupDraggable('전표');
     _this.slipPopup.open({width: 1130, height: 670, $content: $(content)});

     _this.slipDetailGrid = new wijmo.grid.FlexGrid('#SlipDetailGrid', {
      isReadOnly: true, headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false, selectionMode: wijmo.grid.SelectionMode.Row,
      columns: [
       {binding: 'acccd', header: '코드', width: 70, align: 'center'},
       {binding: 'accnm', header: '관명(계정)', width: 150, align: 'left'},
       {binding: 'drcrnm', header: '차대', width: 60, align: 'center'},
       {binding: 'it1nm', header: '항', width: 130, align: 'left'},
       {binding: 'it2nm', header: '목', width: 130, align: 'left'},
       {binding: 'summy', header: '산출내역', width: '*', align: 'left'},
       {binding: 'dramt', header: '차변금액', width: 110, align: 'right', format: 'n0'},
       {binding: 'cramt', header: '대변금액', width: 110, align: 'right', format: 'n0'},
      ],
      itemsSource: new wijmo.collections.CollectionView([]),
     });
     _this.slipDetailGrid.columnFooters.rows.push(new wijmo.grid.GroupRow());
     ['dramt', 'cramt'].forEach(b => {
      const col = _this.slipDetailGrid.columns.getColumn(b);
      if (col) col.aggregate = wijmo.Aggregate.Sum;
     });
     _this.loadSlipDetail(item);
    }

    loadSlipDetail(item) {
     let _this = this;
     // tab3 상세행 : 전표번호는 spnum, 없으면 slipno 순으로 사용
     let spnum = item.spnum || item.slipno || '';
     let data = {
      yymmdd: item.yymmdd || '',
      spnum: spnum,
      slipno: spnum,
      acccd: item.acccd || ''
     };
     AjaxUtil.getAsyncData(_this.url + '/readSlip', data, function (res) {
      if (!res || !res.success) {
       Alert.alert('', '전표 조회 결과가 없습니다.');
       return;
      }
      _this.bindSlipPopup(res.data || {});
     });
    }

    fmtDateTime(v) {
     if (!v) return '';
     let s = String(v).trim();
     s = s.replace('T', ' ');
     let m = s.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
     if (m) return m[1];
     let d = s.match(/^(\d{4})(\d{2})(\d{2})(\d{2})?(\d{2})?(\d{2})?/);
     if (d) {
      let out = d[1] + '-' + d[2] + '-' + d[3];
      if (d[4]) out += ' ' + d[4] + ':' + (d[5] || '00') + ':' + (d[6] || '00');
      return out;
     }
     return s.substring(0, 19);
    }

    bindSlipPopup(data) {
     let _this = this;
     // 관항별원장 응답 구조 대응 : {head, lines} 또는 평면(head==data) / lines|details
     const h = data.head || data || {};
     const lines = data.lines || data.details || [];
     const first = lines.length > 0 ? lines[0] : {};

     const setV = (id, v) => {
      const $e = $('#' + id);
      if ($e.length) $e.val(v == null ? '' : v);
     };

     // 헤더 (필드명 폴백으로 다양한 응답 형태 흡수)
     const yymmdd = h.spdate || h.yymmdd || '';
     setV('sp_yymmdd', String(yymmdd).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3'));
     setV('sp_slipno', h.spnum || h.slipno || '');
     setV('sp_tiosecnm', h.tiosecnm || h.tiosec || '');
     setV('sp_inserdt', h.regdate || h.inserdt || '');
     setV('sp_buiscd', h.busipurnm || h.busipur || h.buiscd || '');
     setV('sp_spoccu', h.spoccunm || h.spoccu || '');
     setV('sp_updatedt', _this.fmtDateTime(h.inputdate || h.updatedt));
     setV('sp_title', h.subject || h.title || '');
     setV('sp_busim', h.businm || h.busim || '');
     setV('sp_orgnm', h.spjangnm || h.orgnm || '');
     setV('sp_remark', h.remark || '');
     const $cash = $('#sp_cashyn');
     if ($cash.length) $cash.prop('checked', (h.cashyn === '1' || h.cashyn === 'Y' || h.cashyn === true));

     // 푸터 (첫 분개행 기준)
     setV('sp_custnm', first.cltnm || first.custnm || '');
     setV('sp_acctno', first.accnum || first.acctno || '');
     setV('sp_msseccd', first.mssec || first.msseccd || '');
     setV('sp_cardnm', first.cardnm || '');
     setV('sp_mssecnm', first.mssecnm || '');
     setV('sp_acctno2', first.banknm || '');

     if (_this.slipDetailGrid) {
      _this.slipDetailGrid.itemsSource = new wijmo.collections.CollectionView(lines);
     }
    }

    _toDate(v) {
     if (!v) return '';
     let s = String(v).replace(/[^0-9]/g, '');
     if (s.length !== 8) return v;
     return s.slice(0, 4) + '-' + s.slice(4, 6) + '-' + s.slice(6, 8);
    }

   }//CategoryItemLedgerPage

   function getActiveTabNo() {
    let $active = $('.tab-item.active');
    if (!$active.length) $active = $('.tab-item:visible').first();
    let id = ($active.attr('id') || 'tab1').replace('tab', '');
    let no = parseInt(id, 10);
    return isNaN(no) ? 1 : no;
   }

   let page = null;

   $(document).ready(function (e) {
    page = new CategoryItemLedgerPage();

    // 원본 : 올해 1월 1일 ~ 오늘
    let fr = new Date();
    fr = new Date(fr.getFullYear(), 0, 1);
    $('#searchfrdate').val(CommonUtil.formatYYYYMMDD(fr));
    $('#searchtodate').val(getNowDate());
    AjaxUtil.fillSelectOptions($('#mssec'), 'mssec', 'all', false);

    $('#btnSearch').on('click', function () {
     page.searchMainData(getActiveTabNo());
    });

    $('#accnm').on('keydown', function (ev) {
     if (ev.key === 'Enter') {
      ev.preventDefault();
      page.searchAccnm(1);
     }
    });
    // 원본 dw_cdt 항 (it1cd / it1nm)
    $('#it1nm').on('keydown', function (ev) {
     if (ev.key === 'Enter') {
      ev.preventDefault();
      page.searchIt1nm('');
     }
    });
    $('#it1nm').on('input', function () {
     if ($(this).val() === '') $('#it1cd').val('');
    });
    $('#accnm').on('input', function () {
     if ($(this).val() === '') $('#acccd').val('');
    });

    $('#btnPrint').on('click', function () {
     page.print();
    });

    $('#chkTotal').on('change', function () {
     page.applyTotalFlag($(this).is(':checked'));
    });

    // 조회줄은 하나지만 다른 원장 화면처럼 각 탭 안 맨 위에 보이도록 옮긴다
    $('.tab-links a').on('click', function () {
     const $t = $($(this).attr('href'));
     if ($t.length) $t.prepend($('#cdtBox'));
     // 원본 selectionchanged CASE 3 : 상세내역 탭을 누르면 상세내역(tab2) 현재 행으로 조회
     if ($(this).attr('href') === '#tab3') page.searchMainData(3);
    });

    page.searchMainData(1);

    $(document).on('keydown', function (ev) {
     if (ev.key === 'F4') {
      ev.preventDefault();
      page.searchMainData(getActiveTabNo());
     }
    });
   });
  </script>
