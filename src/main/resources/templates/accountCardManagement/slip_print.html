<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>전표 출력</title>
  <!--
    전표 출력 양식 — 원본 파워빌더 DataWindow 기준
      1 전표(산출내역)          d_aa009_bill2_og01 (결재란 위)
      7 전표(산출내역):하단결재  같은 본문, 결재란 아래
      2 결의양식1               d_aa009_bill3  지출결의서
      3 결의양식2(하단)         d_aa009_bill4  결재란 아래
      4 결의양식2(상단)         d_aa009_bill5  결재란 위
      5 결의양식3(세입세출)     d_aa009_bill6  7·5·3 계정 + 1360 명세
      6 결의양식3(대체)         d_aa009_bill7  7·5 외 계정 명세
      9 결의양식3(전체)         d_aa009_bill10 전체 줄 명세
      8 지출결의서(한자)        d_aa009_bill9  (문서양식 경리3)
    PDF(openhtmltopdf)에서도 깨지지 않도록 flex · writing-mode · CSS 변수를 쓰지 않고 표로만 짠다.
    받는 값: slipList, printType, fontSize, approverList, approverInput
  -->
  <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Malgun Gothic', 'Noto Sans KR', sans-serif; background: #f0f2f5; color: #000; }
      #preview { padding: 20px 0; }

      .doc-page {
          width: 210mm; min-height: 297mm; margin: 0 auto 24px;
          background: #fff; border: 1px solid #ccc; box-shadow: 0 2px 12px rgba(0,0,0,.1);
          padding: 10mm 12mm; page-break-after: always;
      }
      .doc-page:last-child { page-break-after: auto; }

      /* 글자 크기 · 줄 간격 기본값 — 미리보기 [글자] 선택(fontSize)이 아래에서 덮어쓴다 */
      .doc-page, .doc-page td, .doc-page th, .doc-page div, .doc-page span { font-size: 12px; line-height: 1.35; }
      .doc-page .ttl  { font-size: 24px; font-weight: 700; letter-spacing: 10px; }
      .doc-page .ttl2 { font-size: 18px; font-weight: 700; }

      table.f { width: 100%; border-collapse: collapse; table-layout: fixed; }
      table.f td, table.f th { border: 1px solid #000; padding: 3px 6px; vertical-align: middle; word-break: break-all; font-weight: 400; }
      table.f tr { page-break-inside: avoid; }
      table.out { border: 1.5px solid #000; }
      .c { text-align: center; } .r { text-align: right; white-space: nowrap; } .l { text-align: left; }
      .top { vertical-align: top !important; }
      .lbl { text-align: center; letter-spacing: 4px; }
      .pre { white-space: pre-wrap; }
      table.f td.nb, table.f.nb td, .nb { border: none; }
      .org { font-size: 14px !important; font-weight: 700; margin-top: 4px; }

      /* 결재란 — 수정 전 디자인 (환경설정 결재라인 : 전결 junchk · 사선 crolin) */
      .apv-mark { position: relative; text-align: center; vertical-align: middle; }
      .apv-mark .apv-jun { display: inline-block; margin-top: 4px; font-size: 11px; font-weight: 700; }
      .apv-cro { background: linear-gradient(to top right, transparent calc(50% - 0.6px), #333 50%, transparent calc(50% + 0.6px)); }
      /* 결의서용 : 칸 100px, 회색 머리 */
      table.apv-old { border-collapse: collapse; }
      table.apv-old td { border: 1px solid #333; text-align: center; padding: 0; width: 100px; }
      table.apv-old .h { background: #f0f0f0; border-bottom: 1px solid #333; padding: 3px 14px; font-size: 10px; font-weight: 700; white-space: nowrap; }
      table.apv-old .b { height: 16mm; width: 100px; }
      /* 전표(산출내역)용 : 오른쪽 위 작은 칸 */
      table.lg-apv { float: right; border-collapse: collapse; margin: 0 0 6px 12px; }
      table.lg-apv td { border: 1px solid #000; width: 64px; padding: 0; text-align: center; vertical-align: top; }
      table.lg-apv .h { border-bottom: 1px solid #000; padding: 3px 2px; font-size: 10px; white-space: nowrap; overflow: hidden; }
      table.lg-apv .b { height: 56px; }

      /* 전표(산출내역) */
      .doc-page .og-title { font-size: 30px; font-weight: 400; letter-spacing: 2px; margin: 10px 0 8px 30px; }
      /* 머리 표(테두리 없음) 안에 들어간 결재란도 테두리를 유지 */
      .doc-page .og-head table.lg-apv { float: none; margin: 0; }
      .doc-page table.lg-apv td { border: 1px solid #000 !important; padding: 0 !important; }
      .og-sub { font-size: 10px !important; }

      @page { size: A4; margin: 0; }
      @media print {
          body { background: #fff; }
          #preview { padding: 0; }
          .doc-page { border: none; box-shadow: none; margin: 0; min-height: auto; padding: 8mm 10mm; }
          * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
  </style>
  <style th:if="${fontSize != null}"
         th:utext="'.doc-page, .doc-page td, .doc-page th, .doc-page div, .doc-page span { font-size: ' + ${fontSize} + 'px; }'
                 + ' .doc-page .ttl, .doc-page .og-title { font-size: ' + ${fontSize * 2} + 'px; }'
                 + ' .doc-page .ttl2 { font-size: ' + ${fontSize * 3 / 2} + 'px; }'"></style>
</head>
<body>

<!-- ── 공통 조각 (화면에는 안 찍힌다) ───────────────────── -->
<th:block th:if="${false}">
  <!-- 결재란 : 결의서용 (수정 전 디자인) -->
  <table th:fragment="apvWide" class="apv-old">
    <tr><td th:each="apv : ${approverList}"><div class="h" th:text="${apv.name}"></div>
      <div class="b apv-mark" th:classappend="${apv.cro} ? 'apv-cro'"><span class="apv-jun" th:if="${apv.jun}">전결</span></div></td></tr>
  </table>
  <!-- 결재란 : 전표(산출내역) 오른쪽 위 (수정 전 디자인) -->
  <table th:fragment="apvSmall" class="lg-apv">
    <tr><td th:each="apv : ${approverList}"><div class="h" th:text="${apv.name}"></div>
      <div class="b apv-mark" th:classappend="${apv.cro} ? 'apv-cro'"><span class="apv-jun" th:if="${apv.jun}">전결</span></div></td></tr>
  </table>
</th:block>

<div id="preview">
  <th:block th:each="slip, st : ${slipList}">

    <!-- ═══════════ 1 · 7 : 전표(산출내역) ─ d_aa009_bill2_og01 ═══════════ -->
    <!-- 한 장에 12줄. 넘치면 다음 장에 머리(표제 · 일자 · 표 머리)를 다시 찍는다. 합계 · 비고 · 하단결재는 마지막 장에만 -->
    <th:block th:if="${printType == '1' or printType == '7'}">
      <div class="doc-page" th:each="pg : ${slip.pages}">
        <table class="f nb"><tr>
          <td class="l" th:text="'[' + ${slip.spjangnm} + ']'"></td>
          <td class="r" th:text="'페이지 : ' + ${pg.no} + ' (' + ${slip.pageCount} + ')'"></td>
        </tr></table>

        <div style="border:1.5px solid #000; padding:8px 10px 10px;">
          <!-- 머리 : 왼쪽 표제(세입 · 세출 · 대체전표) + 일자, 그 오른쪽에 결재란 (원본 출력) -->
          <table class="f nb og-head"><tr>
            <td style="width:40%; vertical-align:top;">
              <div class="og-title" th:text="${slip.tiosec == '1'} ? '세입전표' : (${slip.tiosec == '2'} ? '세출전표' : '대체전표')"></div>
              <div th:text="'전 표 일 자 : ' + ${slip.spdate} + ' / ' + ${slip.spnum}"></div>
              <div th:text="'작 성 일 자 : ' + ${slip.dReg}"></div>
            </td>
            <td style="vertical-align:top;">
              <th:block th:if="${printType == '1'}"><table th:replace="~{::apvSmall}"></table></th:block>
            </td>
          </tr></table>

          <table class="f nb" style="margin-top:10px;"><tr>
            <td th:text="'제&#160;&#160;&#160;&#160;&#160;&#160;목 : ' + ${slip.subject}"></td>
            <td class="r" style="width:35%;" th:text="'증 빙 구 분 : ' + ${slip.spoccu}"></td>
          </tr></table>

          <table class="f" style="margin-top:4px;">
            <colgroup><col style="width:8%"/><col style="width:17%"/><col style="width:22%"/><col style="width:16%"/>
              <col style="width:7%"/><col style="width:15%"/><col style="width:15%"/></colgroup>
            <tr><th class="c" rowspan="2">구분</th><th class="c lbl" colspan="4">과 목</th><th class="c" rowspan="2">차변</th><th class="c" rowspan="2">대변</th></tr>
            <tr><th class="c">관</th><th class="c">항</th><th class="c">목</th><th class="c">재원</th></tr>
            <th:block th:each="d : ${pg.lines}">
              <tr>
                <td class="c" rowspan="2" th:text="${d.upnm}"></td>
                <td rowspan="2" th:text="${d.accnm}"></td>
                <td th:text="${d.it1nm}"></td>
                <td rowspan="2" th:text="${d.it2nm}"></td>
                <td class="c og-sub" th:text="${d.mssec}"></td>
                <td class="r" th:text="${d.side == 'D'} ? ${#numbers.formatInteger(d.dramt, 1, 'COMMA')} : '0'"></td>
                <td class="r" th:text="${d.side == 'C'} ? ${#numbers.formatInteger(d.cramt, 1, 'COMMA')} : '0'"></td>
              </tr>
              <tr>
                <td class="og-sub" th:text="${d.sub}"></td><!-- 그 줄의 카드, 없으면 계좌 -->
                <td colspan="3" class="og-sub pre" th:text="${d.summy}"></td>
              </tr>
            </th:block>
            <tr th:if="${pg.last}">
              <td class="c lbl" colspan="5">합 계</td>
              <td class="r" th:text="${#numbers.formatInteger(slip.amt, 1, 'COMMA')}"></td>
              <td class="r" th:text="${#numbers.formatInteger(slip.amt, 1, 'COMMA')}"></td>
            </tr>
          </table>

          <!-- 합계 아래 : 비고만 (원본) -->
          <div th:if="${pg.last}" class="pre" style="padding:4px 2px 0; min-height:30px;" th:text="${slip.remark}"></div>

          <div th:if="${printType == '7' and pg.last}" style="margin-top:10px; overflow:hidden;"><table th:replace="~{::apvSmall}"></table></div>
        </div>
      </div>
    </th:block>

    <!-- ═══════════ 2 : 결의양식1 ─ d_aa009_bill3 지출결의서 ═══════════ -->
    <div class="doc-page" th:if="${printType == '2'}">
      <div class="c" style="margin-bottom:4px;"><span class="ttl" style="border:1.5px solid #000; padding:2px 24px;">지 출 결 의 서</span></div>
      <div class="r ttl2" style="margin-bottom:4px;" th:text="'[ ' + ${slip.mssec} + ' ]'"></div>

      <table class="f out">
        <colgroup><col style="width:15%"/><col style="width:9%"/><col style="width:24%"/><col style="width:6%"/><col style="width:24%"/><col style="width:22%"/></colgroup>
        <tr style="height:8mm;">
          <!-- 왼쪽 : 일금(한자, 세로) · 원정 -->
          <td rowspan="10" class="c top" style="padding:6px 2px;">
            <div>일<br/>금</div>
            <div class="pre" style="margin:4px 0; font-size:14px; line-height:1.15;" th:text="${slip.amtHanja}"></div>
            <div>원<br/>정</div>
            <div style="border-top:1px solid #000; margin-top:6px; padding-top:4px;" th:text="${#numbers.formatInteger(slip.amt, 1, 'COMMA')}"></div>
          </td>
          <td colspan="4" class="c" th:text="${slip.book}"></td>
          <!-- 오른쪽 : 결재란 세로 (원본 d_confirm_002) -->
          <td rowspan="12" class="top" style="padding:0;">
            <table style="width:100%; border-collapse:collapse;">
              <th:block th:each="apv, apvStat : ${approverList}">
                <tr><td th:style="'text-align:center; font-size:9px; padding:3px; background:#f0f0f0; font-weight:700; border:none;' + (!apvStat.last ? 'border-bottom:1px solid #555;' : '')" th:text="${apv.name}"></td></tr>
                <tr><td class="apv-mark" th:classappend="${apv.cro} ? 'apv-cro'" th:style="'height:40mm; border:none;' + (!apvStat.last ? 'border-bottom:1px solid #555;' : '')"><span class="apv-jun" th:if="${apv.jun}">전결</span></td></tr>
              </th:block>
            </table>
          </td>
        </tr>
        <tr style="height:8mm;"><td rowspan="3" class="c">과<br/>목</td><td colspan="3" th:text="${slip.head.accnm}"></td></tr>
        <tr style="height:8mm;"><td colspan="3" th:text="${slip.head.it1nm}"></td></tr>
        <tr style="height:8mm;">
          <td colspan="3" style="padding:0;"><table class="f"><tr style="height:8mm;">
            <td class="c" style="width:12%; border-width:0 1px 0 0;">차<br/>변</td>
            <td style="width:38%; border-width:0 1px 0 0;" th:text="${slip.headDrcr == '1' or slip.headDrcr == 'D'} ? ${slip.head.it2nm} : ''"></td>
            <td class="c" style="width:12%; border-width:0 1px 0 0;">대<br/>변</td>
            <td style="border-width:0;" th:text="${slip.headDrcr == '2' or slip.headDrcr == 'C'} ? ${slip.head.it2nm} : ''"></td>
          </tr></table></td>
        </tr>
        <tr style="height:8mm;"><td class="c lbl">발의</td><td colspan="3" class="c" th:text="${slip.dSp}"></td></tr>
        <tr style="height:8mm;"><td class="c" th:text="${slip.tiosec == '1'} ? '수입일' : '지출일'"></td><td colspan="3" class="c" th:text="${slip.dReg}"></td></tr>
        <tr style="height:8mm;"><td class="c">기장필</td><td class="c" th:text="${slip.dSp}"></td><td class="c">번호</td><td class="c" th:text="${slip.spnum}"></td></tr>
        <tr style="height:8mm;"><td class="c">사업명</td><td colspan="3" th:text="${slip.businm}"></td></tr>
        <tr style="height:8mm;"><td></td><td colspan="3" th:text="${slip.cardText}"></td></tr>
        <tr style="height:8mm;"><td></td><td colspan="3" th:text="${slip.bankText}"></td></tr>
        <tr><td class="c">거래처</td><td colspan="4" class="c lbl">적 요</td></tr>
        <tr style="height:95mm;">
          <td class="top" th:text="${slip.cltnm}"></td>
          <td colspan="4" class="top pre" th:text="${slip.remarkText}"></td>
        </tr>
        <!-- 하단 : 증빙 문구 + 감사 칸 (원본 d_aa009_bill3) -->
        <tr><td colspan="3" rowspan="2" style="padding:10px 8px;" class="top">상기 금액의 지출 증빙서는 이 면에 첨부합니다.</td>
          <td colspan="2" class="c lbl">감 사</td>
          <td class="c" style="font-weight:700; letter-spacing:4px;">관리번호</td></tr>
        <tr style="height:14mm;"><td colspan="2"></td><td class="c" th:text="${slip.setnum}"></td></tr>
      </table>
      <div class="org c" th:text="${slip.spjangnm}"></div>
    </div>

    <!-- ═══════════ 3 · 4 : 결의양식2 ─ d_aa009_bill4(결재란 아래) / bill5(결재란 위) ═══════════ -->
    <div class="doc-page" th:if="${printType == '3' or printType == '4'}">
      <div th:if="${printType == '4'}" style="margin-bottom:10px;"><table th:replace="~{::apvWide}"></table></div>

      <table class="f nb"><tr>
        <td style="width:38%; padding:0;"><div class="ttl c" style="border:1.5px solid #000; border-bottom:none; padding:4px 0;" th:text="${slip.tiosec == '1'} ? '수 입 결 의 서' : '지 출 결 의 서'"></div></td>
        <td></td>
        <td style="width:36%; padding:0;"><table class="f" style="border:1.5px solid #000; border-bottom:none;"><tr>
          <td class="c lbl" style="width:36%;">재원</td><td class="ttl2" th:text="${slip.mssec}"></td></tr></table></td>
      </tr></table>

      <table class="f out">
        <colgroup><col style="width:9%"/><col style="width:9%"/><col style="width:46%"/><col style="width:12%"/><col style="width:24%"/></colgroup>
        <tr>
          <td colspan="3" class="c" th:text="${slip.book}"></td>
          <td class="c"><i>No.</i></td>
          <!-- bill4 : setnum / bill5 : setnum 없으면 spnum -->
          <td th:text="${printType == '4'} ? ${slip.no} : ${slip.setnum}"></td>
        </tr>
        <tr><td rowspan="3" class="c">과<br/>목</td><td class="c">관</td><td th:text="${slip.head.accnm}"></td>
          <td class="c lbl">발의</td><td th:text="${slip.dSp}"></td></tr>
        <tr><td class="c">항</td><td th:text="${slip.head.it1nm}"></td>
          <td class="c lbl" th:text="${slip.tiosec == '1'} ? '수입' : '지출'"></td><td th:text="${slip.dSp}"></td></tr>
        <tr><td class="c">목</td><td th:text="${slip.head.it2nm}"></td>
          <td class="c lbl">기장</td><td th:text="${slip.dSp}"></td></tr>
        <tr style="height:12mm;">
          <td colspan="3" class="ttl2" style="font-weight:400; border-right:none;" th:text="'일 금  ' + ${slip.amtKorean} + ' 원정'"></td>
          <td colspan="2" class="r ttl2" style="font-weight:400; border-left:none;" th:text="'( ' + ${#numbers.formatInteger(slip.amt, 1, 'COMMA')} + ' )'"></td>
        </tr>
        <tr>
          <td class="c">내<br/><br/><br/><br/><br/>역</td>
          <td colspan="4" class="top" style="padding:0;">
            <div class="pre" style="height:90mm; padding:4px 6px; overflow:hidden;" th:text="${slip.remarkText}"></div>
          </td>
        </tr>
        <tr style="height:26mm;"><td class="c">비<br/><br/>고</td><td colspan="4"></td></tr>
      </table>
      <div class="org c" th:text="${slip.spjangnm}"></div>

      <div th:if="${printType == '3'}" style="margin-top:8px;"><table th:replace="~{::apvWide}"></table></div>
    </div>

    <!-- ═══════════ 5 · 6 · 9 : 결의양식3 ─ d_aa009_bill6 / bill7 / bill10 (원본 출력 기준) ═══════════ -->
    <div class="doc-page" th:if="${printType == '5' or printType == '6' or printType == '9'}">
      <div style="margin-bottom:10px;"><table th:replace="~{::apvWide}"></table></div>

      <!-- 표제 : 왼쪽 상자만 (원본 출력에는 재원 상자가 찍히지 않는다) -->
      <table class="f nb"><tr>
        <td style="width:38%; padding:0;"><div class="ttl c" style="border:1.5px solid #000; border-bottom:none; padding:4px 0;"
                                               th:text="${slip.tiosec == '1'} ? '수 입 결 의 서' : (${slip.tiosec == '2'} ? '지 출 결 의 서' : '대 체 결 의 서')"></div></td>
        <td></td>
      </tr></table>

      <table class="f out">
        <colgroup><col style="width:8%"/><col style="width:8%"/><col style="width:41%"/><col style="width:11%"/><col style="width:10%"/><col style="width:22%"/></colgroup>
        <!-- 「○○년도 세출부」 | 전표번호 | 관리번호 -->
        <tr style="height:8mm;"><td colspan="3" style="font-weight:700;" th:text="${slip.book}"></td>
          <td colspan="2" class="c" th:text="${slip.spnum}"></td><td th:text="${slip.setnum}"></td></tr>
        <tr style="height:8mm;"><td rowspan="2" class="c" style="font-weight:700;">과<br/>목</td><td class="c" style="font-weight:700;">관</td><td colspan="2" th:text="${slip.head.accnm}"></td>
          <td class="c lbl" style="font-weight:700;">기장</td><td class="c" th:text="${slip.dSp}"></td></tr>
        <tr style="height:8mm;"><td class="c" style="font-weight:700;">항</td><td colspan="2" th:text="${slip.head.it1nm}"></td>
          <td class="c lbl" style="font-weight:700;" th:text="${slip.tiosec == '1'} ? '수입' : '지출'"></td><td class="c" th:text="${slip.dReg}"></td></tr>
        <tr style="height:8mm;"><td colspan="2" class="c lbl" style="font-weight:700;">제목</td><td colspan="4" style="font-weight:700;" th:text="${slip.subject}"></td></tr>
        <tr style="height:8mm;">
          <td colspan="2" class="c lbl" style="font-weight:700;">일금</td>
          <td colspan="2" style="font-weight:700; border-right:none;" th:text="${slip.amtKorean} + ' 원정'"></td>
          <td colspan="2" class="r" style="font-weight:700; border-left:none;" th:text="'( ' + ${#numbers.formatInteger(slip.amt, 1, 'COMMA')} + ' )'"></td>
        </tr>
        <tr style="height:55mm;"><td colspan="1" class="c lbl" style="font-size:16px !important;">비<br/><br/>고</td><td colspan="5" class="top pre" th:text="${slip.remarkText}"></td></tr>
        <!-- 원본 출력에서는 안내 문구가 찍히지 않고 빈 줄만 남는다 -->
        <tr style="height:6mm;"><td colspan="6"></td></tr>
      </table>

      <table class="f out" style="border-top:none;">
        <colgroup><col style="width:10%"/><col style="width:18%"/><col style="width:31%"/><col style="width:14%"/><col style="width:15%"/><col style="width:12%"/></colgroup>
        <tr><th class="c lbl">재원</th><th class="c lbl">항목</th><th class="c lbl">내역</th><th class="c lbl">금액</th><th class="c lbl">지급처</th><th class="c">결제방법</th></tr>
        <tr th:each="d : ${slip.lines}" style="height:8mm;">
          <td class="c" th:text="${d.mssec}"></td>
          <td th:text="${d.it2nm}"></td>
          <td class="pre" th:text="${d.summy}"></td>
          <td class="r" th:text="${#numbers.formatInteger(d.amt, 1, 'COMMA')}"></td>
          <td th:text="${d.cltnm}"></td>
          <td class="c" th:text="${d.pay}"></td>
        </tr>
        <tr><td colspan="3" class="c lbl">계</td><td class="r" th:text="${#numbers.formatInteger(slip.amt, 1, 'COMMA')}"></td><td colspan="2"></td></tr>
      </table>
      <div class="org c" style="margin-top:14px; font-size:16px !important;" th:text="${slip.spjangnm}"></div>
    </div>

    <!-- ═══════════ 8 : 지출결의서(한자) ─ d_aa009_bill9 (문서양식 경리3) ═══════════ -->
    <div class="doc-page" th:if="${printType == '8'}">
      <div class="r ttl2" style="margin-bottom:4px; font-weight:400;">(문서양식 경리3)</div>
      <table class="f out">
        <colgroup><col style="width:10%"/><col style="width:10%"/><col style="width:10%"/><col style="width:10%"/><col style="width:10%"/>
          <col style="width:10%"/><col style="width:10%"/><col style="width:10%"/><col style="width:10%"/><col style="width:10%"/></colgroup>
        <tr><td colspan="10" class="c ttl" style="padding:8px 0;">支 出 決 議 書</td></tr>
        <tr><td colspan="6" th:text="${slip.yyyy} + ' 年度  歲出部'"></td><td class="c"><i>No.</i></td><td colspan="3" th:text="${slip.spnum}"></td></tr>
        <tr><td rowspan="3" class="c">科<br/><br/>目</td><td class="c">款</td><td colspan="4" th:text="${slip.head.accnm}"></td><td class="c lbl">發議</td><td colspan="3" th:text="${slip.dSp}"></td></tr>
        <tr><td class="c">項</td><td colspan="4" th:text="${slip.head.it1nm}"></td><td class="c lbl">支出</td><td colspan="3" th:text="${slip.dSp}"></td></tr>
        <tr><td class="c">目</td><td colspan="4" th:text="${slip.head.it2nm}"></td><td class="c lbl">記帳</td><td colspan="3" th:text="${slip.dSp}"></td></tr>

        <!-- 결재란 : 원본 고정(擔當 · 課長 · 事務局長 · 專務理事(사선 · 전결) · 會長). 미리보기에서 직접 입력하면 그 값 -->
        <th:block th:unless="${approverInput}">
          <tr><td colspan="2" class="c lbl">擔當</td><td colspan="2" class="c lbl">課長</td><td colspan="2" class="c lbl">事務局長</td><td colspan="2" class="c lbl">專務理事</td><td colspan="2" class="c lbl">會長</td></tr>
          <tr style="height:22mm;"><td colspan="2"></td><td colspan="2"></td><td colspan="2"></td>
            <td colspan="2" class="apv-cro c" style="vertical-align:bottom;">전 결</td><td colspan="2"></td></tr>
        </th:block>
        <tr th:if="${approverInput}"><td colspan="10" style="padding:0;"><table th:replace="~{::apvWide}"></table></td></tr>

        <tr style="height:11mm;"><td colspan="2" class="c lbl">一金</td>
          <td colspan="8" th:text="${slip.amtHanjaFlat} + ' 원整 ( ' + ${#numbers.formatInteger(slip.amt, 1, 'COMMA')} + ' )'"></td></tr>
        <tr style="height:85mm;"><td class="c">內<br/><br/><br/><br/>譯</td><td colspan="9" class="top pre" th:text="${slip.remarkText}"></td></tr>
        <tr style="height:30mm;">
          <td class="c">領收</td>
          <td colspan="5" class="c">
            <div>上記 金額을 正히 領收함.</div>
            <div style="margin:6px 0;" th:text="${slip.dSp}"></div>
            <div class="r">㊞</div>
          </td>
          <td class="c">備考</td><td colspan="3"></td>
        </tr>
      </table>
      <div class="org" th:text="${slip.spjangnm}"></div>
    </div>

  </th:block>
</div>
</body>
</html>
