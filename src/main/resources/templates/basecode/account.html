<html layout:decorate="~{layout_page}">
<th:block layout:fragment="content">
  <style>
      /* 급여명세서(payslip)와 같은 잉크·괘선 계열. 공용 .btn 을 쓰지 않는다. */
      :root {
          --ms-ink:   #1B2430;
          --ms-label: #45566A;
          --ms-mute:  #8A99A8;
          --ms-rule:  #CBD3DB;
          --ms-frame: #8A99A8;
          --ms-band:  #EDF1F4;
          --ms-band2: #DCE3E9;
          --ms-value: #24466F;
          --ms-alert: #9E2A20;
      }
      .ms-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
      .ms-top .ms-cdt { display: flex; align-items: center; gap: 6px; }
      .ms-top .ms-cdt label { font-size: 12.5px; color: var(--ms-label); white-space: nowrap; }
      .ms-top .ms-cdt input {
          width: 220px; max-width: none; height: 34px; padding: 0 10px; box-sizing: border-box;
          border: 1px solid #C0CAD3; border-radius: 0; font-size: 13px; color: var(--ms-ink);
      }
      .ms-top .ms-cdt input:focus-visible { outline: 2px solid var(--ms-value); outline-offset: 1px; }
      .ms-actions { margin-left: auto; display: flex; gap: 6px; }

      .ms-btn {
          display: inline-flex; align-items: center; justify-content: center;
          height: 34px; padding: 0 16px; min-width: 0;
          border: 1px solid var(--ms-frame); border-radius: 2px; background: #fff; color: var(--ms-ink);
          font-family: inherit; font-size: 13px; font-weight: 600; letter-spacing: .5px; cursor: pointer; white-space: nowrap;
      }
      .ms-btn:hover { background: var(--ms-band); border-color: var(--ms-value); }
      .ms-btn:focus-visible { outline: 2px solid var(--ms-value); outline-offset: 2px; }
      .ms-btn.solid { background: var(--ms-value); border-color: var(--ms-value); color: #fff; }
      .ms-btn.solid:hover { background: #1D3A5F; }
      .ms-btn.accent { border-color: var(--ms-alert); color: var(--ms-alert); }
      .ms-btn.accent:hover { background: #FBF0EE; }

      .ms-note { font-size: 12px; color: var(--ms-mute); margin: 0 0 6px; }
      .ms-wrap { border: 1px solid var(--ms-rule); background: #fff; overflow: auto; }
      /* 화면 높이를 끝까지 쓴다 — 목록이 남는 높이를 채우고 편집칸은 아래에 붙는다 */
      /* 화면 틀(index)이 아래 푸터와 12px 겹치게 잡혀 있어, 표 아래 페이지 버튼이 가려지지 않도록 여유를 둔다 */
      .layout-contents { padding-bottom: 20px !important; }
      .layout-contents > .section { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-bottom: 0; margin-bottom: 0; }
      .bp-pane.on { display: flex !important; flex-direction: column; flex: 1 1 auto; min-height: 0; }
      .bp-pane > .ms-wrap { flex: 1 1 auto; min-height: 140px; max-height: none !important; }
      .bp-split { flex: 1 1 auto; min-height: 0; }
      .bp-split > .l, .bp-split > .r { display: flex; flex-direction: column; min-height: 0; height: 100%; }
      .bp-split .ms-wrap { flex: 1 1 auto; min-height: 140px; }
      .bp-form { flex: 0 0 auto; }
      table.ms-list { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; font-size: 13px; color: var(--ms-ink); }
      table.ms-list th {
          position: sticky; top: 0; z-index: 1; background: var(--ms-band); color: var(--ms-label);
          font-weight: 600; height: 34px; padding: 0 8px; border-bottom: 1px solid var(--ms-rule);
          border-right: 1px solid var(--ms-rule); text-align: center; white-space: nowrap;
      }
      table.ms-list td { height: 34px; padding: 0; border-bottom: 1px solid #E4E9EE; border-right: 1px solid #E4E9EE; }
      table.ms-list th:last-child, table.ms-list td:last-child { border-right: 0; }
      table.ms-list td.code { text-align: center; color: var(--ms-label); padding: 0 8px; }
      table.ms-list td input {
          width: 100%; max-width: none; height: 33px; padding: 0 8px; box-sizing: border-box;
          border: 0; border-radius: 0; background: transparent; font-size: 13px; color: var(--ms-ink);
      }
      table.ms-list td input.r { text-align: right; }
      table.ms-list td input:focus { outline: 2px solid var(--ms-value); outline-offset: -2px; background: #fff; }
      table.ms-list tr.sel td { background: #EAF1F8; }
      table.ms-list tr.dirty td.code::after { content: ' ●'; color: #8A5A00; font-size: 9px; }
      table.ms-list tr.new td.code { color: var(--ms-mute); font-style: italic; }
      .ms-top .ms-cdt input.yy { width: 70px; text-align: center; }
      .ms-top .ms-cdt select {
          width: 180px; max-width: none; height: 34px; padding: 0 28px 0 10px; box-sizing: border-box;
          border: 1px solid #C0CAD3; border-radius: 0; font-size: 13px; color: var(--ms-ink);
      }
      /* 탭 : 공용 button 스타일(둥근 테두리 · 파란 포커스)을 덮고, 페이지 색(잉크·괘선)에 맞춘 밑줄형 */
      .bp-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--ms-rule); margin: 4px 0 10px; }
      .bp-tabs button {
          height: 36px !important; min-width: 0 !important; padding: 0 22px !important; margin: 0 0 -1px 0 !important;
          border: 0 !important; border-bottom: 2px solid transparent !important; border-radius: 0 !important;
          background: transparent !important; box-shadow: none !important; outline: none;
          color: var(--ms-label) !important; font-size: 13px !important; font-weight: 600 !important; letter-spacing: .5px;
          cursor: pointer; line-height: 1 !important;
      }
      .bp-tabs button:hover { color: var(--ms-ink) !important; background: var(--ms-band) !important; }
      .bp-tabs button.on { color: var(--ms-value) !important; border-bottom-color: var(--ms-value) !important; }
      .bp-tabs button:focus-visible { outline: 2px solid var(--ms-value) !important; outline-offset: -2px; }
      .bp-pane { display: none; }
      .bp-pane.on { display: block; }
      .bp-split { display: flex; gap: 12px; align-items: stretch; }
      .bp-split > .l { flex: 1 1 55%; min-width: 0; }
      .bp-split > .r { flex: 1 1 45%; min-width: 0; }
      .bp-sub { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
      .bp-sub h3 { margin: 0; font-size: 13px; color: var(--ms-label); font-weight: 600; }
      table.ms-list tr[data-i] { cursor: pointer; }
      /* 사업명 · 장소 : 왼쪽 정렬, 길면 줄을 바꿔 다 보이게 (잘리지 않게) */
      table.ms-list td.t {
          padding: 6px 8px; height: auto; text-align: left !important;
          white-space: normal !important; word-break: keep-all; overflow-wrap: anywhere;
          overflow: visible !important; text-overflow: clip !important; line-height: 1.35;
      }
      table.ms-list td.c { text-align: center !important; vertical-align: middle; }
      /* 이월 체크박스 : 칸 가운데 */
      table.ms-list td.c input.bp-native { display: inline-block !important; margin: 0 auto !important; float: none !important; }
      table.ms-list td.r { text-align: right; padding: 0 8px; }

      /* 편집칸 (원본 dw_2) */
      .bp-form { border: 1px solid var(--ms-rule); background: #fff; margin-top: 12px; }
      .bp-form .hd { background: var(--ms-band); border-bottom: 1px solid var(--ms-rule); padding: 8px 12px;
          font-size: 13px; font-weight: 600; color: var(--ms-label); }
      .bp-form .bd { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 16px; padding: 14px 12px; }
      .bp-form .fld label.k { display: block; margin-bottom: 5px; font-size: 12px; font-weight: 600; color: var(--ms-label); }
      .bp-form .fld label.k em { font-style: normal; color: var(--ms-alert); }
      .bp-form .fld.w2 { grid-column: span 2; }
      .bp-form .fld input[type=text], .bp-form .fld input[type=date], .bp-form .fld input[type=number] {
          width: 100%; max-width: none; height: 34px; padding: 0 10px; box-sizing: border-box;
          border: 1px solid #C0CAD3; border-radius: 0; font-size: 13px; color: var(--ms-ink); background: #fff;
      }
      .bp-form .fld input[readonly] { background: var(--ms-band); color: var(--ms-label); }
      .bp-form .fld input:focus-visible { outline: 2px solid var(--ms-value); outline-offset: 1px; }
      .bp-form .yn { display: flex; gap: 16px; height: 34px; align-items: center; }
      .bp-form .yn label, table.ms-list td.yn label { display: inline-flex; align-items: center; gap: 5px; margin: 0; cursor: pointer; font-weight: 400; }

      /* 라디오·체크 — bank_account .ba-type 방식 : 네이티브 모양, 전역 가상요소 제거 */
      .bp-native {
          -webkit-appearance: auto !important; -moz-appearance: auto !important; appearance: auto !important;
          flex: 0 0 16px !important; width: 16px !important; height: 16px !important;
          min-width: 16px !important; max-width: 16px !important; min-height: 16px !important;
          margin: 0 !important; padding: 0 !important; border: 0 !important; border-radius: 0 !important;
          background: none !important; box-shadow: none !important; accent-color: #24466F; vertical-align: middle !important;
      }
      .bp-native::before, .bp-native::after { content: none !important; display: none !important; }
      table.ms-list td input[type=text].cd { text-align: center; }
      /* 표 안 콤보 : 공통 CSS 의 화살표 그림 위치가 칸 폭과 맞지 않아 옆 칸으로 삐져나왔다 →
         브라우저 기본 화살표를 쓰고 칸 안에 가둔다 */
      table.ms-list td:has(> select) { overflow: hidden; }
      table.ms-list td select {
          display: block; width: 100% !important; max-width: 100% !important; min-width: 0 !important;
          height: 33px; padding: 0 4px !important; box-sizing: border-box; margin: 0;
          border: 0; border-radius: 0; background-color: transparent; background-image: none !important;
          -webkit-appearance: menulist !important; -moz-appearance: menulist !important; appearance: auto !important;
          font-size: 13px; color: var(--ms-ink);
      }
      table.ms-list td select:focus { outline: 2px solid var(--ms-value); outline-offset: -2px; background-color: #fff; }
      table.ms-list td.ro { padding: 0 8px; color: var(--ms-label); }
      table.ms-list td.nm { padding: 0 8px; white-space: normal; word-break: keep-all; line-height: 1.3; color: var(--ms-label); }
      .ac-cdt-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--ms-label); cursor: pointer; }
      /* 페이지 이동 */
      .ac-pager { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px;
          padding: 6px 2px 0; font-size: 12.5px; color: var(--ms-label); }
      .ac-pager .pg { display: flex; gap: 4px; align-items: center; }
      .ac-pager .pg button {
          min-width: 30px !important; height: 28px !important; padding: 0 8px !important;
          border: 1px solid var(--ms-rule) !important; border-radius: 2px !important;
          background: #fff !important; color: var(--ms-ink) !important; font-size: 12.5px !important; font-weight: 600 !important;
          box-shadow: none !important; cursor: pointer; line-height: 1 !important;
      }
      .ac-pager .pg button.on { background: var(--ms-value) !important; border-color: var(--ms-value) !important; color: #fff !important; }
      .ac-pager .pg button:disabled { opacity: .4; cursor: default; }
      .ac-pager select { width: 90px; height: 28px; }
      /* Wijmo 그리드 : 남는 높이를 채운다 */
      #acGrid { flex: 1 1 auto; min-height: 200px; border: 1px solid var(--ms-rule); font-size: 13px; }
      #acGrid .wj-colheaders .wj-cell { text-align: center; }
      #acGrid .wj-colheaders .wj-cell.ac-edit-h, #acGrid .wj-colheaders .wj-cell.ac-edit-h * { color: #1F5FBF !important; }
      #acGrid .wj-cell.ac-dirty { background: #FFF8E6; }
      #acGrid .wj-cell.ac-new { background: #EEF6EE; font-style: italic; }
      #acGrid .wj-cell.wj-state-selected, #acGrid .wj-cell.wj-state-multi-selected { background: #DCE8F5; color: #111; }
      #acGrid .wj-cell.ac-ro { color: #45566A; }
      .ac-legend { color: var(--ms-mute); }
      .ac-legend i { color: #3d7a3d; }
      table.ms-list .ms-empty { text-align: center; color: var(--ms-mute); padding: 24px 0; height: auto; }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>계정과목등록</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>기초코드</li>
        <li>계정과목등록</li>
      </ul>
    </div>

    <div class="section">
      <!-- 조회줄 (원본 d_tb_ac001_cdt) -->
      <div class="ms-top">
        <div class="ms-cdt"><label for="acStext">계정검색</label><input id="acStext" maxlength="50" placeholder="코드 또는 계정명" type="text"/></div>
        <div class="ms-cdt"><label for="acDrcr">차대</label>
          <select id="acDrcr" style="width:110px;"><option value="">전체</option><option value="1">차변</option><option value="2">대변</option></select></div>
        <div class="ms-cdt"><label for="acDcpl">대차손익</label>
          <select id="acDcpl" style="width:110px;"><option value="">전체</option><option value="1">대차</option><option value="2">손익</option></select></div>
        <div class="ms-cdt"><label class="ac-cdt-chk"><input class="bp-native" id="acSpyn" type="checkbox"/> 전표계정만</label></div>
        <div class="ms-cdt"><label for="acUseyn">사용</label>
          <select id="acUseyn" style="width:110px;"><option value="">전체</option><option value="1" selected>사용</option><option value="0">미사용</option></select></div>
        <div class="ms-actions">
          <button class="ms-btn solid" id="btnAcSearch" title="조회 (F4)" type="button">조회</button>
          <button class="ms-btn" id="btnAcNew" type="button">신규</button>
          <button class="ms-btn" id="btnAcSave" title="저장 (Ctrl+S)" type="button">저장</button>
          <button class="ms-btn accent" id="btnAcDelete" type="button">삭제</button>
          <button class="ms-btn" id="btnAcPrint" type="button">인쇄</button>
          <button class="ms-btn" id="btnAcExcel" type="button">엑셀</button>
        </div>
      </div>

      <div class="bp-tabs">
        <button class="on" data-tab="1" type="button">계정정보</button>
        <button data-tab="2" type="button">계정및양식명칭수정</button>
        <button data-tab="3" type="button">관리항목관리</button>
        <button data-tab="4" type="button">세입/세출 및 이월 구분</button>
      </div>
      <p class="ms-note" id="acNote">행을 고르고 [신규]를 누르면 그 계정 아래에 같은 설정으로 새 계정이 생깁니다. 표에서 고친 뒤 [저장]을 누르세요.</p>

      <div class="bp-pane on" id="acPane">
        <div id="acGrid"></div>
        <div class="ac-pager"><span id="acCount"></span><span class="ac-legend">● 고친 행 · <i>새 행</i></span></div>
      </div>
    </div>
  </div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   const DRCR = [{v: '1', n: '차변'}, {v: '2', n: '대변'}];
   const DCPL = [{v: '1', n: '대차'}, {v: '2', n: '손익'}];
   const FLAGS = ['spyn', 'useyn', 'i7000', 'cltflag', 'acnflag', 'cardflag', 'divflag', 'ewolyn', 'ipflag', 'chulflag', 'spacc'];
   const nmOf = (list, v) => (list.find(x => x.v === String(v)) || {}).n || (v == null ? '' : v);

   class AccountPage {
    constructor() {
     this.url = '/api/basecode/account';
     this.tab = 1;
     this.spjangnm = '';
     this.cv = new wijmo.collections.CollectionView([]);
     this.cv.filter = r => this.tab !== 4 || String(r.acccd).charAt(0) === '1';   // 원본 d_tb_ac001_6
     this.grid = new wijmo.grid.FlexGrid('#acGrid', {
      itemsSource: this.cv,
      autoGenerateColumns: false,
      selectionMode: wijmo.grid.SelectionMode.Cell,
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      allowSorting: 'MultiColumn',     // 머리글 클릭 정렬 (Ctrl+클릭으로 여러 칸) — 관별원장 등 다른 화면과 같게
      allowAddNew: false, allowDelete: false,
      frozenColumns: 2,
      keyActionEnter: wijmo.grid.KeyAction.MoveDown
     });
     new FlexGridContextMenu(this.grid);
     this.grid.downloadFileName = '계정과목';

     // 고친 행 · 새 행 표시, 읽기 전용 칸 색
     this.grid.formatItem.addHandler((g, e) => {
      if (e.panel === g.columnHeaders) {   // 고칠 수 있는 칸은 머리글 글자를 파랑으로
       wijmo.toggleClass(e.cell, 'ac-edit-h', !g.columns[e.col].isReadOnly);
       return;
      }
      if (e.panel !== g.cells) return;
      const r = g.rows[e.row] && g.rows[e.row].dataItem;
      if (!r) return;
      wijmo.toggleClass(e.cell, 'ac-new', !!r._new);
      wijmo.toggleClass(e.cell, 'ac-dirty', !r._new && !!r._dirty);
      wijmo.toggleClass(e.cell, 'ac-ro', !!g.columns[e.col].isReadOnly);
     });
     // 고치면 표시 + 원본 itemchanged (계정명칭 → 빈 양식명칭)
     this.grid.cellEditEnding.addHandler((g, e) => {
      const r = g.rows[e.row].dataItem, b = g.columns[e.col].binding;
      e.data = r ? r[b] : null;   // 이전 값 기억
     });
     this.grid.cellEditEnded.addHandler((g, e) => {
      const r = g.rows[e.row].dataItem, b = g.columns[e.col].binding;
      if (!r) return;
      if (b === 'accnm' && (!String(r.formnm || '').trim() || r._formAuto)) { r.formnm = String(r.accnm || '').substring(0, 30); r._formAuto = true; }
      if (b === 'accseq' && r.accseq != null && r.accseq !== '') r.accseq = String(r.accseq).replace(/[^0-9]/g, '').substring(0, 3);
      if (!r._new) r._dirty = true;
      g.invalidate();
     });
     this.applyColumns();
    }

    isDirty() { return this.cv.sourceCollection.some(r => r._dirty || r._new); }
    rows() { return this.cv.sourceCollection; }
    cur() { return this.grid.collectionView.currentItem; }

    confirmLeave(next) {
     if (!this.isDirty()) { next(); return; }
     Alert.confirm('확인', '변경된 자료가 있습니다.\n저장하시겠습니까?', () => this.save(next), () => next());
    }

    // ── 탭별 칸 (원본 d_tb_ac001_1 · _2 · _3 · _6) ──
    applyColumns() {
     const C = wijmo.grid.Column, D = wijmo.grid.DataMap;
     const drcr = new D(DRCR, 'v', 'n'), dcpl = new D(DCPL, 'v', 'n');
     const ro = (b, h, w, al) => ({binding: b, header: h, width: w, isReadOnly: true, align: al || 'left'});
     const ed = (b, h, w, ml, al) => ({binding: b, header: h, width: w, maxLength: ml, align: al || 'left'});
     const ck = (b, h, w) => ({binding: b, header: h, width: w || 70, dataType: wijmo.DataType.Boolean, align: 'center'});
     const sel = (b, h, map) => ({binding: b, header: h, width: 80, dataMap: map, align: 'center'});
     let defs;
     switch (this.tab) {
      case 1: defs = [ro('acccd', '계정코드', 80, 'center'), ed('accnm', '계정명칭', '1.4*', 100),
       ed('uacccd', '상위계정', 80, 4, 'center'), ro('uaccnm', '상위계정명칭', '1*'), ro('acclv', '레벨', 55, 'center'),
       sel('drcr', '차대', drcr), sel('dcpl', '대손', dcpl), ck('spyn', '전표', 60), ck('useyn', '사용', 60),
       ed('cacccd', '차감계정', 80, 4, 'center'), ro('caccnm', '차감계정명칭', '1*'), ck('i7000', '판관비', 70)]; break;
      case 2: defs = [ro('acccd', '계정코드', 80, 'center'), ed('accnm', '계정명칭', '1.2*', 100),
       sel('drcr', '차대', drcr), sel('dcpl', '대손', dcpl), ck('spyn', '전표', 60),
       ed('formnm', '양식명칭', '1*', 30), ed('lossnm', '양식명칭(손실)', '1*', 30)]; break;
      case 3: defs = [ro('acccd', '계정코드', 80, 'center'), ro('accnm', '계정명칭', '1*'),
       ck('cltflag', '거래처필수', 110), ck('acnflag', '계좌필수', 110), ck('cardflag', '카드필수', 110), ck('divflag', '부서필수', 110)]; break;
      default: defs = [ro('acccd', '계정코드', 80, 'center'), ro('accnm', '계정명칭', '1*'),
       ck('ewolyn', '이월선택', 110), ed('accseq', '출력순서', 110, 3, 'right'), ck('ipflag', '세입표시', 110), ck('chulflag', '세출표시', 110)];
     }
     this.grid.columns.clear();
     defs.forEach(d => this.grid.columns.push(new C(d)));
    }

    count() {
     const n = this.cv.items.length;
     $('#acCount').text('전체 ' + n.toLocaleString() + '건');
    }

    // 서버 '1'/'0' ↔ 그리드 체크(true/false)
    fromServer(list) {
     return (list || []).map(r => { FLAGS.forEach(k => r[k] = String(r[k]) === '1'); return r; });
    }
    toServer(r) {
     const o = {};
     Object.keys(r).forEach(k => { if (k !== '_dirty' && k !== '_formAuto') o[k] = r[k]; });
     FLAGS.forEach(k => o[k] = r[k] ? '1' : '0');
     return o;
    }

    query() {
     return {
      stext: $('#acStext').val().trim(), drcr: $('#acDrcr').val(), dcpl: $('#acDcpl').val(),
      spyn: $('#acSpyn').is(':checked') ? '1' : '', useyn: $('#acUseyn').val()
     };
    }

    search(keepCode) {
     const _this = this;
     AjaxUtil.getAsyncData(this.url + '/read', this.query(), function (res) {
      if (!res || res.success === false) { Alert.alert('', (res && res.message) || '조회 중 오류가 발생했습니다.'); return; }
      _this.spjangnm = res.message || '';
      _this.cv.sortDescriptions.clear();   // 다시 조회하면 계정코드 순서로 돌아간다
      _this.cv.sourceCollection = _this.fromServer(res.data);
      _this.count();
      if (keepCode) _this.selectCode(keepCode);
     });
    }

    selectCode(code) {
     const i = this.cv.items.findIndex(r => r.acccd === code);
     if (i < 0) return;
     this.cv.moveCurrentToPosition(i);
     this.grid.select(i, 1);
     this.grid.scrollIntoView(i, 1);
    }

    // 원본 ue_new : 고른 계정 코드 ~ 그 계정의 toaccd 사이 빈 첫 코드, 고른 계정 값 복사
    addRow() {
     const base = this.cur();
     if (!base) { Alert.alert('확인', '기준이 될 계정을 먼저 고르세요.'); return; }
     const src = this.rows();
     // 끝 코드(toaccd)는 보통 «묶음 계정»(예: 1010 현금및현금성자산 → 1011~1099)에만 있다.
     // 하위 계정(예: 1011 현금)을 골랐으면 그 상위 계정의 범위를 쓴다.
     let toaccd = String(base.toaccd || '').trim();
     if (!/^\d{4}$/.test(toaccd)) {
      const parent = src.find(r => String(r.acccd) === String(base.uacccd || '').trim());
      toaccd = parent ? String(parent.toaccd || '').trim() : '';
     }
     if (!/^\d{4}$/.test(toaccd)) {
      Alert.alert('확인', '이 계정(' + base.acccd + ')과 상위 계정에 하위 계정을 만들 수 있는 코드 범위가 정해져 있지 않습니다.\n'
       + '범위가 있는 묶음 계정이나 그 아래 계정을 고른 뒤 [신규]를 누르세요.');
      return;
     }
     const used = new Set(src.map(r => String(r.acccd)));
     const from = parseInt(base.acccd, 10), to = parseInt(toaccd, 10);
     let code = null, lastIdx = src.indexOf(base);
     for (let n = from; n <= to; n++) {
      const cd = String(n).padStart(4, '0');
      if (!used.has(cd)) { code = cd; break; }
      const at = src.findIndex(r => String(r.acccd) === cd);
      if (at > lastIdx) lastIdx = at;
     }
     if (!code || code === toaccd) { Alert.alert('확인', '더 이상 신규계정을 생성 할 수 없습니다.'); return; }
     const nr = Object.assign({}, base, {acccd: code, accnm: '', formnm: '', lossnm: '', delyn: '1', spacc: false, useyn: true, _new: '1', _dirty: false, _formAuto: false});
     this.cv.sortDescriptions.clear();   // 새 행이 기준 계정 바로 아래에 보이도록 정렬을 푼다
     src.splice(lastIdx + 1, 0, nr);
     this.showTab(1);
     this.cv.refresh();
     this.count();
     this.selectCode(code);
     const ci = this.grid.columns.findIndex(c => c.binding === 'accnm');
     this.grid.select(this.grid.selection.row, ci);
     this.grid.focus();
    }

    save(after) {
     const _this = this;
     this.grid.finishEditing();
     const list = this.rows().filter(r => r._new || r._dirty).map(r => this.toServer(r));
     if (!list.length) { if (typeof after === 'function') after(); else Alert.alert('', '저장할 변경 내용이 없습니다.'); return; }
     const miss = list.find(r => !String(r.accnm || '').trim());
     if (miss) { Alert.alert('확인', '계정코드 ' + miss.acccd + ' 의 계정명칭을 입력하세요.'); return; }
     const badSeq = list.find(r => r.accseq != null && String(r.accseq).trim() !== '' && !/^\d{1,3}$/.test(String(r.accseq).trim()));
     if (badSeq) { Alert.alert('확인', '계정코드 ' + badSeq.acccd + ' 의 출력순서는 0~999 숫자로 입력하세요.'); return; }
     AjaxUtil.postJsonData(this.url + '/save', {rows: list}, function (res) {
      if (res && res.success) {
       if (typeof after === 'function') { after(); return; }
       const code = _this.cur() && _this.cur().acccd;
       Alert.alert('', '자료가 저장되었습니다.', () => _this.search(code));
      } else Alert.alert('확인', (res && res.message) || '저장 중 오류가 발생했습니다.');
     });
    }

    remove() {
     const _this = this;
     const r = this.cur();
     if (!r) { Alert.alert('', '삭제할 계정을 고르세요.'); return; }
     if (r._new) { this.rows().splice(this.rows().indexOf(r), 1); this.cv.refresh(); this.count(); return; }
     Alert.confirm('삭제', '계정코드 : ' + r.acccd + ' / 계정명칭 : ' + (r.accnm || '') + '\n삭제하시겠습니까?', function () {
      AjaxUtil.postJsonData(_this.url + '/delete', {acccd: r.acccd}, function (res) {
       if (res && res.success) {
        _this.rows().splice(_this.rows().indexOf(r), 1);
        _this.cv.refresh(); _this.count();
        Notify.success('자료가 삭제되었습니다.');
       } else Alert.alert('확인', (res && res.message) || '삭제 중 오류가 발생했습니다.');
      });
     });
    }

    showTab(n) {
     this.grid.finishEditing();
     this.tab = n;
     $('.bp-tabs button').removeClass('on').filter('[data-tab="' + n + '"]').addClass('on');
     $('#acNote').text(n === 4 ? '계정코드가 1로 시작하는 계정만 보입니다.'
      : n === 3 ? '체크한 항목은 전표입력에서 반드시 입력해야 합니다.'
       : '행을 고르고 [신규]를 누르면 그 계정 아래에 같은 설정으로 새 계정이 생깁니다. 셀을 고친 뒤 [저장]을 누르세요.');
     const code = this.cur() && this.cur().acccd;
     this.applyColumns();
     this.cv.refresh();
     this.count();
     if (code) this.selectCode(code);
    }

    esc(v) {
     return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }

    // 원본 d_tb_ac001_print
    print() {
     const list = this.rows().filter(r => !r._new);
     if (!list.length) { Alert.alert('', '출력할 자료가 없습니다.'); return; }
     const e = v => this.esc(v), yn = v => v ? '예' : '';
     const now = new Date(), p2 = n => (n < 10 ? '0' : '') + n;
     const ts = now.getFullYear() + '-' + p2(now.getMonth() + 1) + '-' + p2(now.getDate()) + ' ' + p2(now.getHours()) + ':' + p2(now.getMinutes());
     const html = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>계정과목</title><style>'
      + '@page{size:A4 landscape;margin:10mm} body{font-family:"맑은 고딕",sans-serif;color:#000;margin:0}'
      + 'h1{text-align:center;font-size:26px;letter-spacing:8px;margin:0 0 16px}'
      + '.hd{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}'
      + 'table{width:100%;border-collapse:collapse} thead{display:table-header-group}'
      + 'tr.a{page-break-inside:avoid} th,td{border:1px solid #000;padding:3px 5px;font-size:11px} th{font-weight:normal}'
      + 'td.c{text-align:center} .pg{position:fixed;bottom:0;left:0;font-size:11px} .pg::after{content:"페이지 : " counter(page)}'
      + '</style></head><body><h1>계정과목</h1>'
      + '<div class="hd"><span>' + e(this.spjangnm) + '</span><span>출력일시 : ' + ts + '</span></div>'
      + '<table><thead><tr><th rowspan="2" colspan="2" style="width:20%">계정과목</th><th colspan="2">상위계정과목</th><th style="width:7%">차대구분</th><th style="width:7%">전표계정</th><th rowspan="2" style="width:10%">재원구분</th><th>양식명칭</th></tr>'
      + '<tr><th colspan="2">차감계정과목</th><th>대손구분</th><th>특별회계</th><th>양식명칭(손실)</th></tr></thead><tbody>'
      + list.map(r => '<tr class="a"><td rowspan="2" class="c" style="width:5%">' + e(r.acccd) + '</td><td rowspan="2">' + e(r.accnm)
       + '</td><td class="c" style="width:5%">' + e(r.uacccd) + '</td><td>' + e(r.uaccnm) + '</td><td class="c">' + e(nmOf(DRCR, r.drcr))
       + '</td><td class="c">' + yn(r.spyn) + '</td><td rowspan="2" class="c">' + e(r.mssec) + '</td><td>' + e(r.formnm) + '</td></tr>'
       + '<tr class="a"><td class="c">' + e(r.cacccd) + '</td><td>' + e(r.caccnm) + '</td><td class="c">' + e(nmOf(DCPL, r.dcpl))
       + '</td><td class="c">' + yn(r.spacc) + '</td><td>' + e(r.lossnm) + '</td></tr>').join('')
      + '</tbody></table><div class="pg"></div></body></html>';
     const w = window.open('', '_blank', 'width=1100,height=750');
     if (!w) { Alert.alert('', '팝업이 차단되어 인쇄창을 열 수 없습니다.'); return; }
     w.document.open(); w.document.write(html); w.document.close(); w.focus();
     setTimeout(() => w.print(), 300);
    }

    // 원본 d_tb_ac001_1_exl
    excel() {
     const list = this.rows().filter(r => !r._new);
     if (!list.length) { Alert.alert('', '내보낼 자료가 없습니다.'); return; }
     const head = ['계정코드', '계정명칭', '상위계정', '상위계정명칭', '레벨', '차대', '대손', '전표', '사용', '차감계정', '차감계정명칭'];
     const data = list.map(r => [r.acccd, r.accnm, r.uacccd, r.uaccnm, r.acclv, nmOf(DRCR, r.drcr), nmOf(DCPL, r.dcpl),
      r.spyn ? '예' : '', r.useyn ? '예' : '', r.cacccd, r.caccnm]);
     try {
      const wb = new wijmo.xlsx.Workbook(), sh = new wijmo.xlsx.WorkSheet();
      sh.name = '계정과목';
      [head].concat(data).forEach((row, ri) => {
       const xr = new wijmo.xlsx.WorkbookRow();
       row.forEach(v => { const c = new wijmo.xlsx.WorkbookCell(); c.value = v == null ? '' : String(v); if (ri === 0) c.style = {font: {bold: true}}; xr.cells.push(c); });
       sh.rows.push(xr);
      });
      wb.sheets.push(sh);
      wb.saveAsync('계정과목.xlsx');
     } catch (err) {
      const csv = '﻿' + [head].concat(data).map(r => r.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8'}));
      a.download = '계정과목.csv'; document.body.appendChild(a); a.click(); a.remove();
     }
    }
   }

   let page = null;
   $(document).ready(function () {
    page = new AccountPage();
    page.search();

    $('#btnAcSearch').on('click', () => page.confirmLeave(() => page.search()));
    $('#acStext').on('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#btnAcSearch').click(); } });
    $('#acDrcr, #acDcpl, #acUseyn, #acSpyn').on('change', () => page.confirmLeave(() => page.search()));
    $('#btnAcNew').on('click', () => page.addRow());
    $('#btnAcSave').on('click', () => page.save());
    $('#btnAcDelete').on('click', () => page.remove());
    $('#btnAcPrint').on('click', () => page.print());
    $('#btnAcExcel').on('click', () => page.excel());
    $('.bp-tabs button').on('click', function () { page.showTab(+$(this).data('tab')); });

    $(document).on('keydown', function (e) {
     if (e.key === 'F4') { e.preventDefault(); $('#btnAcSearch').click(); }
     if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); page.save(); }
    });
    window.addEventListener('beforeunload', function (e) {
     if (page && page.isDirty()) {
      e.preventDefault();
      e.returnValue = '';
     }
    });
   });
  </script>
</th:block>
