<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <title>급여명세서</title>
  <style>
      /* openhtmltopdf 는 head 안의 style 만 읽는다.
         body 안에 두면 적용되지 않고 글자로 출력되며, font-family 가 안 먹어
         한글이 전부 두부(#)로 나온다.

         font-family 는 PdfRendererBuilder.useFont(...) 로 등록한 이름과
         정확히 일치해야 한다. 현재 등록: MalgunGothic (Regular + Bold, 둘 다 TTF).
         NotoSansKR-Bold.otf 는 CFF 아웃라인이라 이 렌더러가 로드하지 못하고,
         조용히 내장 폰트로 넘어가 굵은 한글만 # 으로 찍힌다.

         이 파일은 PDF·인쇄 전용이다. 화면 미리보기는 payslip_view.html 이 담당한다.
         flex · grid · CSS 변수는 렌더러가 지원하지 않으므로 쓰지 않는다. */

      @page { size: A4; margin: 12mm 11mm; }

      html, body {
          margin: 0; padding: 0;
          font-family: "MalgunGothic", sans-serif;
          font-size: 9pt;
          line-height: 1.35;
          color: #000;
      }

      h1 {
          text-align: center;
          font-size: 17pt;
          font-weight: bold;
          letter-spacing: 6px;
          margin: 0 0 10px 0;
      }

      table { border-collapse: collapse; width: 100%; page-break-inside: avoid; }
      td {
          border: 1px solid #4a6741;
          padding: 3px 6px;
          height: 19px;
          vertical-align: middle;
      }

      /* 머리칸 : 연한 녹색 / 구획 머리 : 진한 녹색 */
      .ps-hd  { background: #d9e6d4; font-weight: bold; text-align: center; }
      .ps-hd2 { background: #c3d9bb; font-weight: bold; text-align: center; }

      .ps-c    { text-align: center; }
      .ps-n    { text-align: right; }
      .ps-blue { color: #0000cc; }
      .ps-b    { font-weight: bold; }

      .ps-gap { height: 8px; }

      /* 합계 */
      .ps-sum { background: #d9e6d4; font-weight: bold; text-align: center; }
      .ps-net { text-align: right; font-weight: bold; font-size: 11pt; }

      /* 항목별 계산방법 */
      .ps-calc td { font-size: 8pt; height: 18px; }

      /* spjangnm — 우측 하단 */
      .ps-foot { text-align: right; font-weight: bold; font-size: 12pt; margin-top: 14px; }
  </style>
</head>
<body>

<!-- 레거시 헤더: string(paybasic,'@@@@년 @@월') + case(paytype) -->
<h1 th:text="${head.title}">급 여 명 세 서</h1>

<!-- 기준월 · 급여지급일 · 인적사항 -->
<table>
  <tr>
    <td class="ps-hd" style="width:13%">기준월</td>
    <td class="ps-c ps-b" colspan="2" style="width:37%"
        th:text="${#strings.substring(head.paybasic,0,4)} + '년 ' + ${#strings.substring(head.paybasic,4,6)} + '월'"></td>
    <td class="ps-hd" style="width:17%">급여지급일</td>
    <td class="ps-c ps-blue" colspan="2" style="width:33%" th:text="${payDateText}"></td>
  </tr>
  <tr>
    <td class="ps-hd" rowspan="3">인적사항</td>
    <td class="ps-hd">부서명</td>
    <td class="ps-c ps-blue" th:text="${head.divinm}"></td>
    <td class="ps-hd">직위</td>
    <td class="ps-c ps-blue" colspan="2" th:text="${head.rspnm}"></td>
  </tr>
  <tr>
    <td class="ps-hd">성명</td>
    <td class="ps-c ps-blue" th:text="${head.pernm}"></td>
    <td class="ps-hd">사원번호</td>
    <!-- 레거시 mid(perid, 2) — 앞 한 자리를 잘라 표시 -->
    <td class="ps-c ps-blue" colspan="2" th:text="${head.peridview}"></td>
  </tr>
  <tr>
    <td class="ps-hd">생년월일</td>
    <td class="ps-c ps-blue" th:text="${birthText}"></td>
    <td class="ps-hd">급여계좌</td>
    <td class="ps-c ps-blue" colspan="2" th:text="${head.accnum}"></td>
  </tr>
</table>

<div class="ps-gap"></div>

<!-- 지급 / 공제 -->
<table>
  <tr>
    <td class="ps-hd2" colspan="2" style="width:43%">지 급 항 목</td>
    <td class="ps-hd2" style="width:12%">근로시간</td>
    <td class="ps-hd2" colspan="2" style="width:45%">공 제 항 목</td>
  </tr>

  <tr th:each="i : ${#numbers.sequence(0, rowCount - 1)}">
    <td class="ps-c" style="width:26%" th:text="${i &lt; payItems.size()} ? ${payItems[i].itemnm} : ''"></td>
    <td class="ps-n" style="width:17%" th:text="${i &lt; payItems.size()} ? ${#numbers.formatInteger(payItems[i].amount ?: 0,0,'COMMA')} : ''"></td>
    <td class="ps-c" style="width:12%" th:text="${i &lt; payItems.size()} ? (${payItems[i].workhour} ?: '') : ''"></td>
    <td class="ps-c" style="width:24%" th:text="${i &lt; deductItems.size()} ? ${deductItems[i].itemnm} : ''"></td>
    <td class="ps-n" style="width:21%" th:text="${i &lt; deductItems.size()} ? ${#numbers.formatInteger(deductItems[i].amount ?: 0,0,'COMMA')} : ''"></td>
  </tr>

  <tr>
    <td class="ps-sum">지급총액</td>
    <td class="ps-n ps-b" colspan="2" th:text="${#numbers.formatInteger(head.paysum ?: 0,0,'COMMA')}"></td>
    <td class="ps-sum">공제총액</td>
    <td class="ps-n ps-b" th:text="${#numbers.formatInteger(head.dedsum ?: 0,0,'COMMA')}"></td>
  </tr>
  <tr>
    <td class="ps-sum">실수령액</td>
    <td class="ps-net" colspan="4" th:text="${#numbers.formatInteger(head.netpay ?: 0,0,'COMMA')}"></td>
  </tr>
</table>

<div class="ps-gap"></div>

<!-- TB_PB203 근태 -->
<table>
  <tr>
    <td class="ps-hd" style="width:22%">근 로 일 수</td>
    <td class="ps-c" style="width:28%" th:text="${head.workday}"></td>
    <td class="ps-hd" style="width:25%">총 근로시간</td>
    <td class="ps-c" style="width:25%" th:text="${head.worktime}"></td>
  </tr>
</table>

<div class="ps-gap"></div>

<!-- 항목별 계산방법 : 근로기준법 제48조② 필수 기재사항 -->
<table class="ps-calc" th:if="${calcItems != null and !calcItems.isEmpty()}">
  <tr><td class="ps-hd2" colspan="4">항 목 별 계 산 방 법</td></tr>
  <tr>
    <td class="ps-hd" style="width:14%">구 분</td>
    <td class="ps-hd" style="width:36%">산출식 및 산출방법</td>
    <td class="ps-hd" style="width:14%">구 분</td>
    <td class="ps-hd" style="width:36%">산출식 및 산출방법</td>
  </tr>
  <tr th:each="c : ${calcItems}">
    <td class="ps-c" th:text="${c.lgb}"></td>
    <td th:text="${c.lformula}"></td>
    <td class="ps-c" th:text="${c.rgb}"></td>
    <td th:text="${c.rformula}"></td>
  </tr>
</table>

<!-- 레거시 하단 spjangnm -->
<div class="ps-foot" th:text="${head.spjangnm}"></div>

</body>
</html>
