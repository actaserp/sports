<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<style>
</style>
<th:block layout:fragment="content">

  <!--- (레이아웃) Contents 영역 -->
  <div class="layout-contents">
    <!-- Page Title -->
    <div class="page-title-wrap">
      <div class="left">
        <h2>결재라인등록</h2>
        <a href="#" title="북마크" class="bookmark toggle">
          내메뉴
        </a>
      </div>
      <ul class="page-navi">
        <li><img th:src="@{/images/icon/ico-nav-home.svg}" alt="홈아이콘"></li>
        <li>결재라인관리</li>
        <li>결재라인등록</li>
      </ul>
    </div>

    <div class="tab-wrap">
      <div class="tab-contents">
        <!-- Section -->
        <section class="tab-item" id="tab1">
          <div class="section-top">
            <div class="title-wrap">
              <h3>결재라인등록</h3>
            </div>
            <div class="button-wrap" style="justify-content: end">
              <ul>
                <li>
                  <a id="newdataBtn" class="btn btn-excell" title="신규등록" onclick="resetFormFields(); resetGridAndComcd();">
                    <img th:src="@{/images/icon/ico-plus.svg}" alt="등록 아이콘">
                    신규등록
                  </a>
                </li>
                <li>
                  <a class="btn btn-delete" id="deleteButton" title="삭제">
                    <img th:src="@{/images/icon/ico-delete.svg}" alt="삭제 아이콘">
                    삭제
                  </a>
                </li>
                <li>
                  <a class="btn btn-edit" id="btnSave" title="저장" onclick="save()">
                    <img th:src="@{/images/icon/ico-save.svg}" alt="저장 아이콘">
                    저장
                  </a>
                </li>
              </ul>
            </div>
          </div>
          <div class="table-wrap">
            <table class="write-table">
              <caption>결재라인 입력 테이블</caption>
              <input type="hidden" id="064no">
              <tbody>
              <tr>
                <th style="text-align: center">
                  <label for="comcd">
                    문서코드
                  </label>
                </th>
                <td colspan="3">
                  <select id="comcd" onchange="changeComcdSelect()">
                    <option></option>
                  </select>
                </td>
              </tr>
              <tr>
                <th style="text-align: center">
                  <label for="perid">
                    등록사원
                  </label>
                </th>
                <td>
                  <select id="perid" style="width: 150px;" onchange="changePeridSelect()">
                    <option></option>
                  </select>
                </td>
                <th style="text-align: center">
                  <label for="pernm">
                    등록사원코드
                  </label>
                </th>
                <td>
                  <input type="text" id="pernm" style="width: 80px" readonly>
                </td>
                <th style="text-align: center">
                  <label for="kcperid">
                    결재자
                  </label>
                </th>
                <td>
                  <select id="kcperid" style="width: 150px;" onchange="changeKcpSelect()">
                    <option></option>
                  </select>
                </td>
                <th style="text-align: center">
                  <label for="kcpernm">
                    결재자코드
                  </label>
                </th>
                <td>
                  <input id="kcpernm" style="width: 80px;" readonly>
                </td>
                <th style="text-align: center">
                  <label for="gubuncd">
                    결재구분
                  </label>
                </th>
                <td>
                  <select id="gubuncd" style="width: 150px;">
                    <option value="">선택</option>
                  </select>
                </td>
                <th style="text-align: center">
                  <label for="comseq">
                    결재순서
                  </label>
                </th>
                <td>
                  <input type="number" id="comseq" style="width: 80px;">
                </td>
              </tr>
              </tbody>
            </table>
          </div>
          <div class="container-fluid">
            <p id=""></p>
            <div id="theGrid2" style="max-height: 714px; height: 300px; margin-top: 40px;"></div>
          </div>
        </section>
      </div> <!--//tab-contens end-->
    </div> <!--//tab-wrap end-->
  </div> <!--//layout-contents end -->
  <footer style="margin-top:5px;">
    <p>Copyrightⓒ 0000 corp. All rights reserved.</p>
  </footer>
  <div style="height: 10px"></div>
</th:block>

<th:block layout:fragment="scripts">
  <th:block th:replace="common/columns_setting :: columns_setting"></th:block>

  <script type="text/javascript">

   var theGrid2;
   var viewdata2;
   let SelectItem;
   let csrfToken = $("[name=_csrf]").val();

   document.readyState === 'complete' ? init() : window.onload = init;

   function init() {
    // 결재문서코드
    AjaxUtil.fillSelectOptions($('#comcd'), 'appr_doc', 'all', false, 'appr_doc');
    // 등록사원 (결재자와 같은 사원 목록)
    AjaxUtil.fillSelectOptions($('#perid'), 'person', 'choose', false, 'person');
    // 결재자
    AjaxUtil.fillSelectOptions($('#kcperid'), 'person', 'choose', false, 'person');
    // 결재구분
    AjaxUtil.fillSelectOptions($('#gubuncd'), 'system_code', 'choose', false, 'Payment');

    // 로그인 사용자를 등록사원 기본값으로 선택 후 그리드 조회
    getMyInfo();
   }

   // 세부내용 그리드
   function fetchListData2() {
    let data2 = [];

    $.ajax({
     url: '/api/approval/read',
     type: 'GET',
     data: {
      'comcd': $('#comcd').val(),
      'personid': $('#perid').val()
     },
     async: false,
     success: function (data) {
      data2 = data.data || [];
      // 5개 미만이면 빈 행 추가
      while (data2.length < 5) {
       data2.push({});
      }
     }
    });

    viewdata2 = new wijmo.collections.CollectionView(data2);

    if (!theGrid2) {

     theGrid2 = new wijmo.grid.FlexGrid('#theGrid2', {
      autoGenerateColumns: false,
      showMarquee: true,
      isReadOnly: true,
      selectionMode: wijmo.grid.SelectionMode.Row,
      columns: [
       {binding: 'no', header: 'No', width: 80, align: 'right'},
       {binding: 'kcperid', header: '결재자코드', width: '*', minWidth: 100, align: 'center'},
       {binding: 'kcpernm', header: '결재자명', width: '*', minWidth: 100, align: 'center'},
       {binding: 'papercd', header: '문서코드', visible: false},
       {binding: 'perid', header: '사원코드', visible: false},
       {binding: 'papernm', header: '문서종류', width: '*', minWidth: 100, align: 'center'},
       {binding: 'gubunnm', header: '구분', width: '*', minWidth: 100, align: 'center'},
       {binding: 'seq', header: '결재순서', width: '*', minWidth: 100, align: 'center'}
      ],
      itemsSource: viewdata2
     });

     // 헤더 중앙 정렬
     theGrid2.formatItem.addHandler(function (s, e) {
      if (e.panel === s.columnHeaders) {
       e.cell.style.textAlign = 'center';
      }
     });

     // 첫 열 체크박스
     new wijmo.grid.selector.Selector(theGrid2, {
      itemChecked: () => {
       SelectItem = theGrid2.rows.filter(r => r.isSelected);
      }
     });

     // 더블클릭 → 상세 조회 후 입력란 바인딩
     theGrid2.hostElement.addEventListener('dblclick', function (e) {
      let hitTest = theGrid2.hitTest(e);
      if (hitTest.cellType !== wijmo.grid.CellType.Cell) return;

      let item = theGrid2.rows[hitTest.row].dataItem;
      if (!item || !item.no) return; // 빈 행 방어

      let data = {
       'no'      : item.no,
       'papercd' : item.papercd,
       'perid'   : item.perid
      };

      AjaxUtil.getAsyncData('/api/approval/detail', data, function (res) {
       if (res != null && res.success && res.data) {
        let detail = res.data;

        document.getElementById('kcpernm').value = detail.kcperid;
        document.getElementById('comseq').value  = detail.seq;
        document.getElementById('064no').value   = detail.no;
        document.getElementById('gubuncd').value = detail.gubun;

        setSelectedIndex(document.getElementById('kcperid'), detail.kcpernm);
        document.getElementById('btnSave').title = "수정";
       }
      });
     });

     theGrid2.hostElement.style.maxHeight = '300px';
     theGrid2.hostElement.style.overflowY = 'auto';
     new FlexGridContextMenu(theGrid2);
     window.downloadFileName = '결재라인';
    } else {
     theGrid2.itemsSource = viewdata2;
    }
    SelectItem = [];
   }

   // 문서코드 변경
   function changeComcdSelect() {
    fetchListData2();
   }

   // 등록사원 변경 → 코드 표시, 입력란 초기화, 해당 사원 결재라인 조회
   function changePeridSelect() {
    document.getElementById('pernm').value = $('#perid').val() || '';
    resetFormFields();
    fetchListData2();
   }

   // option 텍스트로 선택
   function setSelectedIndex(selectElement, selectedValue) {
    let found = false;

    for (let i = 0; i < selectElement.options.length; i++) {
     if (selectElement.options[i].text.trim().toLowerCase() === String(selectedValue).trim().toLowerCase()) {
      selectElement.selectedIndex = i;
      found = true;
      break;
     }
    }

    if (!found) {
     selectElement.selectedIndex = 0;
    }
   }

   // 결재자 선택 시 코드 표시
   function changeKcpSelect() {
    document.getElementById('kcpernm').value = $('#kcperid').val() || '';
   }

   // 삭제 버튼
   $(document).ready(function () {
    $('#deleteButton').off('click').on('click', deleteBody);
   });

   // 선택 행 삭제 (모든 행 삭제 시 063 정보도 같이 삭제)
   function deleteBody() {
    if (SelectItem === undefined || SelectItem.length === 0) {
     Alert.alert('', '삭제할 항목을 선택해 주세요.');
     return;
    }
    Alert.confirm('', '선택된 행 내용을 삭제하시겠습니까?', function () {
     SelectItem.forEach(selectedRow => {
      const selectedData = selectedRow.dataItem;
      if (selectedData && selectedData.kcperid) {
       let deleteNum = {
        kcperid: selectedData.kcperid,
        papercd: selectedData.papercd,
        perid: selectedData.perid,
        no: selectedData.no
       };
       AjaxUtil.postAsyncData('/api/approval/delete', deleteNum, function (res) {
        if (res.success) {
         fetchListData2();
        }
       });
      }
     });
     Alert.alert("", "삭제되었습니다.");
    });
   }

   // 입력란 초기화 (등록사원은 유지)
   function resetFormFields() {
    ['kcperid', 'kcpernm', 'comseq', '064no', 'gubuncd'].forEach(fieldId => {
     document.getElementById(fieldId).value = '';
    });
    document.getElementById('btnSave').title = "저장";
   }

   // 화면 전체 초기화
   function resetGridAndComcd() {
    document.getElementById('comcd').value = '';
    fetchListData2();
   }

   // 로그인 사용자 정보 → 등록사원 기본 선택
   function getMyInfo() {
    $.ajax({
     url: '/api/approval/getUserInfo',
     type: 'GET',
     success: function (res) {
      if (res && res.data && res.data.personid != null) {
       $('#perid').val(String(res.data.personid));
       document.getElementById('pernm').value = $('#perid').val() || '';
      }
      fetchListData2();
     },
     error: function (error) {
      console.error("getMyInfo 실패:", error);
      fetchListData2();
     }
    });
   }

   // 저장
   function save() {
    let requiredFields = [
     {id: '#perid',   label: '등록사원을 선택해주세요'},
     {id: '#comcd',   label: '문서코드를 선택해주세요'},
     {id: '#kcperid', label: '결재자를 선택해주세요'},
     {id: '#comseq',  label: '결재순서를 지정해주세요'},
     {id: '#gubuncd', label: '결재구분을 선택해주세요'}
    ];
    for (let i = 0; i < requiredFields.length; i++) {
     let field = requiredFields[i];
     let $element = $(field.id);
     let value = $element.val();

     if ($element.length === 0 || value === null || String(value).trim() === '') {
      Alert.alert('', field.label);
      return;
     }
    }

    const title = document.getElementById('btnSave').title;
    let alertMessage = (title === "저장") ? '저장하시겠습니까?' : '수정하시겠습니까?';

    Alert.confirm('', alertMessage, function () {
     let formData = new FormData();
     formData.append('personid',   $('#perid').val());
     formData.append('papercd',    $('#comcd').val());
     formData.append('gubun',      $('#gubuncd').val());
     formData.append('seq',        $('#comseq').val());
     formData.append('kcpersonid', $('#kcperid').val());
     formData.append('no',         $('#064no').val());

     $.ajax({
      url: '/api/approval/save',
      type: 'POST',
      data: formData,
      processData: false,
      contentType: false,
      headers: {
       'X-CSRF-Token': $('[name=_csrf]').val()
      },
      success: function (response) {
       if (response.success) {
        Alert.alert('', response.message, function () {
         fetchListData2();
         resetFormFields();
        });
       } else {
        Alert.alert('', response.message || '저장에 실패했습니다.');
       }
      },
      error: function () {
       Alert.alert('', '에러가 발생하였습니다.');
      }
     });
    });
   }
  </script>

</th:block>
</html>
