<!--
  사업계획서(사업별) — PowerBuilder w_tb_x0002_sh1 / d_tb_x0002_sh1 이식. 2026-11-11
  * 사업년도 입력(비우면 당해 연도) → 조회 / 인쇄 / EXCEL
  * 열: 사업구분(부문) · 사업코드 · 사업명 · 사업기간(FROM) · 사업기간(TO) · 장소 · 참가인원
  * 정렬: 부문 순서(TB_X0001.seqno) → 부문 → 사업기간(FROM, 기간 없는 사업 먼저) → 사업기간(TO) → 사업코드
  * 사업구분은 부문이 바뀌는 첫 행에만 표시 (원본과 같음)
  * 인쇄: A4 가로, 한 쪽 25줄, 쪽마다 머리글 · '페이지 : n (전체)'. 인쇄 여백 0 이라 브라우저 머리글이 찍히지 않는다
  * API  GET /api/budget/report/planByProject?yyyy=
-->
<html layout:decorate="~{layout_page}" xmlns:layout="http://www.w3.org/1999/xhtml">
<th:block layout:fragment="content">
  <style>
      .layout-contents { height: 100vh !important; min-height: 0 !important; box-sizing: border-box; padding-bottom: 8px !important; overflow: hidden !important; }
      .layout-contents section { flex: 1 1 auto !important; min-height: 0 !important; overflow: auto !important; }

      .pp-bar { display: flex; align-items: flex-end; gap: 10px; margin-bottom: 14px; }
      .pp-bar dl dt { font-size: 14px; font-weight: 700; color: #4d4d4d; margin-bottom: 4px; }
      .pp-bar .right { margin-left: auto; display: flex; gap: 6px; }
      #ppGrid { height: 600px; }

      /* 인쇄용 (화면에서는 숨김) */
      #ppPrint { display: none; }
      .pp-paper {
          width: 297mm; height: 210mm; box-sizing: border-box; background: #fff;
          padding: 10mm 12mm 8mm; font-family: 'Malgun Gothic', sans-serif; color: #000;
          display: flex; flex-direction: column; overflow: hidden;
      }
      .pp-paper .pp-body { flex: 1; min-height: 0; overflow: hidden; }
      /* 줄바꿈되는 칸이 있어도 숫자는 한 줄 */
      table.pp td.c { white-space: nowrap; }
      .pp-title { text-align: center; font-size: 24px; font-weight: 700; letter-spacing: 2px; margin: 0 0 12px; }
      .pp-title-space { height: 34px; margin: 0 0 12px; }
      .pp-meta { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
      .pp-page-no { text-align: center; font-size: 11px; padding-top: 4px; }
      table.pp { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11.5px; border-top: none; }
      table.pp th, table.pp td {
          border: 1px solid #000; height: 19px; padding: 1px 6px; background: #fff; width: auto;
          font-weight: 400; white-space: normal; word-break: keep-all; overflow-wrap: anywhere; line-height: 1.3;
      }
      table.pp th { text-align: center; }
      table.pp td.l { text-align: left; }
      table.pp td.c { text-align: center; }

      @page { size: A4 landscape; margin: 0; }
      @media print {
          body * { visibility: hidden; }
          #ppPrint, #ppPrint * { visibility: visible; }
          #ppPrint { display: block; position: absolute; left: 0; top: 0; }
          .pp-paper { page-break-after: always; break-after: page; }
          .pp-paper:last-child { page-break-after: auto; break-after: auto; }
          * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      }
  </style>

  <div class="layout-contents">
    <div class="page-title-wrap">
      <div class="left">
        <h2>사업계획서(사업별)</h2>
        <a class="bookmark toggle" title="북마크">내 메뉴</a>
      </div>
      <ul class="page-navi">
        <li><img alt="홈아이콘" th:src="@{/images/icon/ico-nav-home.svg}"></li>
        <li>예산관리</li>
        <li>예산서출력</li>
        <li>사업계획서(사업별)</li>
      </ul>
    </div>

    <section>
      <div class="pp-bar">
        <dl>
          <dt><label for="ppYyyy">사업년도</label></dt>
          <dd><input id="ppYyyy" maxlength="4" style="width:90px; text-align:center;" type="text"/></dd>
        </dl>
        <button class="btn btn-delete" id="btnPpSearch" title="조회" type="button">
          <img alt="검색 아이콘" th:src="@{/images/icon/btn-srch.svg}"> 조회
        </button>
        <span id="ppCount" style="font-size:13px; color:#666; margin-bottom:8px;"></span>
        <div class="right">
          <a class="btn btn-edit" id="btnPpPrint" title="인쇄">
            <img alt="인쇄 아이콘" th:src="@{/images/icon/ico-edit.svg}"> 인쇄
          </a>
          <a class="btn btn-excell" id="btnPpExcel" title="EXCEL">EXCEL</a>
        </div>
      </div>
      <div id="ppGrid"></div>
    </section>
  </div>

  <div id="ppPrint"></div>
</th:block>

<th:block layout:fragment="scripts">
  <script type="text/javascript">
   (function () {
    const API = '/api/budget/report/planByProject';
    let view = new wijmo.collections.CollectionView([]);
    let last = null;   // 마지막 조회 결과 (인쇄용)
    let grid = null;

    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
     c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    // 'yyyymmdd' → 'yyyy.mm.dd' (원본 표시 형식)
    const ymd = v => {
     const d = String(v == null ? '' : v).replace(/[^0-9]/g, '');
     return d.length === 8 ? `${d.substring(0, 4)}.${d.substring(4, 6)}.${d.substring(6, 8)}` : '';
    };
    const now = () => {
     const d = new Date(), p = n => String(n).padStart(2, '0');
     return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
    };
    const secText = r => r.bsecnm || r.bseccd || '';

    function initGrid() {
     grid = new wijmo.grid.FlexGrid('#ppGrid', {
      headersVisibility: wijmo.grid.HeadersVisibility.Column,
      autoGenerateColumns: false,
      isReadOnly: true,
      selectionMode: wijmo.grid.SelectionMode.Row,
      columns: [
       {binding: 'bsecnm', header: '사업구분', width: 140},
       {binding: 'busicd', header: '사업코드', width: 90, align: 'center'},
       {binding: 'businm', header: '사업명', width: '*', minWidth: 300},
       {binding: 'frdateTxt', header: '사업기간(FROM)', width: 130, align: 'center'},
       {binding: 'todateTxt', header: '사업기간(TO)', width: 130, align: 'center'},
       {binding: 'place', header: '장소', width: 220},
       {binding: 'entno', header: '참가인원', width: 140},
      ],
      itemsSource: view,
     });
     // 사업구분은 원본처럼 부문이 바뀌는 첫 행에만 표시
     grid.formatItem.addHandler((g, e) => {
      if (e.panel !== g.cells || g.columns[e.col].binding !== 'bsecnm') return;
      const cur = g.rows[e.row].dataItem, prev = e.row > 0 ? g.rows[e.row - 1].dataItem : null;
      if (prev && cur && prev.bseccd === cur.bseccd) e.cell.textContent = '';
     });
     new FlexGridContextMenu(grid);
    }

    function retrieve() {
     let yyyy = String($('#ppYyyy').val() || '').trim();
     if (yyyy === '') { yyyy = String(new Date().getFullYear()); $('#ppYyyy').val(yyyy); }
     if (!/^\d{4}$/.test(yyyy)) {
      Alert.alert('', '사업년도를 4자리로 입력하세요.');
      $('#ppYyyy').focus();
      return;
     }
     AjaxUtil.getAsyncData(API, {yyyy: yyyy}, res => {
      if (!res || !res.success) {
       Alert.alert('', (res && res.message) || '조회 중 오류가 발생했습니다.');
       return;
      }
      const data = res.data || {};
      const rows = (data.rows || []).map(r => Object.assign({}, r, {
       bsecnm: secText(r), frdateTxt: ymd(r.frdate), todateTxt: ymd(r.todate)
      }));
      last = {yyyy: data.yyyy, spjangnm: data.spjangnm, rows: rows};
      view.sourceCollection = rows;
      $('#ppCount').text(`${data.yyyy}년 · ${rows.length}건`);
     });
    }


    /**
     * 인쇄 쪽 나누기 — 줄 수가 아니라 실제 높이를 재서 넘치면 다음 쪽으로 넘긴다.
     * 긴 글자가 줄바꿈되어 행 높이가 달라져도 한 쪽을 넘치지 않는다.
     *  pageHtml(i): i번째 쪽 틀(빈 tbody, .pg-body, .pg-no 포함) / blocks: 함께 다닐 행 묶음 [[tr html, ...], ...]
     */
    function paginate(wrap, pageHtml, blocks) {
     const st = wrap.style;
     const hidden = getComputedStyle(wrap).display === 'none';
     if (hidden) { st.display = 'block'; st.position = 'absolute'; st.left = '-10000px'; st.top = '0'; }
     wrap.innerHTML = '';
     const pages = [];
     const add = () => {
      const t = document.createElement('div');
      t.innerHTML = pageHtml(pages.length).trim();
      const el = t.firstElementChild;
      wrap.appendChild(el);
      const pg = {el: el, body: el.querySelector('.pg-body'), tbody: el.querySelector('tbody')};
      pages.push(pg);
      return pg;
     };
     let cur = add();
     blocks.forEach(block => {
      const t = document.createElement('tbody');
      t.innerHTML = block.join('');
      const trs = [...t.children];
      trs.forEach(tr => cur.tbody.appendChild(tr));
      // 인쇄 시 글꼴·배율 차이로 화면보다 조금 길어지므로 여유(SAFE)를 둔다
      const SAFE = 24;
      if (cur.tbody.closest('table').getBoundingClientRect().bottom - cur.body.getBoundingClientRect().top > cur.body.clientHeight - SAFE && cur.tbody.children.length > trs.length) {
       trs.forEach(tr => tr.remove());
       cur = add();
       trs.forEach(tr => cur.tbody.appendChild(tr));
       // 새 쪽 첫 행의 반복값을 먼저 복원해서 높이에 반영
       const td = cur.tbody.querySelector('tr:first-child td[data-full]');
       if (td) td.textContent = td.dataset.full;
      }
     });
     pages.forEach((p, i) => {
      const n = p.el.querySelector('.pg-no');
      if (n) n.textContent = `페이지 : ${i + 1} (${pages.length})`;
      // 쪽 첫 행에서 숨겼던 반복값(월 · 사업구분 등)은 다시 보여준다
      const td = p.tbody.querySelector('tr:first-child td[data-full]');
      if (td) td.textContent = td.dataset.full;
     });
     if (hidden) { st.display = ''; st.position = ''; st.left = ''; st.top = ''; }
     return pages;
    }

    function buildPrint() {
     const rows = last.rows;
     const printed = now();
     const pageHtml = pi => `
      <div class="pp-paper">
       <div class="pp-body pg-body">
        ${pi === 0 ? `<div class="pp-title">${esc(last.yyyy)}년 사업계획서(사업별)</div>` : `<div class="pp-title-space"></div>`}
        <div class="pp-meta"><span>${esc(last.spjangnm || '')}</span><span>출력일시 : ${printed}</span></div>
        <table class="pp">
          <colgroup>
            <col style="width:12%"><col style="width:7%"><col style="width:31%"><col style="width:10%">
            <col style="width:10%"><col style="width:18%"><col style="width:12%">
          </colgroup>
          <thead><tr>
            <th>사업구분</th><th>사업코드</th><th>사업명</th><th>사업기간(FROM)</th>
            <th>사업기간(TO)</th><th>장소</th><th>참가인원</th>
          </tr></thead>
          <tbody></tbody>
        </table>
       </div>
       <div class="pp-page-no pg-no"></div>
      </div>`;
     const blocks = rows.map((r, i) => {
      const same = i > 0 && rows[i - 1].bseccd === r.bseccd;   // 사업구분은 바뀌는 첫 행에만
      return [`<tr>
            <td class="l" data-full="${esc(r.bsecnm)}">${same ? '' : esc(r.bsecnm)}</td><td class="c">${esc(r.busicd)}</td><td class="l">${esc(r.businm)}</td>
            <td class="c">${esc(r.frdateTxt)}</td><td class="c">${esc(r.todateTxt)}</td>
            <td class="l">${esc(r.place)}</td><td class="l">${esc(r.entno)}</td>
          </tr>`];
     });
     paginate(document.getElementById('ppPrint'), pageHtml, blocks);
    }

    $(document).ready(function () {
     initGrid();
     $('#ppYyyy').val(String(new Date().getFullYear()));
     $('#btnPpSearch').on('click', retrieve);
     $('#ppYyyy').on('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); retrieve(); } });
     $(document).on('keydown', e => { if (e.key === 'F4') { e.preventDefault(); retrieve(); } });
     $('#btnPpPrint').on('click', () => {
      if (!last || !last.rows.length) { Alert.alert('', '먼저 조회하세요.'); return; }
      buildPrint();
      window.print();
     });
     $('#btnPpExcel').on('click', () => {
      if (!last || !last.rows.length) { Alert.alert('', '먼저 조회하세요.'); return; }
      wijmo.grid.xlsx.FlexGridXlsxConverter.saveAsync(grid, {includeColumnHeaders: true},
       `사업계획서(사업별)_${last.yyyy}.xlsx`);
     });
     retrieve();
    });
   })();
  </script>
</th:block>
</html>
